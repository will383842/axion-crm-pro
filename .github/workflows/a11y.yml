name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  axe-playwright:
    name: axe-core Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: frontend/pnpm-lock.yaml }
      - name: Install deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # La cible doit EXISTER sur le runner. `http://app:5173` était le nom de
      # service du docker-compose local : sur un runner GitHub il ne résout pas
      # (`net::ERR_NAME_NOT_RESOLVED`), et `webServer` est neutralisé quand
      # `CI=true`. Depuis la création de ce job, les 4 pages échouaient donc
      # AVANT le premier contrôle axe : la porte n'a jamais mesuré une seule
      # règle d'accessibilité, elle a seulement toujours rougi.
      # On construit l'application et on la sert réellement ; c'est
      # `playwright.config.ts` qui démarre et arrête `vite preview`.
      - name: Build frontend (la cible que la porte doit mesurer)
        working-directory: frontend
        run: pnpm build
      - name: Run a11y E2E
        working-directory: frontend
        env:
          E2E_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
        # `--project=chromium` : seul navigateur installé ci-dessus. L'ancienne
        # commande lançait les 3 projets, dont firefox et webkit absents du
        # cache — 24 échecs « Executable doesn't exist » qui noyaient le vrai
        # défaut. Élargir à firefox/webkit suppose de les installer ici d'abord.
        run: pnpm exec playwright test tests/e2e/a11y.spec.ts --project=chromium --reporter=html
      # Étape 0, F17 (2026-08-18) — `navigation.spec.ts` n'était exécuté NULLE
      # PART : rouge en silence depuis l'accordéon de la PR #84. Il garde la
      # structure de la barre (six groupes, une seule entrée Contacts, aucun
      # cadenas) ; il tourne ici, sur le même `vite preview`, et il est BLOQUANT.
      - name: Run navigation E2E (BLOQUANT)
        working-directory: frontend
        env:
          E2E_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm exec playwright test tests/e2e/navigation.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report/

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm install -g @lhci/cli@0.13
      - run: lhci autorun --upload.target=temporary-public-storage --collect.url=https://staging.axion-crm-pro.com
        continue-on-error: true
