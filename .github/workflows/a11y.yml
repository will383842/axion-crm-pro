name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # 🔴 F38-008 — plafonds anti-gel, poses le 2026-08-22. Aucun job de la
  # chaine qualite n'avait de borne : sans elle un job herite du plafond
  # GitHub de 6 h, et SIX executions etaient figees entre 1 h 28 et 2 h 25
  # au moment de la mesure. Ce ne sont pas des budgets : ce sont des
  # plafonds, poses tres au-dessus de la duree utile. Si un job legitime
  # est tue, relever la borne EN CITANT la duree du run tue — jamais la
  # retirer. Explication complete : .github/workflows/ci.yml, en-tete.
  # Garde : backend/tests/Feature/Infra/WorkflowsBornesDeDureeTest.php
  axe-playwright:
    name: axe-core Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # F38-008 (navigateurs Playwright + parcours axe)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: 'pnpm', cache-dependency-path: frontend/pnpm-lock.yaml }
      # F38-014 / H44-008 (2026-08-22) — le repli `|| pnpm install` avalait
      # exactement l'échec que `--frozen-lockfile` sert à produire : dès que
      # `frontend/pnpm-lock.yaml` divergeait de `package.json`, cette porte
      # réinstallait un arbre de dépendances résolu à la volée, vert, et c'est
      # CET arbre-là — que rien d'autre ne validait — qu'axe-core et Playwright
      # mesuraient ensuite.
      # Mesure du 2026-08-22 : le même `frontend/` est déjà installé en
      # `--frozen-lockfile` SEUL et BLOQUANT par le job `frontend` de `ci.yml`
      # (« Install (BLOQUANT — lockfile figé) »). Le repli ne rattrapait donc
      # aucun cas qu'un autre gate ne fasse déjà rougir : il ne servait qu'à
      # mentir sur l'arbre réellement mesuré ici.
      - name: Install deps (BLOQUANT — lockfile figé)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # La cible doit EXISTER sur le runner. `http://app:5173` était le nom de
      # service du docker-compose local : sur un runner GitHub il ne résout pas
      # (`net::ERR_NAME_NOT_RESOLVED`), et `webServer` est neutralisé quand
      # `CI=true`. Depuis la création de ce job, les 4 pages échouaient donc
      # AVANT le premier contrôle axe : la porte n'a jamais mesuré une seule
      # règle d'accessibilité, elle a seulement toujours rougi.
      # On construit l'application et on la sert réellement ; c'est
      # `playwright.config.ts` qui démarre et arrête `vite preview`.
      - name: Build frontend (la cible que la porte doit mesurer)
        working-directory: frontend
        run: pnpm build
      - name: Run a11y E2E
        working-directory: frontend
        env:
          E2E_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
        # `--project=chromium` : seul navigateur installé ci-dessus. L'ancienne
        # commande lançait les 3 projets, dont firefox et webkit absents du
        # cache — 24 échecs « Executable doesn't exist » qui noyaient le vrai
        # défaut. Élargir à firefox/webkit suppose de les installer ici d'abord.
        run: pnpm exec playwright test tests/e2e/a11y.spec.ts --project=chromium --reporter=html
      # D28-002 / D27-002 (2026-08-20) — la porte a11y ci-dessus n'assurait que
      # sur `impact === 'critical'`. axe classe `color-contrast` en `serious` :
      # les 2 à 6 violations de contraste que le mode sombre produisait sur
      # chaque écran passaient donc la porte sans la faire rougir. `a11y.spec.ts`
      # assure désormais sur `critical` ET `serious` (moins un socle nommé et
      # borné), et visite chaque écran en clair PUIS en sombre.
      #
      # `dark-contraste.spec.ts` complète : elle ne regarde aucune classe, elle
      # CALCULE le rapport de contraste WCAG de chaque texte à partir de la
      # couleur réellement calculée par le navigateur. C'est elle qui prouve
      # qu'une déclaration `dark:` d'un composant n'est plus écrasée par la
      # feuille globale. BLOQUANTE, au même titre que les deux autres.
      - name: Run dark-mode contrast E2E (BLOQUANT)
        working-directory: frontend
        env:
          E2E_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm exec playwright test tests/e2e/dark-contraste.spec.ts --project=chromium --reporter=line
      # Étape 0, F17 (2026-08-18) — `navigation.spec.ts` n'était exécuté NULLE
      # PART : rouge en silence depuis l'accordéon de la PR #84. Il garde la
      # structure de la barre (six groupes, une seule entrée Contacts, aucun
      # cadenas) ; il tourne ici, sur le même `vite preview`, et il est BLOQUANT.
      - name: Run navigation E2E (BLOQUANT)
        working-directory: frontend
        env:
          E2E_PREVIEW: 'true'
          E2E_BASE_URL: http://127.0.0.1:4173
        run: pnpm exec playwright test tests/e2e/navigation.spec.ts --project=chromium --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-a11y-report
          path: frontend/playwright-report/

  # ⚠️ F38-006 (S2) — CE JOB NE MESURE RIEN, ET IL REND `success` DEPUIS TOUJOURS.
  # Mesure du 2026-08-22, dans l'arbre :
  #   · l'étape `lhci autorun` porte `continue-on-error: true` : quel que soit
  #     son code de sortie, le job rend `success` et AUCUNE PR ne peut rougir ;
  #   · aucun fichier `.lighthouserc*` n'existe dans le dépôt, donc `lhci` n'a
  #     AUCUNE assertion chiffrée à vérifier — même le filet retiré, il ne
  #     saurait pas sur quoi échouer.
  # Ne PAS retirer `continue-on-error` avant d'avoir vérifié à la main que
  # `https://staging.axion-crm-pro.com` répond 200 et que `lhci autorun` produit
  # un rapport : sinon on remplace une porte muette par une porte bloquée pour
  # toutes les PR, y compris celles qui ne touchent pas le frontend. L'ordre est
  # (1) vérifier la cible, (2) poser un `.lighthouserc.json` dont les seuils sont
  # décidés par un humain, (3) retirer la ligne `continue-on-error` ci-dessous ET
  # l'exception qui la nomme dans
  # `backend/tests/Feature/Infra/PorteA11yMesureCeQuElleAnnonceTest.php`.
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # F38-008
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - run: npm install -g @lhci/cli@0.13
      - run: lhci autorun --upload.target=temporary-public-storage --collect.url=https://staging.axion-crm-pro.com
        continue-on-error: true
