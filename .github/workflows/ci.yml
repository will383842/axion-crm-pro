name: CI

# =============================================================================
# CI BLOQUANTE — durcie le 2026-08-13 (PR « fix/ci-reelle », Gate 0 autopilot CRM)
# =============================================================================
# AVANT : `composer install` en `continue-on-error`, PHPStan / Pint / Pest en
# `|| true`, `pnpm lint || true`, gitleaks en `continue-on-error`. Une CI verte
# ne prouvait RIEN : le backend n'était jamais réellement vérifié (PHPStan ne
# démarrait même pas — phpstan.neon contenait deux clés supprimées en PHPStan 2).
#
# MAINTENANT : aucune étape de qualité n'est neutralisée. Si une étape rougit,
# la CI rougit — et le déploiement ne part pas : `deploy-direct-ssh.yml` appelle
# ce workflow (`uses: ./.github/workflows/ci.yml`) et son job `deploy` a
# `needs: [ci]`.
#
# Deux dettes existantes sont FIGÉES explicitement, jamais neutralisées :
#   - PHPStan niveau 8 : baseline `backend/phpstan-baseline.neon` (datée, note
#     en tête du fichier) — le NOUVEAU code doit être propre, la baseline ne
#     doit que décroître.
#   - Pint : le dépôt compte 276 fichiers non formatés ; reformater tout serait
#     un diff massif hors périmètre. Le contrôle porte donc sur les fichiers PHP
#     MODIFIÉS (équivalent `--dirty`), qui doivent être impeccables.
#
# Les audits de dépendances (pnpm audit / composer audit) et le scan de secrets
# vivent dans `security.yml` (déjà déclenché sur push + pull_request + cron) :
# ils ne sont pas dupliqués ici. Un audit de dépendances ne doit pas rougir une
# PR pour une CVE publiée le matin même sans rapport avec le diff.
# =============================================================================

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Appelé comme gate par deploy-direct-ssh.yml (push sur main).
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On n'annule QUE les runs de PR : annuler un run appelé par le déploiement
  # affamerait le deploy (piège connu « cancel-in-progress »).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ⚠️ 2026-08-16 — garde née d'un incident grave et parfaitement silencieux.
  # `infra/scripts/backup-postgres.sh` était committé en `100644` (sans bit
  # d'exécution). La tâche cron de sauvegarde quotidienne de la PRODUCTION
  # échouait donc sur « Permission denied » — 91 exécutions, 91 échecs, 100 %,
  # depuis le 2026-05-17. Le dossier de sauvegardes était VIDE. Personne ne
  # l'a vu, parce que cron écrit dans un journal que personne ne lit.
  #
  # Un `chmod +x` sur le serveur n'aurait pas suffi : le mode vient de git, il
  # serait revenu à 644 au premier déploiement suivant. C'est le mode DANS GIT
  # qui compte, et c'est donc lui qu'on vérifie ici.
  # 🔴 2026-08-19 — garde née d'une faille CRITIQUE, mesurée et non supposée.
  #
  # `docker-compose.yml` publie `55432:5432` (Postgres) et `56379:6379` (Redis)
  # pour le confort du poste de développement. Sur le serveur de production,
  # cela ouvre ces ports sur `0.0.0.0` — et Docker insère ses règles dans
  # iptables AVANT celles d'`ufw`. `ufw status` annonçait « seuls 22/80/443 » ;
  # la chaîne DOCKER acceptait pourtant `0.0.0.0/0 -> 172.18.0.4:5432`.
  #
  # Aggravant : `POSTGRES_PASSWORD: axion_dev_only` est écrit en clair dans
  # `docker-compose.yml`, dans un dépôt PUBLIC ; et Redis n'a aucun mot de passe.
  #
  # Preuve rejouée depuis un poste EXTÉRIEUR, par internet, le 2026-08-19 :
  # connexion SUPERUTILISATEUR à la base de production et lecture de
  # `count(*) from companies` = 4 295 349. Données personnelles.
  #
  # Correctif : `ports: !override []` dans `docker-compose.prod.yml`.
  # Cette garde vérifie la CONFIGURATION FUSIONNÉE, pas le texte d'un fichier :
  # `ports: []` sans le tag `!override` est un no-op silencieux (Compose fusionne
  # les listes), et c'est exactement le piège qui avait rendu l'overlay
  # inopérant sur `volumes` en août. Seule la fusion dit la vérité.
  config-prod:
    name: La config de production ne publie que 80 et 443
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inventaire des ports publiés par la configuration FUSIONNÉE
        run: |
          set -euo pipefail
          # `config` exige un `.env` présent (env_file du service api).
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/merged.yml

          echo "::group::configuration fusionnée — publications de ports"
          grep -n 'published:' /tmp/merged.yml || echo '(aucune)'
          echo "::endgroup::"

          # ⚠️ Extraction FAIL-CLOSED. La première version de ce job utilisait
          # `grep -oP … || true` : le jour où `grep -P` n'est pas disponible (ou
          # échoue sur la locale), la liste ressortait VIDE et le job passait
          # VERT sans avoir rien mesuré. Un contrôle qui réussit quand il ne
          # peut pas mesurer ne contrôle rien. Constaté en le rejouant à la main
          # le 2026-08-19.
          publies="$(awk -F'published: ' '/published: /{gsub(/"/,"",$2); print $2}' /tmp/merged.yml | sort -u)"
          echo "Ports publiés : ${publies:-aucun}"

          # TÉMOIN POSITIF — l'extraction a-t-elle seulement fonctionné ?
          # La production publie forcément 80 et 443 (Caddy). Si on ne les
          # trouve pas, ce n'est pas que tout va bien : c'est que la mesure est
          # cassée. On échoue plutôt que de rassurer.
          for attendu in 80 443; do
            if ! echo "$publies" | grep -qx "$attendu"; then
              echo "::error::Témoin positif en échec : le port $attendu (Caddy) n'a PAS été trouvé."
              echo "::error::L'extraction des ports ne fonctionne pas — ce job ne mesure rien."
              echo "::error::Corriger l'extraction avant de croire un résultat vert."
              exit 1
            fi
          done

          # Liste FERMÉE. Publier un port de plus en production est une décision
          # d'EXPOSITION : elle doit passer par une modification explicite de ce
          # job, jamais se glisser dans un overlay.
          inattendus=""
          for port in $publies; do
            case "$port" in
              80|443) ;;
              *) inattendus="$inattendus $port" ;;
            esac
          done

          if [ -n "$inattendus" ]; then
            echo "::error::La configuration de PRODUCTION publie des ports non autorisés :$inattendus"
            echo "::error::Un port publié écoute sur 0.0.0.0, et Docker insère ses règles iptables AVANT ufw :"
            echo "::error::le pare-feu annoncera « fermé » pendant que le port répondra depuis internet."
            echo "::error::Fermer avec « ports: !override [] » dans docker-compose.prod.yml,"
            echo "::error::ou, si l'exposition est VOULUE, l'ajouter explicitement à la liste de ce job."
            exit 1
          fi

          echo "OK — seuls 80 et 443 sont publiés par la configuration de production."

  caddyfile-valide:
    name: Le Caddyfile est-il valide ?
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # ── POURQUOI CE JOB EXISTE ────────────────────────────────────────────
      # `infra/caddy/Caddyfile` est le SEUL point d'entrée du site : un unique
      # processus tient 80 et 443. Depuis l'ajout de la préproduction
      # (2026-08-19), ce même fichier sert AUSSI `staging.*` — donc on y touche
      # plus souvent, et une faute de frappe n'y coûte plus « la préprod » mais
      # **toute la production** : Caddy refuse de démarrer sur un fichier
      # invalide, et plus rien ne répond.
      #
      # Jusqu'ici RIEN ne validait ce fichier. On s'en apercevait au
      # redémarrage — c'est-à-dire trop tard.

      - name: TÉMOIN — ce contrôle sait-il seulement échouer ?
        run: |
          set -uo pipefail
          # Une garde jamais vue rouge ne garde rien (§28.3). Plutôt que de
          # l'avoir vue rouge UNE FOIS pendant son écriture, on lui fait la
          # preuve À CHAQUE EXÉCUTION : on lui soumet d'abord un Caddyfile
          # volontairement fautif (accolade jamais refermée) et on exige qu'elle
          # le refuse.
          #
          # ⚠️ Ce témoin a lui-même failli mentir : à sa mise au point, la
          # commande a échoué parce que le montage n'avait PAS eu lieu (« no
          # such file or directory »). Un rouge obtenu pour la mauvaise raison
          # ne prouve rien. D'où le contrôle du MESSAGE : on exige une erreur
          # d'adaptation du Caddyfile, pas n'importe quel échec.
          mkdir -p /tmp/caddy-faux
          printf 'exemple.test {\n    reverse_proxy api:80 {\n        header_up X-Real-IP {remote_host}\n' \
            > /tmp/caddy-faux/Caddyfile

          sortie="$(docker run --rm -v /tmp/caddy-faux:/etc/caddy:ro caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1)"
          code=$?

          echo "::group::sortie du témoin"
          echo "$sortie"
          echo "::endgroup::"

          if [ "$code" -eq 0 ]; then
            echo "::error::TÉMOIN EN ÉCHEC : « caddy validate » a ACCEPTÉ un Caddyfile invalide."
            echo "::error::Ce job ne peut donc rien détecter — un vert ici ne voudrait rien dire."
            exit 1
          fi

          if ! echo "$sortie" | grep -q 'adapting config using caddyfile'; then
            echo "::error::TÉMOIN DOUTEUX : la commande a échoué, mais pas sur la SYNTAXE du fichier."
            echo "::error::(montage absent, image indisponible, réseau ?) — corriger avant de croire un vert."
            exit 1
          fi

          echo "OK — le contrôle sait refuser un Caddyfile fautif, et pour la bonne raison."

      - name: Le Caddyfile du dépôt est-il valide ?
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/infra/caddy:/etc/caddy:ro" caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          echo "OK — le Caddyfile est valide, Caddy démarrera dessus."

  scripts-executables:
    name: Les scripts d'infra sont-ils exécutables ?
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          # `git ls-files -s` donne le mode ENREGISTRÉ, pas celui du disque —
          # c'est la seule mesure qui survive à un clone.
          fautifs="$(git ls-files -s infra/scripts/*.sh | awk '$1 != "100755" { print $4 }')"
          if [ -n "$fautifs" ]; then
            echo "::error::Scripts d'infra sans bit d'exécution dans git :"
            printf '::error::  - %s\n' $fautifs
            echo "::error::Corriger avec : git update-index --chmod=+x <fichier>"
            echo "::error::Un script d'infra non exécutable échoue en silence sous cron."
            exit 1
          fi
          echo "Tous les scripts d'infra sont en 100755."

  backend:
    name: Backend Laravel (install + PHPStan + Pint + Pest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour disposer de la base de comparaison du contrôle Pint.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, redis, intl, mbstring, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}

      - name: Préparer l'arborescence Laravel inscriptible
        # Ni `bootstrap/cache` ni `storage/**` ne sont versionnés : sans eux,
        # `composer install` échoue dès `artisan package:discover`
        # (« bootstrap/cache directory must be present and writable »).
        run: |
          set -euo pipefail
          mkdir -p backend/bootstrap/cache \
                   backend/storage/app/private \
                   backend/storage/framework/cache/data \
                   backend/storage/framework/sessions \
                   backend/storage/framework/testing \
                   backend/storage/framework/views \
                   backend/storage/logs
          # Laravel lit `.env` au démarrage : sans lui, chaque test émet un
          # warning `file_get_contents(.env)` et `failOnWarning="true"`
          # (phpunit.xml) transforme la suite entière en échec. Les valeurs
          # utiles sont de toute façon écrasées par phpunit.xml et par l'env du
          # job (l'env réel a la priorité sur le fichier).
          cp .env.example backend/.env

      - name: Install (BLOQUANT)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan niveau 8 (BLOQUANT — baseline figée)
        working-directory: backend
        run: composer analyse

      - name: Pint — format des fichiers PHP modifiés (BLOQUANT)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Aucune base de comparaison disponible — rien à contrôler."
            exit 0
          fi
          echo "Base de comparaison : $base"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- 'backend/**/*.php' | sed 's|^backend/||')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun fichier PHP modifié — contrôle Pint sans objet."
            exit 0
          fi
          printf 'Fichiers contrôlés (%d) :\n' "${#files[@]}"
          printf '  - %s\n' "${files[@]}"
          cd backend
          ./vendor/bin/pint --test "${files[@]}"

      - name: Démarrage Postgres (PostGIS + pgvector + pg_partman) et Redis
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/axion-crm-pro-postgres:16-3.5-vector-partman"
          # Les migrations créent postgis ET vector : une image postgres nue ne
          # peut pas faire tourner la suite Feature. On réutilise donc l'image
          # de prod ; à défaut on la reconstruit depuis Dockerfile.postgres.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # ⚠️ 2026-08-16 — ce repli faisait dépendre un gate BLOQUANT de la
          # joignabilité de `deb.debian.org` et de deux clones GitHub :
          # `Dockerfile.postgres` compile pgvector et pg_partman depuis les
          # sources. Une PR Dependabot est tombée dessus (« Failed to fetch
          # libstdc++-10-dev … Connection reset by peer ») et a été signalée
          # rouge alors que le diff ne touchait qu'un paquet frontend. Un gate
          # qui rougit pour une raison étrangère au diff finit ignoré — c'est
          # le même piège que la police téléchargée au build.
          #
          # On retente donc, le tirage étant transitoire : d'abord le `pull`
          # (le chemin normal, ~10 s), puis le build de repli.
          reessayer() { # reessayer <tentatives> <commande...>
            local n=$1; shift
            for i in $(seq 1 "$n"); do
              if "$@"; then return 0; fi
              echo "::warning::échec de « $* » (tentative $i/$n)"
              sleep $((i * 10))
            done
            return 1
          }
          if ! reessayer 3 docker pull "$IMG"; then
            echo "::notice::Image GHCR indisponible — reconstruction locale depuis Dockerfile.postgres"
            reessayer 2 docker build -f Dockerfile.postgres -t "$IMG" .
          fi
          # --network host : PAS de publication de port. Avec `-p 5432:5432`, la
          # suite (qui ouvre une connexion PDO par test) traversait le proxy
          # userland de Docker, qui lâchait quelques connexions par exécution
          # (« server closed the connection unexpectedly ») — alors que les
          # journaux Postgres ne montraient AUCUN crash. Résultat : une CI qui
          # rougissait au hasard, donc un gate sans valeur. En réseau hôte,
          # Postgres écoute directement sur 127.0.0.1:5432.
          # --shm-size : /dev/shm de 64 Mo par défaut, trop juste.
          # fsync/full_page_writes/synchronous_commit off : base jetable de CI.
          # 2026-08-18 (étape 0) — MÊME locale que la production et que
          # `docker-compose.yml` (`--lc-collate=C --lc-ctype=C`). Sans cet
          # argument, la base de CI naissait en `en_US.utf8` : `lower()` y
          # abaisse les majuscules accentuées, pas en prod — la CI validait
          # une sémantique que la production n'a pas (empreintes d'opposition,
          # tris). Un test qui décrit la prod y rougissait sans que rien ne
          # l'explique.
          docker run -d --name axion-ci-postgres \
            --network host \
            --shm-size=1g \
            -e POSTGRES_USER=axion \
            -e POSTGRES_PASSWORD=axion_dev_only \
            -e POSTGRES_DB=axion_crm_test \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C" \
            "$IMG" \
            -c fsync=off -c full_page_writes=off -c synchronous_commit=off \
            -c max_connections=300
          docker run -d --name axion-ci-redis --network host redis:7.2-alpine
          # ⚠️ NE PAS tester la disponibilité avec `pg_isready` sur le socket
          # local : pendant son initialisation, l'entrypoint de l'image démarre
          # un serveur TEMPORAIRE en socket UNIX seulement (`listen_addresses=''`),
          # puis l'arrête et redémarre le vrai. `pg_isready` répond OK à ce
          # serveur temporaire — la CI enchaînait donc sur des tests qui
          # tombaient sur « Connection refused » / « server closed the
          # connection unexpectedly » le temps du vrai démarrage. C'était ça, le
          # flake qui rougissait la CI au hasard depuis le début de la soirée.
          # On attend donc une vraie connexion TCP, plus la ligne de journal du
          # démarrage définitif.
          for i in $(seq 1 90); do
            if docker exec -e PGPASSWORD=axion_dev_only axion-ci-postgres \
                 psql -h 127.0.0.1 -p 5432 -U axion -d axion_crm_test -tAc 'select 1' >/dev/null 2>&1 \
               && docker logs axion-ci-postgres 2>&1 | grep -q 'database system is ready to accept connections'; then
              echo "Postgres accepte les connexions TCP après ${i} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres n'est jamais devenu disponible en TCP"
          docker logs axion-ci-postgres | tail -50
          exit 1

      - name: Pest (BLOQUANT)
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: axion_crm_test
          DB_USERNAME: axion
          DB_PASSWORD: axion_dev_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          # Mêmes bascules que docker-compose.test.yml (aucun appel réseau réel).
          MOCK_MODE: 'true'
          MOCK_LLM: 'true'
          MOCK_PROXIES: 'true'
          MOCK_SCRAPERS: 'true'
          MOCK_SMTP: 'true'
          MOCK_INSEE: 'true'
          MOCK_ANNUAIRE_ENTREPRISES: 'true'
          MOCK_BODACC: 'true'
          MOCK_BAN: 'true'
          MOCK_FRANCE_TRAVAIL: 'true'
        # ⚠️ 2026-08-16 — la quarantaine est LEVÉE : `phpunit-ci.xml` n'écarte
        # plus aucun test, la suite ENTIÈRE est bloquante ici. Il ne reste
        # qu'une différence avec `phpunit.xml` : `executionOrder="default"`,
        # pour qu'un gate ne change pas d'avis à code constant. L'ordre
        # aléatoire reste actif en local pour débusquer le couplage.
        run: php vendor/bin/pest --colors --configuration phpunit-ci.xml

      - name: Journaux Postgres (diagnostic si la suite échoue)
        if: failure()
        run: |
          echo "--- lignes de crash éventuelles ---"
          docker logs axion-ci-postgres 2>&1 | grep -iE "PANIC|was terminated by signal|terminating any other active|startup process|recovery|out of memory" || echo "(aucune)"
          echo "--- fin du journal ---"
          docker logs axion-ci-postgres 2>&1 | tail -40

  frontend:
    name: Frontend React/Vite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install (BLOQUANT — lockfile figé)
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend
        run: pnpm typecheck
      - name: Lint (BLOQUANT)
        working-directory: frontend
        run: pnpm lint
      - name: Test
        working-directory: frontend
        run: pnpm test
      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE_URL: https://api.localhost
        run: pnpm build

  workers:
    name: Workers Node + Playwright
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: workers/pnpm-lock.yaml
      - name: Install (BLOQUANT — lockfile figé)
        working-directory: workers
        run: pnpm install --frozen-lockfile

      # ⚠️ 2026-08-16 — garde contre une dérive SILENCIEUSE.
      # `Dockerfile.worker` était resté sur l'image Playwright v1.49.0 alors
      # que `workers/package.json` demandait ^1.62.1 : 13 révisions d'écart.
      # Playwright refuse de démarrer si les binaires de navigateur de l'image
      # ne correspondent pas à la bibliothèque. Rien ne l'avait vu, parce que
      # rien ne comparait les deux — et Dependabot remonte `playwright`
      # régulièrement, donc l'écart se recrée tout seul à chaque bump.
      - name: Le tag de l'image Playwright suit-il la bibliothèque ?
        run: |
          set -euo pipefail
          # Version RÉELLEMENT installée (le lock fait foi, pas l'intervalle
          # `^1.62.1` de package.json qui ne dit pas ce qui est résolu).
          lib="$(node -p "require('./workers/node_modules/playwright/package.json').version")"
          tag="$(sed -n 's/^ARG PLAYWRIGHT_VERSION=v\([0-9.]*\)-.*$/\1/p' Dockerfile.worker)"
          echo "bibliothèque : $lib"
          echo "image        : $tag"
          if [ -z "$tag" ]; then
            echo "::error::PLAYWRIGHT_VERSION introuvable dans Dockerfile.worker (format attendu : ARG PLAYWRIGHT_VERSION=vX.Y.Z-suffixe)"
            exit 1
          fi
          if [ "$lib" != "$tag" ]; then
            echo "::error::Écart Playwright — la bibliothèque est en $lib, l'image en $tag."
            echo "::error::Corriger ARG PLAYWRIGHT_VERSION dans Dockerfile.worker (v${lib}-noble) DANS LE MÊME COMMIT."
            exit 1
          fi
          echo "Versions alignées."

      - name: Typecheck
        working-directory: workers
        run: pnpm typecheck

      # 2026-08-18 — le script `lint` existait depuis toujours dans
      # `workers/package.json` mais n'était appelé NULLE PART, et il ne pouvait
      # pas l'être : le paquet n'avait aucun `eslint.config.*`. ESLint remontait
      # alors l'arborescence à la recherche d'une config — hors du dépôt sur un
      # poste de développement, nulle part en CI. Config locale ajoutée, étape
      # branchée, BLOQUANTE.
      - name: Lint (BLOQUANT)
        working-directory: workers
        run: pnpm lint

      # `pnpm test` ne porte plus `--passWithNoTests` : une suite qui ne
      # collecte AUCUN fichier fait désormais échouer le job au lieu de le
      # rendre vert. Les globs sont figés dans `workers/vitest.config.ts` — sans
      # ce fichier, ce qui était exécuté dépendait de répertoires situés en
      # dehors du dépôt.
      - name: Test
        working-directory: workers
        run: pnpm test
      - name: Build
        working-directory: workers
        run: pnpm build
