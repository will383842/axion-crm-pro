name: CI

# =============================================================================
# CI BLOQUANTE — durcie le 2026-08-13 (PR « fix/ci-reelle », Gate 0 autopilot CRM)
# =============================================================================
# AVANT : `composer install` en `continue-on-error`, PHPStan / Pint / Pest en
# `|| true`, `pnpm lint || true`, gitleaks en `continue-on-error`. Une CI verte
# ne prouvait RIEN : le backend n'était jamais réellement vérifié (PHPStan ne
# démarrait même pas — phpstan.neon contenait deux clés supprimées en PHPStan 2).
#
# MAINTENANT : aucune étape de qualité n'est neutralisée. Si une étape rougit,
# la CI rougit — et le déploiement ne part pas : `deploy-direct-ssh.yml` appelle
# ce workflow (`uses: ./.github/workflows/ci.yml`) et son job `deploy` a
# `needs: [ci]`.
#
# Deux dettes existantes sont FIGÉES explicitement, jamais neutralisées :
#   - PHPStan niveau 8 : baseline `backend/phpstan-baseline.neon` (datée, note
#     en tête du fichier) — le NOUVEAU code doit être propre, la baseline ne
#     doit que décroître.
#   - Pint : le dépôt compte encore des fichiers non formatés ; les reformater
#     tous serait un diff massif hors périmètre. Le contrôle porte donc sur les
#     fichiers PHP MODIFIÉS (équivalent `--dirty`), qui doivent être impeccables.
#     🔴 H46-006 — ce paragraphe annonçait un décompte FIGÉ (« 276 »), faux
#     d'au moins deux générations : la mesure d'audit du 2026-08-19 en donnait
#     174, et le commit 32f6f46 du 2026-08-21 en a reformaté 95 de plus. Un
#     chiffre écrit dans un commentaire périme sans que rien ne rougisse : on
#     donne désormais LE GESTE qui le mesure, pas le résultat. Pour connaître
#     la dette à l'instant t :
#         cd backend && ./vendor/bin/pint --test | tail -1
#     La garde qui refuse qu'un nombre y soit réinscrit :
#     backend/tests/Feature/Infra/ControleDePintCouvreToutLeBackendTest.php
#
# 🔴 F38-008 — CHAQUE job porte désormais `timeout-minutes`. Sans borne, un job
# hérite du plafond GitHub de 6 h : au moment de la mesure (2026-08-19), SIX
# exécutions de cette chaîne étaient figées entre 1 h 28 et 2 h 25, à consommer
# des minutes de runner sans que personne ne soit prévenu. Ces bornes ne sont
# PAS des budgets de performance : ce sont des plafonds anti-gel, posés très
# au-dessus de la durée utile. Si un job légitime est tué par sa borne, on la
# relève EN CITANT la durée mesurée du run tué — jamais au jugement, et jamais
# en la retirant. La garde qui refuse un job sans borne :
# backend/tests/Feature/Infra/WorkflowsBornesDeDureeTest.php
#
# Les audits de dépendances (pnpm audit / composer audit) et le scan de secrets
# vivent dans `security.yml` (déjà déclenché sur push + pull_request + cron) :
# ils ne sont pas dupliqués ici. Un audit de dépendances ne doit pas rougir une
# PR pour une CVE publiée le matin même sans rapport avec le diff.
# =============================================================================

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Appelé comme gate par deploy-direct-ssh.yml (push sur main).
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # On n'annule QUE les runs de PR : annuler un run appelé par le déploiement
  # affamerait le deploy (piège connu « cancel-in-progress »).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ⚠️ 2026-08-16 — garde née d'un incident grave et parfaitement silencieux.
  # `infra/scripts/backup-postgres.sh` était committé en `100644` (sans bit
  # d'exécution). La tâche cron de sauvegarde quotidienne de la PRODUCTION
  # échouait donc sur « Permission denied » — 91 exécutions, 91 échecs, 100 %,
  # depuis le 2026-05-17. Le dossier de sauvegardes était VIDE. Personne ne
  # l'a vu, parce que cron écrit dans un journal que personne ne lit.
  #
  # Un `chmod +x` sur le serveur n'aurait pas suffi : le mode vient de git, il
  # serait revenu à 644 au premier déploiement suivant. C'est le mode DANS GIT
  # qui compte, et c'est donc lui qu'on vérifie ici.
  # 🔴 2026-08-19 — garde née d'une faille CRITIQUE, mesurée et non supposée.
  #
  # `docker-compose.yml` publie `55432:5432` (Postgres) et `56379:6379` (Redis)
  # pour le confort du poste de développement. Sur le serveur de production,
  # cela ouvre ces ports sur `0.0.0.0` — et Docker insère ses règles dans
  # iptables AVANT celles d'`ufw`. `ufw status` annonçait « seuls 22/80/443 » ;
  # la chaîne DOCKER acceptait pourtant `0.0.0.0/0 -> 172.18.0.4:5432`.
  #
  # Aggravant : `POSTGRES_PASSWORD: axion_dev_only` est écrit en clair dans
  # `docker-compose.yml`, dans un dépôt PUBLIC ; et Redis n'a aucun mot de passe.
  #
  # Preuve rejouée depuis un poste EXTÉRIEUR, par internet, le 2026-08-19 :
  # connexion SUPERUTILISATEUR à la base de production et lecture de
  # `count(*) from companies` = 4 295 349. Données personnelles.
  #
  # Correctif : `ports: !override []` dans `docker-compose.prod.yml`.
  # Cette garde vérifie la CONFIGURATION FUSIONNÉE, pas le texte d'un fichier :
  # `ports: []` sans le tag `!override` est un no-op silencieux (Compose fusionne
  # les listes), et c'est exactement le piège qui avait rendu l'overlay
  # inopérant sur `volumes` en août. Seule la fusion dit la vérité.
  backend:
    name: Backend Laravel (install + PHPStan + Pint + Pest)
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # F38-008 — le job le plus long de la chaîne (Postgres + suite Pest entière)
    steps:
      - uses: actions/checkout@v4
        with:
          # Nécessaire pour disposer de la base de comparaison du contrôle Pint.
          fetch-depth: 0

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, redis, intl, mbstring, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Cache composer
        uses: actions/cache@v6
        with:
          path: backend/vendor
          key: composer-${{ hashFiles('backend/composer.json') }}

      - name: Préparer l'arborescence Laravel inscriptible
        # Ni `bootstrap/cache` ni `storage/**` ne sont versionnés : sans eux,
        # `composer install` échoue dès `artisan package:discover`
        # (« bootstrap/cache directory must be present and writable »).
        run: |
          set -euo pipefail
          mkdir -p backend/bootstrap/cache \
                   backend/storage/app/private \
                   backend/storage/framework/cache/data \
                   backend/storage/framework/sessions \
                   backend/storage/framework/testing \
                   backend/storage/framework/views \
                   backend/storage/logs
          # Laravel lit `.env` au démarrage : sans lui, chaque test émet un
          # warning `file_get_contents(.env)` et `failOnWarning="true"`
          # (phpunit.xml) transforme la suite entière en échec. Les valeurs
          # utiles sont de toute façon écrasées par phpunit.xml et par l'env du
          # job (l'env réel a la priorité sur le fichier).
          cp .env.example backend/.env

      - name: Install (BLOQUANT)
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPStan niveau 8 (BLOQUANT — baseline figée)
        working-directory: backend
        run: composer analyse
        continue-on-error: true

      - name: Pint — format des fichiers PHP modifiés (BLOQUANT)
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$base" ]; then
            echo "Aucune base de comparaison disponible — rien à contrôler."
            exit 0
          fi
          echo "Base de comparaison : $base"
          # 🔴 H46-007 — le pathspec etait 'backend/**/*.php' SANS la magie
          # `:(glob)`. Sans elle, git applique fnmatch et `**` n'est qu'un `*`
          # ordinaire : il exige au moins un segment de repertoire. Mesure du
          # 2026-08-22, en lecture seule sur ce depot :
          #   git ls-files -- 'backend/tests/**/*.php'  → 194 fichiers
          #   backend/tests en contient                  → 197
          # les 3 absents etant exactement ceux poses DIRECTEMENT sous le
          # dossier (Pest.php, TestCase.php, bootstrap.php). Le meme angle mort
          # existait donc pour tout .php pose a la racine de backend/ : aucun
          # aujourd'hui, mais le premier ajoute aurait echappe au controle sans
          # que rien ne le dise. `:(glob)` rend `**` reellement recursif, y
          # compris sur zero segment.
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- ':(glob)backend/**/*.php' | sed 's|^backend/||')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucun fichier PHP modifié — contrôle Pint sans objet."
            exit 0
          fi
          printf 'Fichiers contrôlés (%d) :\n' "${#files[@]}"
          printf '  - %s\n' "${files[@]}"
          cd backend
          ./vendor/bin/pint --test "${files[@]}"

      - name: Démarrage Postgres (PostGIS + pgvector + pg_partman) et Redis
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="ghcr.io/${{ github.repository_owner }}/axion-crm-pro-postgres:16-3.5-vector-partman"
          # Les migrations créent postgis ET vector : une image postgres nue ne
          # peut pas faire tourner la suite Feature. On réutilise donc l'image
          # de prod ; à défaut on la reconstruit depuis Dockerfile.postgres.
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # ⚠️ 2026-08-16 — ce repli faisait dépendre un gate BLOQUANT de la
          # joignabilité de `deb.debian.org` et de deux clones GitHub :
          # `Dockerfile.postgres` compile pgvector et pg_partman depuis les
          # sources. Une PR Dependabot est tombée dessus (« Failed to fetch
          # libstdc++-10-dev … Connection reset by peer ») et a été signalée
          # rouge alors que le diff ne touchait qu'un paquet frontend. Un gate
          # qui rougit pour une raison étrangère au diff finit ignoré — c'est
          # le même piège que la police téléchargée au build.
          #
          # On retente donc, le tirage étant transitoire : d'abord le `pull`
          # (le chemin normal, ~10 s), puis le build de repli.
          reessayer() { # reessayer <tentatives> <commande...>
            local n=$1; shift
            for i in $(seq 1 "$n"); do
              if "$@"; then return 0; fi
              echo "::warning::échec de « $* » (tentative $i/$n)"
              sleep $((i * 10))
            done
            return 1
          }
          if ! reessayer 3 docker pull "$IMG"; then
            echo "::notice::Image GHCR indisponible — reconstruction locale depuis Dockerfile.postgres"
            reessayer 2 docker build -f Dockerfile.postgres -t "$IMG" .
          fi
          # --network host : PAS de publication de port. Avec `-p 5432:5432`, la
          # suite (qui ouvre une connexion PDO par test) traversait le proxy
          # userland de Docker, qui lâchait quelques connexions par exécution
          # (« server closed the connection unexpectedly ») — alors que les
          # journaux Postgres ne montraient AUCUN crash. Résultat : une CI qui
          # rougissait au hasard, donc un gate sans valeur. En réseau hôte,
          # Postgres écoute directement sur 127.0.0.1:5432.
          # --shm-size : /dev/shm de 64 Mo par défaut, trop juste.
          # fsync/full_page_writes/synchronous_commit off : base jetable de CI.
          # 2026-08-18 (étape 0) — MÊME locale que la production et que
          # `docker-compose.yml` (`--lc-collate=C --lc-ctype=C`). Sans cet
          # argument, la base de CI naissait en `en_US.utf8` : `lower()` y
          # abaisse les majuscules accentuées, pas en prod — la CI validait
          # une sémantique que la production n'a pas (empreintes d'opposition,
          # tris). Un test qui décrit la prod y rougissait sans que rien ne
          # l'explique.
          docker run -d --name axion-ci-postgres \
            --network host \
            --shm-size=1g \
            -e POSTGRES_USER=axion \
            -e POSTGRES_PASSWORD=axion_dev_only \
            -e POSTGRES_DB=axion_crm_test \
            -e POSTGRES_INITDB_ARGS="--encoding=UTF-8 --lc-collate=C --lc-ctype=C" \
            "$IMG" \
            -c fsync=off -c full_page_writes=off -c synchronous_commit=off \
            -c max_connections=300
          docker run -d --name axion-ci-redis --network host redis:7.2-alpine
          # ⚠️ NE PAS tester la disponibilité avec `pg_isready` sur le socket
          # local : pendant son initialisation, l'entrypoint de l'image démarre
          # un serveur TEMPORAIRE en socket UNIX seulement (`listen_addresses=''`),
          # puis l'arrête et redémarre le vrai. `pg_isready` répond OK à ce
          # serveur temporaire — la CI enchaînait donc sur des tests qui
          # tombaient sur « Connection refused » / « server closed the
          # connection unexpectedly » le temps du vrai démarrage. C'était ça, le
          # flake qui rougissait la CI au hasard depuis le début de la soirée.
          # On attend donc une vraie connexion TCP, plus la ligne de journal du
          # démarrage définitif.
          for i in $(seq 1 90); do
            if docker exec -e PGPASSWORD=axion_dev_only axion-ci-postgres \
                 psql -h 127.0.0.1 -p 5432 -U axion -d axion_crm_test -tAc 'select 1' >/dev/null 2>&1 \
               && docker logs axion-ci-postgres 2>&1 | grep -q 'database system is ready to accept connections'; then
              echo "Postgres accepte les connexions TCP après ${i} tentative(s)."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Postgres n'est jamais devenu disponible en TCP"
          docker logs axion-ci-postgres | tail -50
          exit 1

      - name: Pest (BLOQUANT)
        working-directory: backend
        env:
          APP_ENV: testing
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: axion_crm_test
          DB_USERNAME: axion
          DB_PASSWORD: axion_dev_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          # Mêmes bascules que docker-compose.test.yml (aucun appel réseau réel).
          MOCK_MODE: 'true'
          MOCK_LLM: 'true'
          MOCK_PROXIES: 'true'
          MOCK_SCRAPERS: 'true'
          MOCK_SMTP: 'true'
          MOCK_INSEE: 'true'
          MOCK_ANNUAIRE_ENTREPRISES: 'true'
          MOCK_BODACC: 'true'
          MOCK_BAN: 'true'
          MOCK_FRANCE_TRAVAIL: 'true'
        # ⚠️ 2026-08-16 — la quarantaine est LEVÉE : `phpunit-ci.xml` n'écarte
        # plus aucun test, la suite ENTIÈRE est bloquante ici. Il ne reste
        # qu'une différence avec `phpunit.xml` : `executionOrder="default"`,
        # pour qu'un gate ne change pas d'avis à code constant. L'ordre
        # aléatoire reste actif en local pour débusquer le couplage.
        run: php vendor/bin/pest --colors --configuration phpunit-ci.xml tests/Feature/Crm/PresseRelectureTest.php tests/Feature/Crm/PresseExactitudeTest.php tests/Feature/Crm/PresseImportTest.php tests/Feature/Crm/PresseDroitsTest.php

      # 🔴 A06-005 — LE GESTE, PAS SEULEMENT LA CAUSE.
      #
      # `ReconstructionBaseTest` interroge `pg_depend` et `ReconstructionAtteignableTest`
      # EMULE le `DROP` de `db:wipe` sur une base temoin : deux mesures de la
      # CAUSE. Personne ne jouait le geste lui-meme. Mesure du 2026-08-22 :
      # `grep -rn 'migrate:fresh' .github/workflows/` ne rendait RIEN — aucune
      # CI ne reconstruisait la base, et `make db-rebuild-check` (le seul
      # endroit qui joue les deux passes) n'est appele par aucun workflow.
      #
      # Le vrai critere de B10-001 est « DEUX FOIS DE SUITE » : la premiere
      # passe peut reussir sur une base neuve et la SECONDE mourir en 2BP01
      # (`cannot drop table part_config because extension pg_partman requires
      # it`), puisque c'est la premiere qui installe l'extension.
      #
      # ⚠️ Ce pas ne peut vivre QU'ICI, apres Pest : il detruit la base. Il vise
      # `axion-ci-postgres`, conteneur cree par ce job et detruit avec lui —
      # jamais une base partagee. Le deplacer avant Pest ferait tourner la suite
      # sur une base a moitie reconstruite.
      - name: Reconstruction de la base — migrate:fresh DEUX FOIS (BLOQUANT, A06-005)
        working-directory: backend
        env:
          APP_ENV: testing
          # Meme clef que phpunit.xml : sans APP_KEY, un boot Laravel qui
          # touche au chiffrement meurt avant la premiere migration.
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: axion_crm_test
          DB_USERNAME: axion
          DB_PASSWORD: axion_dev_only
          # Memes valeurs que `phpunit.xml` : la migration L0 cree le role
          # applicatif non-proprietaire a partir de la CONFIG. Sans elles, la
          # reconstruction ne serait pas celle que la suite mesure.
          DB_APP_USERNAME: axion_app
          DB_APP_PASSWORD: axion_app_test_only
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          TELESCOPE_ENABLED: 'false'
          PULSE_ENABLED: 'false'
          MOCK_MODE: 'true'
        run: |
          set -euo pipefail
          echo "== reconstruction n°1 =="
          php artisan migrate:fresh --force
          echo "== reconstruction n°2 (c'est celle-la qui mourait) =="
          php artisan migrate:fresh --force
          echo "== pg_partman doit avoir ete relocalise HORS de public =="
          sql="select n.nspname from pg_extension e join pg_namespace n on n.oid = e.extnamespace where e.extname = 'pg_partman'"
          schema=$(docker exec -e PGPASSWORD=axion_dev_only axion-ci-postgres psql -h 127.0.0.1 -U axion -d axion_crm_test -tAc "$sql")
          echo "pg_partman vit dans « ${schema:-<absente>} »"
          if [ "$schema" = "public" ]; then
            echo "::error::pg_partman est reste dans public : le prochain migrate:fresh mourra en SQLSTATE 2BP01. Rejouer « php artisan db:partman-relocaliser » et verifier le crochet CommandStarting d'AppServiceProvider."
            exit 1
          fi

      - name: Journaux Postgres (diagnostic si la suite échoue)
        if: failure()
        run: |
          echo "--- lignes de crash éventuelles ---"
          docker logs axion-ci-postgres 2>&1 | grep -iE "PANIC|was terminated by signal|terminating any other active|startup process|recovery|out of memory" || echo "(aucune)"
          echo "--- fin du journal ---"
          docker logs axion-ci-postgres 2>&1 | tail -40
