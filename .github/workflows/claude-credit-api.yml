# Lance Claude Code sur un runner GitHub, payé par le crédit de l'API Claude (pas un abonnement).
# Déclenchement MANUEL seulement, par le propriétaire du dépôt, depuis main.
# Trois jobs sur trois machines distinctes :
#   lire   : a la clé SSH, lit la consigne sur le serveur et la CHIFFRE (dépôt public : rien en clair dans les journaux) ;
#   claude : n'a JAMAIS la clé SSH ; déchiffre la consigne dans un fichier non suivi, lance Claude, calcule le coût ;
#   noter  : a la clé SSH sur une machine neuve, revalide les nombres et note le coût sur le serveur.
# Si le compte choisi n'a plus de crédit (erreur finale seulement), l'exécution repart sur le compte suivant.
# Ne JAMAIS activer le mode debug sur ce workflow, ni publier d'artefact.

name: Claude (crédit API)

on:
  workflow_dispatch:
    inputs:
      tache:
        description: "Nom de la consigne sur le serveur (lettres minuscules, chiffres, tirets)"
        required: true
      modele:
        description: "Modèle"
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]
        default: claude-sonnet-5-5
      compte:
        description: "Compte API essayé en premier"
        type: choice
        options: [A, B, C]
        default: A
      tours_max:
        description: "Nombre maximal de tours"
        type: choice
        options: ["40", "80", "150"]
        default: "80"

permissions:
  contents: read

concurrency:
  group: claude-credit-api-${{ inputs.tache }}
  cancel-in-progress: false

jobs:
  lire:
    if: github.actor == github.repository_owner && github.triggering_actor == github.repository_owner && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chiffre: ${{ steps.consigne.outputs.chiffre }}
    steps:
      - name: Vérifier le nom de la consigne
        env:
          TACHE: ${{ inputs.tache }}
        run: |
          if ! [[ "$TACHE" =~ ^[a-z0-9-]{3,60}$ ]]; then
            echo "::error::Nom de consigne invalide."; exit 1
          fi

      - name: Agent SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Lire et chiffrer la consigne
        id: consigne
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_SSH: ${{ secrets.HETZNER_USER || 'root' }}
          TACHE: ${{ inputs.tache }}
          CLE_CONSIGNE: ${{ secrets.CLE_CONSIGNE }}
        run: |
          [[ "$TACHE" =~ ^[a-z0-9-]{3,60}$ ]] || exit 1
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh "$USER_SSH@$HOST" "cat /opt/axion-crm-pro/.claude-taches/$TACHE.md" > "$RUNNER_TEMP/c.md"
          if [ ! -s "$RUNNER_TEMP/c.md" ]; then echo "::error::Consigne absente ou vide."; exit 1; fi
          chiffre="$(openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:CLE_CONSIGNE -in "$RUNNER_TEMP/c.md" | base64 -w0)"
          rm -f "$RUNNER_TEMP/c.md"
          echo "chiffre=$chiffre" >> "$GITHUB_OUTPUT"

  claude:
    needs: lire
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    outputs:
      cout1: ${{ steps.bilan.outputs.cout1 }}
      cout2: ${{ steps.bilan.outputs.cout2 }}
      c1: ${{ steps.bilan.outputs.c1 }}
      c2: ${{ steps.bilan.outputs.c2 }}
      suivant: ${{ steps.bascule.outputs.suivant }}
      resume: ${{ steps.bilan.outputs.resume }}
    steps:
      - uses: actions/checkout@v4

      - name: Déchiffrer la consigne (fichier non suivi par git)
        env:
          CHIFFRE: ${{ needs.lire.outputs.chiffre }}
          CLE_CONSIGNE: ${{ secrets.CLE_CONSIGNE }}
        run: |
          printf '%s' "$CHIFFRE" | base64 -d \
            | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:CLE_CONSIGNE > .consigne-claude.md
          echo ".consigne-claude.md" >> .git/info/exclude
          test -s .consigne-claude.md

      - name: PHP 8.3 (pour que le robot lance Pint, PHPStan et les tests unitaires)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, redis, intl, mbstring, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Dépendances backend AVANT Claude (le bac à sable ne peut pas les installer)
        working-directory: backend
        run: |
          mkdir -p bootstrap/cache storage/app/private storage/framework/cache/data storage/framework/sessions storage/framework/testing storage/framework/views storage/logs
          cp ../.env.example .env
          composer install --no-interaction --prefer-dist --no-progress >/dev/null 2>&1 || echo "::warning::composer install a échoué : le robot travaillera sans vendor/"

      - name: Installer Claude Code et identité git
        run: |
          # Bac à sable de Claude Code (actif sur ce runner) : il lui faut bubblewrap et socat sur Linux.
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq bubblewrap socat >/dev/null
          command -v socat >/dev/null || { echo "socat manquant"; exit 1; }
          command -v bwrap >/dev/null || { echo "bubblewrap manquant"; exit 1; }
          # Ubuntu 24.04 bloque les espaces de noms non privilégiés (AppArmor) dont bubblewrap a besoin.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null 2>&1 || true
          npm i -g --no-audit --no-fund @anthropic-ai/claude-code >/dev/null 2>&1
          claude --version >/dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Claude (premier compte)
        id: run1
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ inputs.compte == 'B' && secrets.ANTHROPIC_API_KEY_COMPTE_B || inputs.compte == 'C' && secrets.ANTHROPIC_API_KEY_COMPTE_C || secrets.ANTHROPIC_API_KEY_COMPTE_A }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODELE: ${{ inputs.modele }}
          TOURS: ${{ inputs.tours_max }}
        run: |
          # CLI Claude Code lancée directement (claude-code-action était refusée « credit balance »
          # alors que la CLI et l'API passent avec la même clé). Sortie JSON dans un fichier, jamais dans le journal.
          f="$RUNNER_TEMP/execution-run1.json"
          env -u GITHUB_ENV -u GITHUB_STEP_SUMMARY -u GITHUB_PATH -u GITHUB_OUTPUT timeout 3300 claude -p "Ta consigne est dans le fichier .consigne-claude.md à la racine du dépôt. Lis-le et exécute-le. Ne le committe jamais et ne recopie jamais son contenu dans un commit, une PR ou un commentaire."             --model "$MODELE" --max-turns "$TOURS"             --allowedTools Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite             --output-format json > "$RUNNER_TEMP/brut-run1.json" 2>/dev/null || true
          jq -s '.' "$RUNNER_TEMP/brut-run1.json" > "$f" 2>/dev/null || echo '[]' > "$f"
          rm -f "$RUNNER_TEMP/brut-run1.json"
          echo "execution_file=$f" >> "$GITHUB_OUTPUT"
          if jq -e 'any(.[]; .type == "result" and .is_error == false)' "$f" >/dev/null 2>&1; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - name: Crédit épuisé ? choisir le compte suivant
        id: bascule
        if: always()
        env:
          FICHIER: ${{ steps.run1.outputs.execution_file }}
          COMPTE: ${{ inputs.compte }}
        run: |
          suivant=""
          if [ -n "$FICHIER" ] && [ -f "$FICHIER" ] && jq -e '
               any(.[]; .type == "result" and .is_error == true
                        and ((.result // "") | test("credit balance"; "i")))' "$FICHIER" >/dev/null 2>&1; then
            case "$COMPTE" in A) suivant=B ;; B) suivant=A ;; C) suivant=A ;; esac
            echo "Crédit épuisé sur le compte $COMPTE : bascule vers $suivant."
            cp "$FICHIER" "$RUNNER_TEMP/execution-1.json"
          fi
          echo "suivant=$suivant" >> "$GITHUB_OUTPUT"

      - name: Claude (compte suivant)
        id: run2
        if: steps.bascule.outputs.suivant != ''
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ steps.bascule.outputs.suivant == 'B' && secrets.ANTHROPIC_API_KEY_COMPTE_B || secrets.ANTHROPIC_API_KEY_COMPTE_A }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODELE: ${{ inputs.modele }}
          TOURS: ${{ inputs.tours_max }}
        run: |
          # CLI Claude Code lancée directement (claude-code-action était refusée « credit balance »
          # alors que la CLI et l'API passent avec la même clé). Sortie JSON dans un fichier, jamais dans le journal.
          f="$RUNNER_TEMP/execution-run2.json"
          env -u GITHUB_ENV -u GITHUB_STEP_SUMMARY -u GITHUB_PATH -u GITHUB_OUTPUT timeout 3300 claude -p "Ta consigne est dans le fichier .consigne-claude.md à la racine du dépôt. Lis-le et exécute-le. Ne le committe jamais et ne recopie jamais son contenu dans un commit, une PR ou un commentaire."             --model "$MODELE" --max-turns "$TOURS"             --allowedTools Bash,Read,Edit,Write,Glob,Grep,Agent,TodoWrite             --output-format json > "$RUNNER_TEMP/brut-run2.json" 2>/dev/null || true
          jq -s '.' "$RUNNER_TEMP/brut-run2.json" > "$f" 2>/dev/null || echo '[]' > "$f"
          rm -f "$RUNNER_TEMP/brut-run2.json"
          echo "execution_file=$f" >> "$GITHUB_OUTPUT"
          if jq -e 'any(.[]; .type == "result" and .is_error == false)' "$f" >/dev/null 2>&1; then
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"; exit 1
          fi

      - name: Bilan (nombres seulement)
        id: bilan
        if: always()
        env:
          SUIVANT: ${{ steps.bascule.outputs.suivant }}
          F1: ${{ steps.run1.outputs.execution_file }}
          F2: ${{ steps.run2.outputs.execution_file }}
          C1: ${{ steps.run1.outputs.conclusion }}
          C2: ${{ steps.run2.outputs.conclusion }}
          SHA: ${{ github.sha }}
        run: |
          rm -f .consigne-claude.md
          # Résumé de la réponse de Claude (fin du texte, tours, outils refusés), CHIFFRÉ car le dépôt est public.
          # Chiffrement par CLÉ PUBLIQUE (certificat versionné, lu dans le commit d'origine) : aucun secret sur
          # cette machine où Claude a eu Bash ; la clé privée n'existe que sur le serveur. Rien n'est affiché.
          r="$RUNNER_TEMP/resume.json"; c="$RUNNER_TEMP/resume-cert.pem"
          fichiers=(); for x in "$F1" "$F2"; do [ -n "$x" ] && [ -f "$x" ] && fichiers+=("$x"); done
          jq -s '[.[] | .[]? | select(.type=="result") | {subtype, is_error, num_turns, duration_ms, total_cost_usd,
                  refus: [.permission_denials[]? | .tool_name], fin: ((.result // "") | tostring | .[-3000:])}]'             "${fichiers[@]}" /dev/null > "$r" 2>/dev/null || echo '[]' > "$r"
          git show "$SHA:.github/resume-claude-cert.pem" > "$c" 2>/dev/null             && echo "resume=$(openssl cms -encrypt -aes256 -binary -outform DER -in "$r" "$c" 2>/dev/null | base64 -w0)" >> "$GITHUB_OUTPUT"
          rm -f "$r" "$c"
          cout() { [ -n "$1" ] && [ -f "$1" ] && jq -r '[.[] | select(.type=="result") | .total_cost_usd // 0] | add // 0' "$1" 2>/dev/null || echo 0; }
          # Copie du 1er run faite par le pas de bascule (chemins distincts depuis #804, copie gardée par prudence).
          if [ -n "$SUIVANT" ]; then f1="$RUNNER_TEMP/execution-1.json"; else f1="$F1"; fi
          echo "cout1=$(cout "$f1")" >> "$GITHUB_OUTPUT"
          echo "cout2=$(cout "$F2")" >> "$GITHUB_OUTPUT"
          echo "c1=${C1:-inconnu}" >> "$GITHUB_OUTPUT"
          echo "c2=${C2:-inconnu}" >> "$GITHUB_OUTPUT"

  noter:
    needs: [lire, claude]
    if: always() && needs.lire.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Agent SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Noter le coût sur le serveur
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_SSH: ${{ secrets.HETZNER_USER || 'root' }}
          TACHE: ${{ inputs.tache }}
          MODELE: ${{ inputs.modele }}
          COMPTE: ${{ inputs.compte }}
          SUIVANT: ${{ needs.claude.outputs.suivant }}
          COUT1: ${{ needs.claude.outputs.cout1 }}
          COUT2: ${{ needs.claude.outputs.cout2 }}
          C1: ${{ needs.claude.outputs.c1 }}
          C2: ${{ needs.claude.outputs.c2 }}
        run: |
          # Les sorties du job claude viennent d'une machine où Claude avait Bash : on revalide tout.
          num() { if [[ "$1" =~ ^[0-9]+(\.[0-9]+)?$ ]]; then printf '%s' "$1"; else printf 0; fi; }
          mot() { if [[ "$1" =~ ^(success|failure|inconnu)$ ]]; then printf '%s' "$1"; else printf inconnu; fi; }
          [[ "$TACHE" =~ ^[a-z0-9-]{3,60}$ ]] || exit 1
          [[ "$SUIVANT" =~ ^(A|B)?$ ]] || SUIVANT=""
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          d="$(date -u +%FT%TZ)"
          lignes="$d;${GITHUB_RUN_ID};${TACHE};${MODELE};${COMPTE};$(num "$COUT1");$(mot "$C1")"
          if [ -n "$SUIVANT" ]; then
            lignes="$lignes"$'\n'"$d;${GITHUB_RUN_ID};${TACHE};${MODELE};${SUIVANT};$(num "$COUT2");$(mot "$C2")"
          fi
          printf '%s\n' "$lignes" | ssh "$USER_SSH@$HOST" "cat >> /opt/axion-crm-pro/depenses-code-claude.csv"
          echo "Coût noté sur le serveur."

      - name: Ranger le résumé chiffré sur le serveur (privé)
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER_SSH: ${{ secrets.HETZNER_USER || 'root' }}
          RESUME: ${{ needs.claude.outputs.resume }}
        run: |
          # Déchiffré SUR LE SERVEUR seulement (clé privée resume-cle.pem). Contenu non fiable : jamais exécuté.
          [[ "$RESUME" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "Pas de résumé."; exit 0; }
          d=/opt/axion-crm-pro/.claude-taches
          if printf '%s' "$RESUME" | ssh "$USER_SSH@$HOST" "base64 -d | openssl cms -decrypt -inform DER -binary -inkey $d/resume-cle.pem 2>/dev/null | head -c 200000 > $d/journal/${GITHUB_RUN_ID}.json && [ -s $d/journal/${GITHUB_RUN_ID}.json ]"; then
            echo "Résumé rangé."
          else
            echo "Résumé non rangé."
          fi

      - name: Résultat
        env:
          C1: ${{ needs.claude.outputs.c1 }}
          C2: ${{ needs.claude.outputs.c2 }}
          SUIVANT: ${{ needs.claude.outputs.suivant }}
        run: |
          if [ -n "$SUIVANT" ]; then fin="$C2"; else fin="$C1"; fi
          echo "Conclusion : ${fin:-inconnue}"
          [ "$fin" = "success" ]
