name: CRM — Personnes des demandes (prod, à la main)

# Rattrapage de la fiche demande (lot C1) : `crm:personnes-depuis-demandes` sur le
# serveur de production, par SSH, LANCÉ À LA MAIN seulement.
#
# Par défaut : ESSAI À BLANC — rien n'est écrit, le bilan donne des comptes.
# Le mode `appliquer` écrit dans la table `personnes` UNIQUEMENT (aucun e-mail,
# aucun abonnement, aucune suppression, aucune activité modifiée). Il exige de
# taper `SAUVEGARDE-VERIFIEE` : on ne l'écrit qu'après avoir lu le rapport de la
# sauvegarde de la nuit (workflow « Surveillance des sauvegardes »).
#
# Ce dépôt est PUBLIC, ses journaux aussi : la commande n'imprime que des nombres.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "a-blanc (défaut, n'écrit rien) ou appliquer"
        type: choice
        default: a-blanc
        options:
          - a-blanc
          - appliquer
      confirmation:
        description: "Pour appliquer : taper SAUVEGARDE-VERIFIEE (sinon le job s'arrête)"
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: crm-personnes-demandes
  cancel-in-progress: false

jobs:
  personnes:
    name: Personnes des demandes sur prod (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Garde de confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          case "$MODE" in
            a-blanc) ;;
            appliquer)
              if [ "$CONFIRMATION" != "SAUVEGARDE-VERIFIEE" ]; then
                echo "::error::Pour appliquer, taper SAUVEGARDE-VERIFIEE après avoir lu le rapport de la sauvegarde."
                exit 1
              fi ;;
            *) echo "::error::mode inconnu : $MODE"; exit 1 ;;
          esac

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Personnes des demandes via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          PROJECT_PATH: ${{ secrets.HETZNER_PROJECT_PATH || '/opt/axion-crm-pro' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          case "$MODE" in
            a-blanc)   OPT="--a-blanc" ;;
            appliquer) OPT="--appliquer" ;;
            *) echo "::error::mode inconnu : $MODE"; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash <<EOF
            set -euo pipefail
            cd "$PROJECT_PATH"
            # « < /dev/null » OBLIGATOIRE : sinon docker compose exec -T avale la suite du heredoc.
            docker compose exec -u root -T api php artisan crm:personnes-depuis-demandes $OPT < /dev/null
          EOF
