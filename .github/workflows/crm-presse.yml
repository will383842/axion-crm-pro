name: CRM — Presse harmonisée (prod, à la main)

# Harmonisation des contacts presse (2026-09-30) : `crm:presse:harmoniser` sur
# le serveur de production, par SSH, LANCÉ À LA MAIN seulement.
#
# Par défaut : ESSAI À BLANC — chaque paquet est parcouru puis annulé, rien
# n'est écrit ; le bilan donne les chiffres (fiches créées, natures et
# relations posées ou conservées, journalistes convertis, écartés par motif).
# Le mode qui écrit se choisit explicitement.
#
# `--compteurs-seulement` TOUJOURS : ce dépôt est PUBLIC, ses journaux aussi —
# que des nombres, jamais un nom, une adresse ou un identifiant.
#
# Rien n'est jamais supprimé (ordre permanent de Will) : la commande est
# additive, idempotente, et reprend là où elle s'est arrêtée si on la relance.
#
# Classement des médias (chantier F, 2026-10-01) : `crm:presse:classer-medias`
# lit la page d'accueil de chaque média (robots.txt respecté, concurrence 4,
# 1 s par domaine) et pose thèmes / public / format TV / verdict « média
# possible ». Ordre conseillé : `classer-a-blanc` sur 200 (limite par défaut),
# puis `classer` sur un échantillon (limite 500), puis `classer` sans limite
# (limite 0) — reprenable : une fiche déjà classée est sautée.
#
# Vérification des sites des médias (2026-10-01) : `crm:presse:verifier-sites`
# vérifie que le site de chaque média porte son nom (les sites DEVINÉS depuis
# le nom sont souvent faux) et en cherche un, sans service payant, quand il
# n'en a pas ou un faux. Le classement ne lit plus QUE des sites vérifiés :
# lancer `verifier-sites-a-blanc` (200), puis `verifier-sites` (500), puis
# `verifier-sites` sans limite (0) — reprenable —, ET SEULEMENT ENSUITE
# `classer` (version 5 des règles : tout est relu).
#
# L'import d'une liste de diffusion (`crm:presse:importer`) ne passe PAS par
# ce workflow : son fichier vit hors du dépôt, sur le serveur.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Ce que fait le workflow"
        type: choice
        default: harmoniser-a-blanc
        options:
          - harmoniser-a-blanc
          - harmoniser
          - classer-a-blanc
          - classer
          - verifier-sites-a-blanc
          - verifier-sites
      limite:
        description: "Classement / vérification : nombre de fiches au plus (0 = toutes)"
        type: string
        default: "200"

permissions:
  contents: read

jobs:
  presse:
    name: Presse sur prod (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    # ≈ 56 000 médias par paquets de 500.
    timeout-minutes: 180
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Presse via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          PROJECT_PATH: ${{ secrets.HETZNER_PROJECT_PATH || '/opt/axion-crm-pro' }}
          MODE: ${{ inputs.mode }}
          LIMITE: ${{ inputs.limite }}
        run: |
          set -euo pipefail
          if ! [[ "$LIMITE" =~ ^[0-9]+$ ]]; then echo "::error::limite invalide"; exit 1; fi
          OPT_LIMITE=""
          if [ "$LIMITE" != "0" ]; then OPT_LIMITE="--limite=$LIMITE"; fi
          case "$MODE" in
            harmoniser-a-blanc) CMD="crm:presse:harmoniser --dry-run" ;;
            harmoniser)         CMD="crm:presse:harmoniser" ;;
            classer-a-blanc)    CMD="crm:presse:classer-medias --dry-run $OPT_LIMITE" ;;
            classer)            CMD="crm:presse:classer-medias --appliquer $OPT_LIMITE" ;;
            verifier-sites-a-blanc) CMD="crm:presse:verifier-sites --dry-run $OPT_LIMITE" ;;
            verifier-sites)     CMD="crm:presse:verifier-sites --appliquer $OPT_LIMITE" ;;
            *) echo "::error::mode inconnu : $MODE"; exit 1 ;;
          esac
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash <<EOF
            set -euo pipefail
            cd "$PROJECT_PATH"
            # « < /dev/null » OBLIGATOIRE : sinon docker compose exec -T lit le
            # reste du heredoc comme stdin et avale les commandes suivantes.
            docker compose exec -u root -T api php artisan $CMD --compteurs-seulement < /dev/null
          EOF
