name: Deploy direct SSH Hetzner

# Sprint 18.9 — pipeline simple SSH→Hetzner (sans Coolify).
# Permet à Will de pousser sur main sans devoir SSH manuellement.
#
# ============================================================================
# DURCI le 2026-08-13 (PR « fix/ci-reelle », Gate 0 autopilot CRM)
# ============================================================================
# AVANT : le déploiement partait sur tout push main SANS dépendre de la CI, et
# `php artisan migrate --force || true` laissait un déploiement VERT alors que
# la migration avait échoué (piège consigné en mémoire).
# MAINTENANT :
#   1. le job `ci` (workflow réutilisable `ci.yml`) doit être VERT — `needs`
#      + `if: needs.ci.result == 'success'` sur le job `deploy` ;
#   2. le serveur est remis EXACTEMENT sur le SHA qui a passé la CI (plus de
#      `reset --hard origin/main` non déterministe), et le SHA servi est vérifié ;
#   3. `migrate --force` est BLOQUANT : migration en échec = déploiement en échec ;
#   4. vérification post-déploiement : conteneurs vitaux `running` (et jamais
#      `unhealthy`) + `migrate:status` sans aucune migration `Pending`, sinon le
#      job échoue ;
#   5. smoke HTTP final inchangé (api /up + app).
# ============================================================================
#
# Trigger : push sur main (auto) + workflow_dispatch (manuel).
# Secrets requis (à configurer côté GitHub UI, cf. _AUDIT/DEPLOY-PIPELINE.md) :
#   - HETZNER_SSH_PRIVATE_KEY  → clé privée OpenSSH du compte root@hetzner
#   - HETZNER_HOST             → IP ou hostname (par défaut 46.62.248.239)
#   - HETZNER_USER             → utilisateur SSH (par défaut root)
#   - HETZNER_PROJECT_PATH     → chemin du repo sur le serveur (par défaut /opt/axion-crm-pro)

on:
  push:
    branches: [main]
    # On évite de redéployer pour des changements purement docs/_AUDIT.
    paths-ignore:
      - '_AUDIT/**'
      - '_REPORTS/**'
      - 'spec/**'
      - 'docs/**'
      - '**/*.md'
      # Un changement purement CI/workflow ne doit pas redéployer l'app.
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      skip_migrate:
        description: 'Skip php artisan migrate (true/false)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: deploy-direct-ssh
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # GATE — la CI complète (Pest + PHPStan + Pint + front + workers) doit passer
  # AVANT toute action sur la production. `needs` ne fonctionnant qu'à
  # l'intérieur d'un même workflow, ci.yml est appelé ici comme workflow
  # réutilisable (`workflow_call`).
  # ---------------------------------------------------------------------------
  # 🔴 F38-008 — plafonds anti-gel, poses le 2026-08-22. Aucun job de la
  # chaine qualite n'avait de borne : sans elle un job herite du plafond
  # GitHub de 6 h, et SIX executions etaient figees entre 1 h 28 et 2 h 25
  # au moment de la mesure. Ce ne sont pas des budgets : ce sont des
  # plafonds, poses tres au-dessus de la duree utile. Si un job legitime
  # est tue, relever la borne EN CITANT la duree du run tue — jamais la
  # retirer. Explication complete : .github/workflows/ci.yml, en-tete.
  # Garde : backend/tests/Feature/Infra/WorkflowsBornesDeDureeTest.php
  # ⚠️ Ce job-ci N'A PAS de `timeout-minutes` et NE PEUT PAS en avoir : GitHub
  # refuse la cle sur un job qui appelle un workflow reutilisable (`uses:`).
  # Les bornes des six jobs de `ci.yml` s'appliquent a sa place.
  ci:
    name: CI (gate bloquant)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  deploy:
    name: SSH Hetzner + pull + migrate + restart
    timeout-minutes: 60  # F38-008 (SSH + pull + migrate + redemarrage + sante)
    needs: [ci]
    if: ${{ needs.ci.result == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: production-direct-ssh
      url: https://app.axion-crm-pro.com
    steps:
      - name: Validate secrets present
        run: |
          set -e
          if [ -z "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret HETZNER_SSH_PRIVATE_KEY manquant. Cf. _AUDIT/DEPLOY-PIPELINE.md."
            exit 1
          fi
          if [ -z "${{ secrets.HETZNER_HOST }}" ]; then
            echo "::error::Secret HETZNER_HOST manquant. Cf. _AUDIT/DEPLOY-PIPELINE.md."
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Trust host key
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via SSH (+ vérification post-déploiement)
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          PROJECT_PATH: ${{ secrets.HETZNER_PROJECT_PATH || '/opt/axion-crm-pro' }}
          SKIP_MIGRATE: ${{ github.event.inputs.skip_migrate || 'false' }}
          INSEE_API_KEY: ${{ secrets.INSEE_API_KEY }}
          # Jeton EPHEMERE du run, pour que le serveur puisse lire un depot
          # PRIVE. Il expire a la fin du job ; rien n'est ecrit sur le disque
          # du serveur (voir le bloc `git fetch` plus bas).
          GH_TOKEN_LECTURE: ${{ secrets.GITHUB_TOKEN }}
          GH_DEPOT: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Heredoc QUOTÉ : le script part tel quel sur le serveur (aucune
          # expansion locale surprise). Les valeurs voyagent en arguments.
          # ⚠️ Chaque `docker compose exec -T` DOIT lire sur /dev/null : sinon il
          # consomme le reste du script (qui arrive par l'entrée standard) et tout
          # ce qui suit est silencieusement AVALÉ. C'est ce qui s'est passé au
          # déploiement b84100f : ni config:clear ni les vérifications
          # post-déploiement ne se sont exécutés, et le job est resté vert.
          # ══════════════════════════════════════════════════════════════════
          # 🔴 SIGNAL DE VIE — INCIDENT DU 2026-08-23, 7 MINUTES DE 502
          # ══════════════════════════════════════════════════════════════════
          #
          # Ce qui s'est passé : la fusion de la PR #194 a lancé ce déploiement.
          # Build fait, quatre conteneurs recréés à 11:26:11 — puis QUATRE
          # MINUTES DE SILENCE (la construction ne dit rien), puis
          # `client_loop: send disconnect: Broken pipe`, exit 255 à 11:30:29.
          #
          # Le script n'a jamais atteint ses trois dernières étapes :
          # `migrate --force`, la vérification des conteneurs, et la sonde HTTP.
          # Mesuré de l'extérieur à 11:34 : api 502, app 502. La relance du job
          # a tout rétabli — mais entre les deux, personne ne savait dans quel
          # état était la machine.
          #
          # ⚠️ CE PIPELINE SE CROYAIT DURCI, et son en-tête le dit : « migrate
          # --force est BLOQUANT », « vérification post-déploiement ». C'est
          # vrai QUAND LE SCRIPT VA AU BOUT. Il n'avait AUCUNE protection contre
          # la mort du TRANSPORT : la commande continue côté serveur, le job
          # échoue côté forge, et l'état réel n'est mesuré par personne.
          # *Un déploiement « bloquant » qui perd sa connexion n'est pas
          # bloquant : il est aveugle.*
          #
          # Ce que ces deux options font : un paquet de vie toutes les 30 s, et
          # jusqu'à 10 sans réponse avant d'abandonner — soit 5 minutes de
          # silence tolérées, contre ~4 minutes observées pendant le build.
          #
          # ⚠️ CE QU'ELLES NE FONT PAS, et il faut le dire : elles empêchent la
          # connexion de mourir DE SILENCE. Elles ne rendent pas le déploiement
          # REPRENABLE. Si le tuyau tombe pour une autre raison (réseau coupé,
          # serveur redémarré), on retombe dans le même angle mort. La vraie
          # robustesse — lancer le script détaché côté serveur puis interroger
          # son état séparément — reste À FAIRE.
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$USER@$HOST" 'bash -s' -- \
            "$PROJECT_PATH" "$SKIP_MIGRATE" "$EXPECTED_SHA" "$INSEE_API_KEY" \
            "$GH_TOKEN_LECTURE" "$GH_DEPOT" <<'REMOTE' | tee /tmp/deploy-remote.log
          set -euo pipefail
          PROJECT_PATH="$1"
          SKIP_MIGRATE="$2"
          EXPECTED_SHA="$3"
          INSEE_API_KEY="${4:-}"
          GH_TOKEN_LECTURE="${5:-}"
          GH_DEPOT="${6:-}"

          cd "$PROJECT_PATH"

          # 🔴 L'OVERLAY DE PRODUCTION, ENFIN BRANCHÉ (2026-08-16).
          #
          # Jusqu'ici ce script lançait `docker compose` SANS `-f`. La production
          # tournait donc sur `docker-compose.yml` seul : cible `dev`, et surtout
          # le montage bind `/opt/axion-crm-pro/backend -> /var/www/html`, qui
          # MASQUE le `vendor` de l'image.
          #
          # Or aucune étape de ce déploiement ne fait `composer install`. Mesuré
          # le 2026-08-16 : `backend/vendor` sur le serveur datait du **17 mai**.
          # `composer.lock` annonçait `predis v3.5.1`, la production exécutait
          # `v2.4.1` — trois mois de mises à jour PHP, correctifs de sécurité
          # compris, jamais installés. Et le décalage était silencieux dans les
          # deux sens : une PR utilisant une API récente passait la CI (qui fait
          # `composer install`) et aurait cassé ici.
          #
          # `COMPOSE_FILE` s'applique à TOUS les `docker compose` du script — on
          # ne peut donc pas en oublier un, contrairement à des `-f` recopiés.
          export COMPOSE_FILE="docker-compose.yml:docker-compose.prod.yml"
          echo "COMPOSE_FILE = $COMPOSE_FILE"

          echo "::group::git fetch + reset sur le SHA validé par la CI"

          # ══════════════════════════════════════════════════════════════════
          # 🔴 DEPOT PRIVE — mesure du 2026-08-23, faite EXPRES
          # ══════════════════════════════════════════════════════════════════
          #
          # Le depot est passe en PRIVE ce jour-la : il portait, sur `main` et
          # sur 49 autres branches, l'IP d'origine du serveur — celle qui permet
          # de CONTOURNER Cloudflare (constat F37-007) — plus le detail des
          # faiblesses de la production.
          #
          # Le premier deploiement d'apres a echoue, et c'etait le but de le
          # declencher tout de suite plutot que de le decouvrir en urgence :
          #
          #     fatal: could not read Username for 'https://github.com'
          #
          # Le clone du serveur pointe une URL HTTPS sans identifiants. Public,
          # ca marchait ; prive, plus rien.
          #
          # 🔑 CE QUE FAIT LE CORRECTIF, ET CE QU'IL EVITE.
          # On fournit un identifiant de LECTURE, valable le temps du job, par
          # un assistant `credential.helper` pose en LIGNE DE COMMANDE :
          #   - rien n'est ecrit sur le disque du serveur — ni `.git-credentials`,
          #     ni `remote set-url` avec le jeton dedans. Un jeton grave dans la
          #     configuration d'un clone y reste des mois ;
          #   - l'URL du depot n'est pas reecrite, donc le jeton n'apparait dans
          #     AUCUN message d'erreur de git (une URL `https://x:TOKEN@...`
          #     ressort telle quelle dans les erreurs reseau) ;
          #   - le jeton expire a la fin du run. Rien a revoquer.
          #
          # `permissions: contents: read` en tete de ce fichier borne ce que ce
          # jeton peut faire : lire. Il ne peut ni pousser, ni ouvrir une PR.
          #
          # ⚠️ SI CE BLOC DISPARAIT, LE DEPLOIEMENT S'ARRETE — il ne degrade pas
          # en silence : `git fetch` echoue franchement et le job rougit.
          # ⚠️ DEUXIEME ESSAI, et il faut dire pourquoi le premier a echoue.
          # La version d'avant passait par un `credential.helper` pose en ligne
          # de commande (`!f() { echo username=...; }; f`). Le jeton ARRIVAIT
          # bien sur le serveur — la trace le montre — mais GitHub repondait
          # « Invalid username or token » : la fonction, avec ses accolades et
          # ses points-virgules, ne survit pas au double passage guillemets +
          # tunnel SSH. Trop de pieces mobiles pour un chemin qui doit juste
          # marcher.
          #
          # Forme explicite, une seule piece : l'URL porte l'identifiant, le
          # temps d'UNE commande.
          #   - `git fetch <URL>` ne TOUCHE PAS la configuration du clone : le
          #     `remote origin` garde son URL propre. Rien n'est ecrit sur le
          #     disque du serveur, ce qui etait la seule exigence ;
          #   - le refspec est explicite, sinon `fetch <URL>` ne met a jour
          #     AUCUNE reference `refs/remotes/origin/*` et le `reset --hard`
          #     suivant travaillerait sur des references perimees ;
          #   - `credential.helper=` neutralise un assistant eventuellement
          #     configure sur le serveur, qui presenterait de vieux identifiants
          #     a la place des notres ;
          #   - si le jeton fuyait dans un message d'erreur, GitHub Actions le
          #     masque : c'est un secret declare, il ressort en `***`.
          if [ -n "$GH_TOKEN_LECTURE" ] && [ -n "$GH_DEPOT" ]; then
            git -c credential.helper= fetch --prune               "https://x-access-token:${GH_TOKEN_LECTURE}@github.com/${GH_DEPOT}.git"               "+refs/heads/*:refs/remotes/origin/*"
          else
            echo "::warning::aucun jeton de lecture fourni — fetch anonyme (ne marche que si le depot est public)"
            git fetch --all --prune
          fi
          # On déploie EXACTEMENT le commit qui vient de passer la CI.
          git reset --hard "$EXPECTED_SHA"
          DEPLOYED_SHA="$(git rev-parse HEAD)"
          echo "SHA déployé : $DEPLOYED_SHA"
          if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::SHA servi ($DEPLOYED_SHA) != SHA attendu ($EXPECTED_SHA)"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::sync INSEE_API_KEY into .env"
          # Upsert la clé INSEE dans le .env serveur (le deploy ne versionne pas .env).
          # Doit précéder le restart pour que le conteneur la lise au démarrage.
          if [ -f .env ] && [ -n "$INSEE_API_KEY" ]; then
            if grep -q '^INSEE_API_KEY=' .env; then
              sed -i "s|^INSEE_API_KEY=.*|INSEE_API_KEY=$INSEE_API_KEY|" .env
            else
              echo "INSEE_API_KEY=$INSEE_API_KEY" >> .env
            fi
            echo "INSEE_API_KEY synchronisée."
          fi
          echo "::endgroup::"

          echo "::group::docker compose build + up"
          # Best effort : les services construits localement n'ont pas d'image à
          # tirer, un échec de pull ne doit pas arrêter le déploiement.
          docker compose pull --ignore-pull-failures || true
          # --build : reconstruit aussi le frontend (app) — sinon les changements
          # frontend (boutons, filtres…) ne sont jamais déployés (image bakée).
          # ⚠️ `horizon` et `scheduler` DOIVENT être recréés eux aussi.
          # Ils ne l'étaient pas : constaté en direct le 2026-08-16, `api` avait
          # 3 minutes quand `horizon` en avait 28 heures. Ils continuaient donc
          # à exécuter l'image précédente — et, depuis le passage à l'overlay de
          # production, ils exécuteraient un `vendor` différent de celui de
          # l'API. Deux versions du même code dans le même système.
          # ⚠️ `reverb` est VOLONTAIREMENT absent de cette liste.
          # Il est arrêté depuis 5 semaines, et il ne sert personne : Echo est
          # désactivé côté frontend (`echo.ts:37-40`, tant que
          # `VITE_ECHO_ENABLED` et `VITE_REVERB_APP_KEY` sont absents — elles ne
          # sont déclarées nulle part), et le Caddyfile n'a aucune route
          # WebSocket vers `reverb:8080`.
          # L'ajouter ici le DÉMARRERAIT — en cible `dev`, avec le montage bind
          # qui masque le vendor de l'image. On réintroduirait précisément le
          # défaut corrigé le 2026-08-16. Rallumer le temps réel est une
          # décision produit : elle passe par l'overlay de prod, pas par cette
          # ligne.
          # ══════════════════════════════════════════════════════════════════
          # 🔴 DEBLOCAGE PREALABLE — INCIDENT DU 2026-08-23, 18h11
          # ══════════════════════════════════════════════════════════════════
          #
          # Ce qui s'est passe : `compose up --force-recreate` a recree api, app
          # et horizon, puis a bute sur le scheduler :
          #
          #   Error response from daemon: cannot remove container "5f9bef93...":
          #   container is running: stop the container before removing
          #
          # Compose retire les conteneurs SANS `--force`. Quand l'un d'eux ne
          # repond plus a l'arret (tache bloquee, montage occupe), le retrait
          # echoue, `up` s'ARRETE LA — et api comme app, deja retires, ne sont
          # JAMAIS redemarres. La production est tombee entierement a 502 alors
          # que le defaut ne concernait qu'un cron secondaire.
          #
          # La relance a empire : compose a cree un doublon prefixe d'un hash
          # (`11768d02a99c_axion-crm-scheduler`), qui entrait alors en conflit de
          # NOM avec le zombie. Deux conteneurs pour un nom, aucun ne demarre.
          #
          # 🔑 CE BLOC RETIRE DE FORCE CE QUI TIENT UN NOM EN OTAGE, et rien
          # d'autre :
          #   - les doublons prefixes d'un hash (`<hash>_axion-crm-*`), qui ne
          #     sont JAMAIS legitimes : compose les fabrique en dernier recours ;
          #   - le scheduler lui-meme, parce que `up --force-recreate` s'apprete
          #     de toute facon a le remplacer. Le retirer d'avance n'enleve rien
          #     de plus, et evite que son retrait echoue AU MILIEU du cycle.
          #
          # ⚠️ ON NE TOUCHE PAS a `postgres`, `redis` ni `caddy` : ils portent
          # l'etat et ne sont pas dans la liste de `--force-recreate`.
          echo "::group::deblocage des conteneurs coinces"
          for fantome in $(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]+_axion-crm-' || true); do
            echo "doublon prefixe d'un hash : $fantome — retrait force"
            docker rm -f "$fantome" || true
          done
          if docker ps -a --format '{{.Names}}' | grep -qx 'axion-crm-scheduler'; then
            echo "scheduler present — retrait force avant recreation"
            docker rm -f axion-crm-scheduler || true
          fi
          echo "::endgroup::"

          docker compose up -d --build --force-recreate --no-deps api app horizon scheduler

          # 🔴 F40-005 (2026-08-20) — LE PIÈGE 18, RÉPARÉ POUR LA PRÉPRODUCTION
          # LE 19/08 (`deploy-staging.yml:143`) ET JAMAIS RÉTROPORTÉ ICI.
          #
          # La ligne ci-dessus nomme ses services ET porte `--no-deps` : elle
          # n'emporte donc PAS `postgres` ni `redis`. Conséquence jamais tirée
          # jusqu'ici : aucun pas de ce déploiement ne pouvait appliquer une
          # modification de `docker-compose*.yml` portant sur `postgres`,
          # `redis` ou `reverb`. Ces conteneurs gardaient la configuration de
          # leur création, indéfiniment.
          #
          # C'est l'écart mesuré le 2026-08-19 : `docker-compose.prod.yml`
          # portait bien `ports: !override []`, la garde `config-prod` était
          # VERTE sur la configuration fusionnée, et le conteneur publiait quand
          # même 55432 devant 4 295 349 fiches. Le fichier avait raison, le
          # conteneur avait tort, et le déploiement n'avait aucun moyen de les
          # réconcilier. Les huit réglages de l'overlay n'étaient en place que
          # parce que quelqu'un avait joué les `--force-recreate` à la main.
          #
          # ⚠️ SANS `--force-recreate`, délibérément. `up -d` ne recrée un
          # conteneur que si sa configuration fusionnée a réellement changé :
          # dans le cas courant c'est un no-op, et la base n'est pas coupée. Le
          # jour où l'overlay change pour `postgres` ou `redis`, il coupe
          # quelques secondes — et c'est précisément le but.
          #
          # ⚠️ `reverb` reste VOLONTAIREMENT absent, pour la raison exposée
          # ci-dessus : l'ajouter ici le DÉMARRERAIT.
          docker compose up -d --no-deps postgres redis

          # 🔴 CADDY DOIT REDEMARRER APRES `api`, ET C'EST UNE PANNE DE
          #    PRODUCTION MESUREE QUI L'IMPOSE — 2026-08-21, deploiement 377febf.
          #
          # CE QUI S'EST PASSE. La ligne `--force-recreate ... api` ci-dessus
          # detruit et recree le conteneur `api` : Docker lui attribue alors une
          # NOUVELLE adresse sur le reseau interne. Caddy, lui, n'etait ni
          # recree ni redemarre par ce script — il n'y apparaissait que dans la
          # boucle de VERIFICATION plus bas. Il gardait donc l'ancienne adresse,
          # resolue au demarrage de son propre conteneur.
          #
          # Resultat mesure :
          #
          #   les cinq conteneurs .............. running (healthy)   <- trompeur
          #   les migrations ................... « Aucune migration en attente »
          #   https://app.axion-crm-pro.com .... 200                 <- trompeur
          #   https://api.axion-crm-pro.com/up . 502, pendant 13 minutes
          #   le job `Smoke test prod` ......... ROUGE des la 21e seconde
          #
          # ⚠️ CORRECTION : une premiere version de ce commentaire disait « le
          # deploiement REUSSIT ». C'est faux. L'etape `Smoke test prod`
          # ci-dessous A DETECTE le 502 et a fait echouer le job :
          #
          #     curl: (22) The requested URL returned error: 502
          #     ##[error]Health check failed
          #
          # Ce qui a manque n'est donc pas la detection, c'est la LECTURE : un
          # deploiement en echec n'envoie aucune notification, et treize minutes
          # ont passe avec un job rouge que personne ne regardait.
          #
          # Ce qui a egare le diagnostic sur le moment, ce sont les conteneurs :
          # tous `healthy`, Caddy compris, pendant que Caddy parlait a une
          # adresse morte. Un healthcheck qui interroge le conteneur lui-meme ne
          # dit rien de ce qu'il ATTEINT.
          #
          # Le `docker restart axion-crm-caddy` joue a la main a ramene l'API en
          # 200 immediatement.
          #
          # ⚠️ POURQUOI `restart` ET NON `up -d --no-deps caddy`. `up -d` ne
          # recree un conteneur que si sa CONFIGURATION FUSIONNEE a change. Ici
          # la configuration de Caddy n'a pas bouge d'un octet — c'est l'adresse
          # de son amont qui a change. `up -d` serait donc un no-op, et la panne
          # resterait entiere. C'est exactement le piege du patron F40-005 note
          # ci-dessus, sous une autre forme : le fichier a raison, le conteneur
          # a tort, et rien ne les reconcilie.
          #
          # Le cout est de deux ou trois secondes de coupure, a un moment ou le
          # deploiement coupe deja.
          echo "::group::redemarrage de Caddy (il doit re-resoudre l'adresse d'api)"
          docker compose restart caddy
          echo "::endgroup::"
          echo "::endgroup::"

          if [ "$SKIP_MIGRATE" != "true" ]; then
            echo "::group::php artisan migrate --force (BLOQUANT)"
            # Plus de `|| true` : une migration en échec DOIT casser le déploiement.
            # --database=pgsql_owner (lot L0, 2026-08-14) : les migrations doivent
            # tourner avec le rôle PROPRIÉTAIRE des tables. Tant que le drapeau
            # CRM_DB_APP_ROLE_ENABLED est à false, `pgsql_owner` a exactement les
            # mêmes identifiants que `pgsql` — le changement est donc sans effet
            # aujourd'hui. Il devient indispensable le jour où l'application
            # bascule sur le rôle applicatif non-propriétaire `axion_app`, qui
            # n'a AUCUN droit DDL.
            docker compose exec -u root -T api php artisan migrate --force --database=pgsql_owner </dev/null
            echo "::endgroup::"
          fi

          echo "::group::php artisan cache:clear"
          # ⚠️ `config:clear` et `route:clear` ont été RETIRÉS d'ici.
          # Depuis le passage à l'image `prod`, c'est `entrypoint-prod.sh` qui
          # construit ces deux caches au démarrage, avec l'environnement réel.
          # Les vider juste après annulerait son travail : le conteneur
          # repartirait sans cache de configuration ni de routes, plus lent, et
          # pour rien.
          # `cache:clear` reste : il purge le cache APPLICATIF (Redis), ce qui
          # est légitime après une migration.
          docker compose exec -u root -T api php artisan cache:clear </dev/null
          echo "::endgroup::"

          echo "::group::vérification post-déploiement — santé des conteneurs"
          docker compose ps --format '{{.Service}}|{{.State}}|{{.Status}}'
          PS_OUT="$(docker compose ps --format '{{.Service}}|{{.State}}|{{.Status}}')"
          for svc in api app horizon postgres redis caddy; do
            line="$(printf '%s\n' "$PS_OUT" | awk -F'|' -v s="$svc" '$1 == s { print $0 }')"
            if [ -z "$line" ]; then
              echo "::error::conteneur $svc absent après déploiement"
              exit 1
            fi
            state="$(printf '%s' "$line" | cut -d'|' -f2)"
            status="$(printf '%s' "$line" | cut -d'|' -f3)"
            if [ "$state" != "running" ]; then
              echo "::error::conteneur $svc non démarré (état: $state)"
              docker compose logs --tail=50 "$svc"
              exit 1
            fi
            case "$status" in
              *unhealthy*)
                echo "::error::conteneur $svc unhealthy ($status)"
                docker compose logs --tail=50 "$svc"
                exit 1
                ;;
            esac
            echo "OK — $svc : $state ($status)"
          done
          echo "::endgroup::"

          # ── 🔴 F38-003 / F40-004 (2026-08-20) ────────────────────────────
          # LA SEULE GARDE QUI MESURE LE RÉEL N'ÉTAIT BRANCHÉE NULLE PART ICI.
          #
          # `infra/scripts/verifier-ports-publies.sh` a été écrit le 19/08
          # PRÉCISÉMENT pour la panne de PRODUCTION — et jusqu'à aujourd'hui son
          # unique appel exécutable du dépôt était dans le workflow de
          # PRÉPRODUCTION, code de retour avalé par un `|| echo`. La pile qui a
          # été percée n'était mesurée par AUCUN job.
          #
          # Ce que ce script ajoute au job `config-prod` : `config-prod` valide
          # le FICHIER fusionné, celui-ci lit `docker ps` — donc l'état qui
          # tourne. Le 19/08 le premier était vert pendant que le second aurait
          # rendu `exit 1`.
          #
          # Rejoué en lecture seule le 2026-08-20 sur le poste de développement,
          # dont la pile `axion-crm-pro` publie encore 55432 (c'est le confort
          # du poste, `docker-compose.yml` sans overlay) :
          #   axion-crm-pro (défaut « 80 443 ») → exit 1, « ports publiés sur
          #     internet alors qu'ils ne devraient pas : 55432 »
          #   projet inexistant                 → exit 2, « la mesure n'a rien vu »
          #   bookforge « 5433 6380 »           → exit 0
          #   bookforge liste vide              → exit 1
          # Il sait rougir, et sur exactement le défaut du 19/08.
          #
          # ⚠️ AUCUNE TOLÉRANCE ICI, et c'est le cœur du correctif. Un `|| echo`
          # ou un `|| true` n'affaiblirait pas ce contrôle : il l'annulerait,
          # `exit 2` compris — c'est-à-dire le refus du script de rassurer quand
          # il n'a rien pu mesurer.
          #
          # ⚠️ Mesure de référence sur la production, 2026-08-19 :
          # « OK : la pile ne publie que 80 443 » (exit 0). Ce contrôle ne doit
          # donc pas rougir au prochain déploiement. S'il rougit, la production
          # a dérivé depuis — le lire comme une vraie alerte, pas comme un
          # défaut de la garde.
          echo "::group::vérification post-déploiement — ports RÉELLEMENT publiés"
          if ! bash "$PROJECT_PATH/infra/scripts/verifier-ports-publies.sh" axion-crm-pro; then
            echo "::error::La pile de PRODUCTION publie un port qui ne devrait pas l'être,"
            echo "::error::ou la mesure n'a rien pu voir. Voir la sortie ci-dessus."
            echo "::error::C'est la faille du 2026-08-19 : Postgres et Redis (SANS mot de passe)"
            echo "::error::joignables depuis internet devant 4 295 349 fiches."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::vérification post-déploiement — migrations appliquées"
          MIGRATE_STATUS="$(docker compose exec -u root -T api php artisan migrate:status --no-ansi --database=pgsql_owner </dev/null)"
          printf '%s\n' "$MIGRATE_STATUS" | tail -20
          if printf '%s\n' "$MIGRATE_STATUS" | grep -qw 'Pending'; then
            echo "::error::des migrations sont encore en attente après le déploiement"
            printf '%s\n' "$MIGRATE_STATUS" | grep -w 'Pending'
            exit 1
          fi
          echo "Aucune migration en attente."
          echo "::endgroup::"

          # Sentinelle : prouve que le script distant est allé jusqu'au bout,
          # donc que les vérifications ci-dessus ont VRAIMENT tourné.
          echo "AXION_DEPLOY_SCRIPT_COMPLETE"
          REMOTE

          if ! grep -q 'AXION_DEPLOY_SCRIPT_COMPLETE' /tmp/deploy-remote.log; then
            echo "::error::le script distant s'est interrompu avant la fin — les vérifications post-déploiement n'ont pas toutes tourné"
            exit 1
          fi

      - name: Smoke test prod
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL || 'https://api.axion-crm-pro.com/up' }}
          APP_URL: ${{ vars.APP_URL || 'https://app.axion-crm-pro.com' }}
        run: |
          set -e
          echo "Wait 20s for containers to settle..."
          sleep 20

          echo "GET $HEALTH_URL"
          curl -fsS --max-time 10 "$HEALTH_URL" || (echo "::error::Health check failed" && exit 1)

          echo "GET $APP_URL"
          curl -fsS --max-time 10 -o /dev/null "$APP_URL" || (echo "::error::App URL failed" && exit 1)

          echo "::notice::Deploy OK"

      # ══════════════════════════════════════════════════════════════════════
      # 🔴 L'ALERTE — le seul chainon qui manquait le 2026-08-21
      # ══════════════════════════════════════════════════════════════════════
      #
      # Ce jour-la, l'etape `Smoke test prod` ci-dessus a DETECTE le 502 des la
      # 21e seconde et fait echouer ce job :
      #
      #     curl: (22) The requested URL returned error: 502
      #     ##[error]Health check failed
      #
      # La detection marchait donc parfaitement. Ce qui manquait, c'est que
      # quelqu'un l'APPRENNE : un deploiement en echec n'envoyait aucune
      # notification, et le rouge a attendu treize minutes sur GitHub que
      # quelqu'un vienne le regarder. Une alarme que personne ne recoit n'est
      # pas une alarme.
      #
      # ⚠️ `if: failure()` — ne tourne QUE si une etape precedente a echoue.
      # Pas sur une annulation, qui n'est pas un incident.
      #
      # ⚠️ `continue-on-error: true` — l'alerte ne doit JAMAIS masquer la panne
      # qu'elle annonce. Si Telegram est injoignable, le job reste rouge pour la
      # bonne raison, pas pour un echec d'envoi.
      #
      # ⚠️ LE JETON NE DOIT PAS FUIR. Il passe par l'ENVIRONNEMENT, jamais par la
      # ligne de commande (`ps` et les journaux montrent les arguments, pas
      # l'environnement), et la sortie de `curl` part dans /dev/null : son
      # message d'erreur citerait l'URL, qui contient le jeton.
      - name: Alerte Telegram si le deploiement a echoue
        if: failure()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Deploiement en ECHEC et canal Telegram NON CONFIGURE : personne ne sera prevenu."
            echo "Poser les secrets de depot TELEGRAM_BOT_TOKEN et TELEGRAM_CHAT_ID"
            echo "(Settings > Secrets and variables > Actions > New repository secret)."
            exit 0
          fi

          # Ecrit pour etre lu sur un telephone, par quelqu'un qui n'a pas le
          # contexte : ce qui est casse, sur quel commit, et le lien direct.
          SUJET=$(echo "$COMMIT_MSG" | head -1)
          NL=$(printf '%b' '\n')
          TEXTE="DEPLOIEMENT EN ECHEC - axion-crm-pro${NL}${NL}"
          TEXTE="${TEXTE}L API ou l application peut etre injoignable EN CE MOMENT.${NL}${NL}"
          TEXTE="${TEXTE}Commit : ${SUJET}${NL}Journal : ${RUN_URL}${NL}${NL}"
          TEXTE="${TEXTE}Geste de secours si l API rend 502 :${NL}"
          TEXTE="${TEXTE}  ssh root@46.62.248.239${NL}"
          # ⚠️ `docker restart`, PAS `docker compose restart`. Deux raisons, et
          # la seconde n'est pas cosmetique :
          #  - c'est la commande REELLEMENT jouee a la main le 2026-08-21, qui a
          #    ramene l'API en 200 immediatement ;
          #  - la garde `A09` extrait toute ligne contenant `docker compose ` et
          #    exige qu'elle soit citee dans `_AUDIT/DEPLOY-PIPELINE.md`. Cette
          #    ligne-ci est un MESSAGE, pas une commande, et le detecteur ne peut
          #    pas faire la difference : il extrayait `docker compose restart
          #    caddy"` — avec le guillemet — introuvable au document. Le
          #    detecteur a raison d'etre bete ; c'est au message de ne pas mentir.
          TEXTE="${TEXTE}  docker restart axion-crm-caddy"

          # `--fail` : sans lui, `curl` rend 0 meme sur un 401 ou un 404, et cette
          # etape annoncerait « alerte envoyee » alors que Telegram a refuse.
          # Mesure a blanc du 2026-08-21 : avec un jeton bidon, elle se declarait
          # satisfaite. Une alerte qui ment sur son propre succes est pire que pas
          # d alerte : elle rassure.
          if curl -sS --fail --max-time 15 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -d "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXTE}" -d "disable_web_page_preview=true" 2>/dev/null; then
            echo "alerte Telegram envoyee"
          else
            echo "::warning::l envoi de l alerte Telegram a echoue"
          fi
