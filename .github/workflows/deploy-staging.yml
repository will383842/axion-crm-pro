name: Deploy Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # H44-003 (S1) — « la préproduction est déployée à chaque poussée sur main
  # sans qu'un seul test soit joué ».
  #
  # CE QUI ÉTAIT LÀ AVANT CE JOB : `build-and-push` partait directement sur
  # `push: branches: [main]`, puis `deploy-staging` derrière lui. Aucune
  # dépendance vers la CI. Un commit qui casse Pest, PHPStan, Pint, le
  # typecheck du frontend ou le build des workers atterrissait quand même sur
  # `staging.axion-crm-pro.com` — et la préproduction, qui existe justement
  # pour attraper ce qui échappe à la CI, servait alors du code que la CI
  # n'avait même pas regardé.
  #
  # L'écart est d'autant plus voyant que la PRODUCTION, elle, est câblée :
  # `deploy-direct-ssh.yml` porte ce même job `ci` et son `deploy` a
  # `needs: [ci]` + `if: needs.ci.result == 'success'` depuis le 2026-08-13.
  # Le correctif existait donc DÉJÀ dans le dépôt, à un fichier d'ici, et
  # n'avait pas été porté sur le second site — c'est le défaut A-011,
  # caractéristique de ce dépôt (25 cas recensés par l'audit 360).
  #
  # ⚠️ `needs` ne fonctionne qu'à l'intérieur d'un même workflow : `ci.yml` est
  # donc appelé comme workflow RÉUTILISABLE (`workflow_call`, déjà déclaré en
  # tête de `ci.yml`), exactement comme le fait la production. On n'invente
  # rien, on étend l'existant.
  #
  # ⚠️ Les deux appels de `ci.yml` (production et préproduction) ne se
  # concurrencent pas : le groupe de concurrence de `ci.yml` est
  # `ci-${{ github.workflow }}-${{ github.ref }}`, et `github.workflow` vaut le
  # nom du workflow APPELANT. « Deploy Staging » et « Deploy direct SSH
  # Hetzner » tombent donc dans deux groupes distincts, et `cancel-in-progress`
  # y vaut `false` (il n'est vrai que sur `pull_request`). Aucun des deux ne
  # peut affamer l'autre.
  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 F38-008 — plafonds anti-gel, poses le 2026-08-22. Aucun job de la
  # chaine qualite n'avait de borne : sans elle un job herite du plafond
  # GitHub de 6 h, et SIX executions etaient figees entre 1 h 28 et 2 h 25
  # au moment de la mesure. Ce ne sont pas des budgets : ce sont des
  # plafonds, poses tres au-dessus de la duree utile. Si un job legitime
  # est tue, relever la borne EN CITANT la duree du run tue — jamais la
  # retirer. Explication complete : .github/workflows/ci.yml, en-tete.
  # Garde : backend/tests/Feature/Infra/WorkflowsBornesDeDureeTest.php
  # ⚠️ Ce job-ci N'A PAS de `timeout-minutes` et NE PEUT PAS en avoir : GitHub
  # refuse la cle sur un job qui appelle un workflow reutilisable (`uses:`).
  # Les bornes des six jobs de `ci.yml` s'appliquent a sa place.
  ci:
    name: CI (gate bloquant)
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # `packages: read` et non `write` : un workflow appelé ne peut que
      # RESTREINDRE les droits de l'appelant, et `ci.yml` n'a besoin que de
      # LIRE GHCR (l'image Postgres du job backend). Même déclaration que dans
      # `deploy-direct-ssh.yml`.
      packages: read
    secrets: inherit

  build-and-push:
    name: Build + push GHCR
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # F38-008 (le commentaire ci-dessous chiffre ce build a ~25 min)
    # Rien ne part vers GHCR tant que la CI n'est pas verte. Construire puis
    # jeter coûterait ~25 min de runner pour rien, et surtout une image
    # `:staging` publiée est immédiatement tirable par le serveur.
    needs: [ci]
    if: ${{ needs.ci.result == 'success' }}
    strategy:
      matrix:
        include:
          - { image: api,    dockerfile: Dockerfile.laravel,  target: prod }
          - { image: app,    dockerfile: Dockerfile.frontend, target: prod }
          # ── H47-005 ───────────────────────────────────────────────────────
          # `{ image: worker, dockerfile: Dockerfile.worker, target: prod }`
          # RETIRE le 2026-08-22. Il construisait et poussait
          # `.../worker:staging` a CHAQUE deploiement de preproduction, pour une
          # image que PERSONNE ne tire : les workers Playwright ont ete retires
          # de la pile le 2026-08-14 (docker-compose.yml, en tete du service
          # `caddy`), aucun fichier compose ne declare de service `worker`, et
          # l'etape de deploiement ci-dessous nomme ses services un par un
          # (`api app horizon scheduler`). Mesure du 2026-08-22 : 32 des 57
          # alertes de l'analyse d'image, dont les 2 critiques, venaient de
          # cette image jamais executee.
          #
          # ⚠️ REACTIVATION : elle se fait DES DEUX COTES, ensemble. Redeclarer
          # les services dans `docker-compose.yml` (comme le dit son commentaire)
          # ET remettre cette ligne. Le code vit toujours dans `workers/`, et le
          # job `workers` de `ci.yml` continue de le tester a chaque PR : rien
          # n'est perdu, seule la construction sur le chemin de deploiement
          # disparait. Garde : `backend/tests/Feature/Infra/ImagesConstruitesSontDeployeesTest.php`.
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/axion-crm-pro/${{ matrix.image }}:staging
            ghcr.io/${{ github.repository_owner }}/axion-crm-pro/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ══════════════════════════════════════════════════════════════════════════
  # 🔴 RÉÉCRIT le 2026-08-19 — Coolify RETIRÉ, remplacé par le patron SSH.
  #
  # Ce qui était là avant : deux jobs `trigger-coolify` + `smoke` conditionnés à
  # `vars.COOLIFY_STAGING_ENABLED`. Ils n'ont JAMAIS tourné, et pour une raison
  # de fond : **le CRM ne se déploie pas par Coolify.** Il se déploie par
  # `deploy-direct-ssh.yml` (SSH + `git reset --hard` + `docker compose`).
  # Coolify déploie le SITE Axion-IA, pas ce produit — une confusion durable
  # entre les deux dépôts.
  #
  # Bâtir la préproduction sur Coolify aurait créé un SECOND mécanisme de
  # déploiement, différent de celui de la production : une préproduction qui ne
  # prouve rien sur le chemin réel, et qui contredit le §28.5 (« on étend, on ne
  # réinvente pas »). Ce job rejoue donc EXACTEMENT le patron de production.
  #
  # ⚠️ La production ne dépend PAS de ce job (§6.6 point 8 de l'inventaire) :
  # d'abord prouver que la préproduction vit, ensuite seulement brancher la
  # dépendance. Faire l'inverse casserait le déploiement de production avant
  # même que la préproduction existe.
  #
  # Prérequis, à jouer UNE FOIS : `infra/scripts/bootstrap-preprod.sh` sur le
  # serveur (clone dans /opt/axion-crm-pro-staging, .env dédié, première pile).
  # ══════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: SSH Hetzner — préproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # F38-008 (SSH + pull + migrate + redemarrage)
    needs: build-and-push
    environment:
      name: staging-direct-ssh
      url: https://staging.axion-crm-pro.com
    steps:
      - name: Les secrets sont-ils là ?
        run: |
          set -e
          if [ -z "${{ secrets.HETZNER_SSH_PRIVATE_KEY }}" ]; then
            echo "::error::Secret HETZNER_SSH_PRIVATE_KEY manquant."
            exit 1
          fi
          if [ -z "${{ secrets.HETZNER_HOST }}" ]; then
            echo "::error::Secret HETZNER_HOST manquant."
            exit 1
          fi

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Confiance dans la clé d'hôte
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Déploiement de la préproduction
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Heredoc QUOTÉ : le script part tel quel sur le serveur. Les valeurs
          # voyagent en arguments.
          # ⚠️ Chaque `docker exec` DOIT lire sur /dev/null : sinon il consomme le
          # reste du script (qui arrive par l'entrée standard) et tout ce qui suit
          # est silencieusement AVALÉ — défaut mesuré sur le déploiement b84100f,
          # où le job est resté VERT sans avoir rien exécuté.
          # 🔴 F41-002 (2026-08-24) — la connexion mourait DE SILENCE.
          #
          # Mesure du déploiement 7188298 : `horizon Recreated` à 04:50:01, puis
          # QUATRE MINUTES ET DIX-SEPT SECONDES sans un octet, puis
          # `client_loop: send disconnect: Broken pipe` et `exit code 255`. Le
          # script n'a jamais atteint ses vérifications : ce n'était pas la
          # préproduction qui répondait mal, c'était le tuyau qui avait lâché.
          #
          # Pendant un `docker compose up -d --build`, la connexion ne porte
          # aucun trafic tant que le build n'écrit rien. Sans sonde de vie, un
          # pare-feu ou un NAT intermédiaire la coupe.
          #
          # Le remède est DÉJÀ dans le dépôt, à un fichier d'ici : la production
          # porte ces deux mêmes options dans `deploy-direct-ssh.yml`, dont le
          # commentaire décrit exactement ce qui vient d'arriver ici — « elles
          # empêchent la connexion de mourir DE SILENCE ». Elles n'avaient jamais
          # été propagées sur ce second site. C'est le défaut A-011, le même que
          # A-010 (le contrôle FastCGI) et que le verrou facultatif du
          # `Dockerfile.frontend` : trois oublis de propagation, même journée.
          #
          # ⚠️ CE QUE CECI NE FAIT PAS — et la production le dit déjà : ces
          # options n'empêchent que la mort par silence. Elles ne rendent pas le
          # déploiement REPRENABLE. Si le tuyau tombe pour une autre raison
          # (réseau coupé, serveur redémarré), on retombe dans le même angle
          # mort. Lancer le script détaché côté serveur et interroger son état
          # séparément reste À FAIRE, des deux côtés.
          ssh -o StrictHostKeyChecking=no \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=10 \
              "$USER@$HOST" 'bash -s' -- \
            "$EXPECTED_SHA" <<'REMOTE'
          set -euo pipefail
          EXPECTED_SHA="$1"
          CHEMIN="/opt/axion-crm-pro-staging"

          if [ ! -d "$CHEMIN/.git" ]; then
            echo "::error::$CHEMIN absent — lancer infra/scripts/bootstrap-preprod.sh d'abord."
            exit 1
          fi

          cd "$CHEMIN"
          git fetch --depth 50 origin main
          git reset --hard "$EXPECTED_SHA"
          echo "HEAD = $(git rev-parse --short HEAD)"

          export COMPOSE_FILE="docker-compose.yml:docker-compose.staging.yml"
          export COMPOSE_PROJECT_NAME="axion-crm-staging"

          # 🔴 Les services sont NOMMÉS. Un `up -d` global démarrerait le service
          # `caddy` hérité de docker-compose.yml — qui prendrait 80/443 et
          # TUERAIT le Caddy de PRODUCTION. L'overlay le met sous profil pour
          # cette raison ; ce nommage est la seconde ceinture.
          echo "::group::build + up"
          docker compose up -d --build --force-recreate --no-deps api app horizon scheduler
          # postgres et redis sans --force-recreate : les redémarrer à chaque
          # déploiement ne sert à rien et coupe la base pour rien.
          docker compose up -d --no-deps postgres redis
          echo "::endgroup::"

          echo "::group::migrations"
          docker exec axion-crm-staging-api php artisan migrate --force --database=pgsql_owner < /dev/null
          echo "::endgroup::"

          # ── Vérifications. Un déploiement vert qui n'a rien appliqué, on
          #    connaît : c'est le §7 du journal du 19/08.
          echo "::group::vérifications"
          ok=1

          # 🔴 F41-001 (2026-08-24) — ces deux contrôles NE POUVAIENT PAS passer.
          #
          # La préproduction était déclarée MUETTE à CHAQUE déploiement depuis le
          # 2026-08-23 au moins (c026a44, 99f9bb6, a1a0f6b, 3ed04f0, 79524a7,
          # c4c3770, f0b0c52, bc0fafd — huit de suite). Ce n'est pas la pile qui
          # tombait : c'est la mesure qui visait à côté, sur DEUX points.
          #
          # 1. LA MAUVAISE ADRESSE. La pile ne publie rien sur `127.0.0.1` : elle
          #    publie sur la passerelle du pont `docker0`
          #    (`${STAGING_BIND_IP:-172.17.0.1}`), et c'est délibéré — voir la
          #    contrainte 3 en tête de `docker-compose.staging.yml`, qui raconte
          #    déjà ce piège dans l'autre sens (« Caddy tapait sur
          #    172.17.0.1:8081, où rien n'écoutait »). D'où le refus INSTANTANÉ
          #    qu'on lit dans les journaux : « Failed to connect to 127.0.0.1
          #    port 8081 after 0 ms ». Zéro milliseconde : personne n'écoute là.
          #
          # 2. LA MAUVAISE LANGUE, pour l'API. Le constat A-010 (S0) a déjà établi
          #    que ce service ne sert plus HTTP mais parle FastCGI, et le
          #    healthcheck du compose a été refait pour l'interroger avec
          #    `cgi-fcgi`. Ce correctif n'a jamais été propagé ICI : le workflow
          #    est resté sur `curl http://…/up`, qui — le compose l'écrit noir sur
          #    blanc — « échouerait TOUJOURS ».
          #
          # Une garde qui ne peut pas passer n'est pas une garde sévère, c'est une
          # garde morte : elle rougit sur une pile saine, donc plus personne ne
          # lit son rouge. C'est le symétrique du vert menteur, et il coûte aussi
          # cher.
          #
          # 3. AUCUNE ATTENTE, enfin. Les contrôles partaient 0,8 s après le
          #    démarrage des conteneurs (Started 20:02:19.34 → MUETTE
          #    20:02:20.13). Le déploiement de PRODUCTION, lui, laisse 20 s. Les
          #    boucles ci-dessous réessaient au lieu d'attendre à l'aveugle :
          #    elles sortent dès que ça répond, et ne masquent rien puisqu'elles
          #    finissent par poser `ok=0`.

          # L'adresse est DEMANDÉE À DOCKER, pas devinée : `docker compose port`
          # rend ce qui est réellement publié. Si le binding change un jour, la
          # mesure suit toute seule — c'est la règle de ce fichier, « mesuré sur
          # les conteneurs, pas sur le fichier ».
          ADDR_APP="$(docker compose port app 5173 2>/dev/null || true)"
          if [ -z "$ADDR_APP" ]; then
            echo "::error::impossible de lire l'adresse publiée du frontend — la mesure n'a rien vu."
            ok=0
          fi

          # API : php-fpm parle FastCGI, on l'interroge donc par son healthcheck
          # (celui du compose, qui utilise `cgi-fcgi`) et non par un curl HTTP.
          # `start_period: 40s` + `interval: 30s` : 90 s de budget, pas moins.
          echo -n "API préprod (php-fpm, healthcheck FastCGI) : "
          etat_api="jamais-lu"
          for _ in $(seq 1 30); do
            etat_api="$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}sans-healthcheck{{end}}' axion-crm-staging-api 2>/dev/null || echo absent)"
            case "$etat_api" in
              healthy) break ;;
              # Un conteneur sans healthcheck ou introuvable ne deviendra jamais
              # sain : inutile d'attendre 90 s pour l'apprendre.
              sans-healthcheck|absent) break ;;
            esac
            sleep 3
          done
          [ "$etat_api" = "healthy" ] \
            && echo "saine" || { echo "MUETTE (état : $etat_api)"; ok=0; }

          # Frontend : là, un vrai appel HTTP sur l'adresse publiée — il teste EN
          # PLUS que la publication réseau fonctionne, ce qu'un healthcheck
          # interne au conteneur ne voit pas.
          echo -n "Frontend préprod ($ADDR_APP) : "
          if [ -n "$ADDR_APP" ]; then
            repond=0
            for _ in $(seq 1 30); do
              if curl -fsS --max-time 15 -o /dev/null "http://$ADDR_APP" 2>/dev/null; then
                repond=1
                break
              fi
              sleep 3
            done
            [ "$repond" -eq 1 ] && echo "répond" || { echo "MUET"; ok=0; }
          else
            echo "NON MESURÉ"
          fi

          # TÉMOIN POSITIF — la PRODUCTION n'a pas bougé. Sans lui, « la préprod
          # répond » ne dirait rien de ce qu'on aurait pu casser à côté.
          echo -n "PRODUCTION intacte : "
          curl -fsS --max-time 15 -o /dev/null -H 'Host: app.axion-crm-pro.com' http://127.0.0.1/ 2>&1 \
            && echo "oui" || { echo "NON — ALERTE"; ok=0; }

          # La préprod ne doit RIEN publier vers internet.
          echo "-- ports publiés par la pile de préproduction --"
          # Liste des ports publics autorises VIDE : la preproduction ne doit rien
          # publier sur internet du tout, ses deux publications sont sur 172.17.0.1.
          # Passer « 8081 8082 » ici ferait rougir le temoin positif de la garde sur
          # une pile parfaitement conforme.
          # 🔴 F38-003 / F40-004 (2026-08-20) — c'était `|| echo "(contrôle des
          # ports en échec — voir ci-dessus)"`, et ce `echo` ANNULAIT la garde.
          #
          # Il ne la dégradait pas : il l'annulait. Le `||` retombait sur une
          # commande qui réussit toujours, donc le code de retour disparaissait
          # — y compris le `exit 2` « aucun conteneur trouvé, la mesure n'a rien
          # vu », qui est le témoin INTERNE du script, celui qui refuse de
          # rassurer sur du vide. La variable `ok` évaluée dix lignes plus bas
          # n'était pas touchée : ce contrôle ne pouvait faire rougir AUCUN
          # déploiement, nulle part.
          #
          # `|| ok=0` alimente la variable que la ligne `[ "$ok" -eq 1 ]`
          # évalue juste après. L'échec redevient un échec.
          #
          # Mesuré le 2026-08-20 sur ce poste, en lecture seule : le script sait
          # rougir (`axion-crm-pro` par défaut → exit 1 sur 55432) et sait dire
          # qu'il n'a rien mesuré (projet inexistant → exit 2). Le défaut
          # n'était pas dans le script, il était dans cette ligne.
          bash "$CHEMIN/infra/scripts/verifier-ports-publies.sh" axion-crm-staging "" \
            || ok=0

          echo "::endgroup::"
          [ "$ok" -eq 1 ] || { echo "::error::Vérifications post-déploiement en échec."; exit 1; }
          echo "Préproduction déployée sur $EXPECTED_SHA."
          REMOTE

      - name: Contrôle depuis l'extérieur
        run: |
          set -euo pipefail
          # Le contrôle interne ne prouve pas que Caddy route correctement. Seul
          # un appel depuis internet le fait.
          curl -fsS --max-time 30 https://staging-api.axion-crm-pro.com/up > /dev/null
          curl -fsS --max-time 30 -o /dev/null https://staging.axion-crm-pro.com
          echo "OK — la préproduction répond depuis internet."
