name: Diagnostic - sonde base prod (lecture seule)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  sonde:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
      - name: Sonde
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          ssh -o ServerAliveInterval=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash <<'EOF2'
            cd /opt/axion-crm-pro
            uptime; free -m | head -2; df -h / | tail -1
            PSQL='docker compose exec -T postgres psql -U axion -d axion_crm -X -P pager=off'
            echo "SET default_transaction_read_only = on; SELECT pid, state, now()-query_start AS depuis, left(regexp_replace(query,'\s+',' ','g'),90) AS requete FROM pg_stat_activity WHERE state<>'idle' AND pid<>pg_backend_pid() ORDER BY query_start LIMIT 15; SELECT pg_size_pretty(pg_total_relation_size('companies')) AS taille_companies, (SELECT reltuples::bigint FROM pg_class WHERE relname='companies') AS lignes_estimees; SELECT indexname FROM pg_indexes WHERE tablename='companies' AND (indexdef ILIKE '%siren%' OR indexdef ILIKE '%siret%');" | $PSQL -f -
            docker stats --no-stream --format '{{.Name}} {{.CPUPerc}} {{.MemUsage}}' | head -12
          EOF2