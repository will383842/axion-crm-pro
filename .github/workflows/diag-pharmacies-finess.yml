name: Diagnostic — Pharmacies FINESS vs CRM (prod, lecture seule)

# Arrete d abord les requetes de diagnostic restees bloquees sur la base, puis
# compare FINESS et le CRM en s appuyant sur l index (workspace_id, siren).
# Aucune ecriture dans les tables du CRM. Seuls des totaux sont affiches.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  finess:
    name: Comparaison FINESS / CRM
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Télécharger FINESS et préparer le fichier
        run: |
          set -e
          curl -fsSL -o finess.zip https://irreductix.fr/telecharger/finess.zip
          unzip -q -o finess.zip etablissements.csv
          python3 - <<'PY'
          import csv
          cats = {'620', '627', '628', '629', '641', '690'}
          cols = ['finess_et', 'siret', 'categorie', 'etat', 'nom_long', 'code_postal',
                  'commune_acheminement', 'departement', 'ej_statut_juridique_libelle', 'ej_code_ape']
          src = csv.DictReader(open('etablissements.csv', encoding='utf-8-sig'), delimiter=';')
          out = csv.writer(open('finess_pharma.csv', 'w', newline='', encoding='utf-8'), lineterminator='\n')
          out.writerow(cols)
          n = 0
          for r in src:
              if r['categorie'] in cats:
                  out.writerow([' '.join(r[c].split()) for c in cols]); n += 1
          print('lignes pharmacie FINESS :', n)
          PY

      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Arrêter les anciens diagnostics bloqués
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          ssh -o ServerAliveInterval=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash <<'EOF2'
            cd /opt/axion-crm-pro
            echo "SELECT pg_terminate_backend(pid), left(query,40) FROM pg_stat_activity WHERE state='active' AND pid<>pg_backend_pid() AND (query LIKE 'WITH a AS (SELECT * FROM fin%' OR query LIKE 'CREATE INDEX ON crm%' OR query LIKE '%FROM fin f WHERE categorie%');" | docker compose exec -T postgres psql -U axion -d axion_crm -X -P pager=off -f -
          EOF2

      - name: Comparer (index workspace_id + siren)
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          set -e
          cat > requetes.sql <<'SQL'
          \timing on
          SET statement_timeout = '300s';
          SELECT workspace_id AS ws FROM companies WHERE workspace_id IS NOT NULL LIMIT 1 \gset
          \echo >> FINESS : lignes par categorie et etat
          SELECT categorie, etat, count(*) FROM fin GROUP BY 1,2 ORDER BY 1,2;
          \echo >> Pharmacies du CRM (NAF 47.73Z) : ouvertes / fermees
          SET enable_nestloop = off;
          SET default_transaction_read_only = off;
          CREATE TEMP TABLE sir AS SELECT DISTINCT left(siret,9) AS s FROM fin WHERE categorie='620' AND etat='A' AND siret<>'';
          ANALYZE sir;
          SET default_transaction_read_only = on;
          SELECT count(*) AS total,
                 count(*) FILTER (WHERE insee_ferme_le IS NOT NULL) AS fermees_selon_insee,
                 count(*) FILTER (WHERE insee_ferme_le IS NULL AND siren IN (SELECT s FROM sir)) AS ouvertes_et_officine_active_finess,
                 count(*) FILTER (WHERE insee_ferme_le IS NULL AND siren NOT IN (SELECT s FROM sir)) AS ouvertes_hors_finess_actif,
                 count(*) FILTER (WHERE insee_ferme_le IS NOT NULL AND (phone IS NOT NULL OR website IS NOT NULL OR enriched_at IS NOT NULL)) AS fermees_avec_donnees_enrichies
          FROM companies WHERE workspace_id=:'ws' AND deleted_at IS NULL AND replace(naf,'.','')='4773Z';
          \echo >> Contacts rattaches aux pharmacies fermees
          SELECT count(*) AS contacts, count(DISTINCT p.id) AS pharmacies FROM contacts c JOIN companies p ON p.id=c.company_id WHERE p.workspace_id=:'ws' AND p.deleted_at IS NULL AND replace(p.naf,'.','')='4773Z' AND p.insee_ferme_le IS NOT NULL;          SQL
          {
            echo "CREATE TEMP TABLE fin (finess_et text, siret text, categorie text, etat text, nom_long text, code_postal text, commune text, dep text, statut text, ape text);"
            echo "COPY fin FROM STDIN WITH (FORMAT csv, HEADER true);"
            cat finess_pharma.csv
            printf '\\.\n'
            echo "SET default_transaction_read_only = on;"
            sed 's/^          //' requetes.sql
          } | ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=40 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" \
              "cd /opt/axion-crm-pro && docker compose exec -T postgres psql -U axion -d axion_crm -X -P pager=off -v ON_ERROR_STOP=1 -f -"