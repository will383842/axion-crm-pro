name: Recover scraping + restore access

# Récupération complète (autorisée explicitement par Will, 2026-07-07) :
#   1. Restaure la cle SSH de Claude sur le serveur (acces direct permanent)
#   2. Relance la stack Docker (dont le conteneur `api` arrete)
#   3. Redemarre le service de scraping des sites web
#   4. Affiche l'etat + les compteurs de sites web (lecture Postgres directe)
# Declenchement MANUEL uniquement. Chemin .github/workflows/** => pas de deploy auto.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  recover:
    name: Recover + diag prod
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Trust host key
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Recover via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no "$USER@$HOST" bash <<'EOF'
            set -uo pipefail
            cd /opt/axion-crm-pro
            PSQL="docker exec axion-crm-postgres psql -U axion -d axion_crm -t -A"

            echo "==================== 1. RESTAURE CLE SSH CLAUDE ===================="
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            KEY='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFQqPfzDmU1tTtveLMzAlCbjGZKCV5mERzVdaqNGn5Kj claude-code-axion-ia-20260510'
            if grep -qF "$KEY" /root/.ssh/authorized_keys 2>/dev/null; then
              echo "Cle deja presente."
            else
              echo "$KEY" >> /root/.ssh/authorized_keys
              echo "Cle AJOUTEE."
            fi
            chmod 600 /root/.ssh/authorized_keys

            echo ""
            echo "==================== 2. ETAT AVANT ===================="
            docker compose ps -a 2>&1 || docker ps -a 2>&1

            echo ""
            echo "==================== 3. RELANCE LA STACK ===================="
            # 🔴 CONSTAT F38-007 (S0). Cette ligne ne portait AUCUN overlay.
            # Compose repartait alors du seul `docker-compose.yml`,
            # qui PUBLIE Postgres sur 55432 et Redis sur 56379 ; voyant une
            # configuration differente de celle des conteneurs en place, il les
            # RECREAIT, ports compris.
            #
            # C'est la faille trouvee ouverte depuis l'exterieur le 2026-08-19
            # -- Redis n'a AUCUN mot de passe : FLUSHALL, lecture des jetons,
            # CONFIG SET -- et ce workflow est en `workflow_dispatch` : elle se
            # rouvrait DEPUIS L'INTERFACE GITHUB, en un clic.
            #
            # `COMPOSE_FILE` s'applique a tous les `docker compose` du script,
            # comme dans `deploy-direct-ssh.yml`.
            export COMPOSE_FILE="docker-compose.yml:docker-compose.prod.yml"
            echo "COMPOSE_FILE = $COMPOSE_FILE"
            docker compose up -d 2>&1 | tail -30
            echo "-- attente 12s --"; sleep 12
            docker compose ps 2>&1

            echo ""
            echo "==================== 3 bis. PORTS REELLEMENT PUBLIES ===================="
            # 🔴 F38-003 / F40-004 elargi (2026-08-20) — LE TROISIEME SITE.
            #
            # L'audit nomme deux fichiers : deploy-staging.yml (seul appel, code
            # de retour avale) et deploy-direct-ssh.yml (aucun appel). Il y en a
            # TROIS, et celui-ci est le plus dangereux des trois :
            #
            #   - il est en `workflow_dispatch` : declenchable en un clic depuis
            #     l'interface GitHub, par n'importe qui ayant acces au depot ;
            #   - son `docker compose up -d` ci-dessus ne porte NI `--no-deps`
            #     NI nom de service : il recree TOUTE la pile, postgres et redis
            #     compris. Les deux seuls conteneurs que le deploiement normal
            #     ne touche jamais sont justement ceux-ci.
            #
            # L'overlay a ete rebranche ligne 75 (constat F38-007), et c'est la
            # bonne reparation. Mais elle porte sur le FICHIER. Ce qui suit
            # mesure le REEL — `docker ps`, pas `docker compose config` — parce
            # que le 2026-08-19 le fichier etait juste et le conteneur publiait
            # quand meme 55432 devant 4 295 349 fiches.
            #
            # ⚠️ Ce script est sous `set -uo pipefail` SANS `-e` : un echec ne
            # sort pas tout seul. On retient donc le verdict et on sort a la
            # FIN, pour que le diagnostic qui suit s'imprime quand meme --
            # perdre l'etat du serveur le jour d'un incident serait payer la
            # securite avec l'exploitabilite.
            PORTS_OK=1
            if ! bash infra/scripts/verifier-ports-publies.sh axion-crm-pro; then
              PORTS_OK=0
              echo "::error::La relance a laisse la production publier un port interdit,"
              echo "::error::ou la mesure n'a rien pu voir. Ce job sortira en echec a la fin."
            fi

            echo ""
            echo "==================== 4. REDEMARRE LE SCRAPING (systemd) ===================="
            systemctl restart axion-find-websites 2>&1 && echo "restart demande" || echo "(service systemd absent ?)"
            sleep 3
            systemctl is-active axion-find-websites 2>&1
            systemctl status axion-find-websites --no-pager 2>&1 | head -12
            echo "-- logs scraping (5 dernieres lignes) --"
            tail -n 5 /var/log/axion-find/*.log 2>/dev/null || tail -n 5 /opt/axion-crm-pro/storage/logs/find-ws*.log 2>/dev/null || echo "(pas de logs trouves)"

            echo ""
            echo "==================== 5. RESSOURCES ===================="
            echo "-- disque --"; df -h / | tail -1
            echo "-- memoire --"; free -h | head -2
            echo "-- load --"; uptime

            echo ""
            echo "==================== 6. COMPTEURS SITES WEB ===================="
            echo "-- total entreprises --"
            \$PSQL -c "SELECT count(*) FROM companies;" 2>&1
            echo "-- repartition website_status --"
            \$PSQL -F' | ' -c "SELECT COALESCE(website_status,'(null)'), count(*) FROM companies GROUP BY 1 ORDER BY 2 DESC;" 2>&1
            echo "-- entreprises avec une URL de site --"
            \$PSQL -c "SELECT count(*) FROM companies WHERE website IS NOT NULL AND website <> '';" 2>&1
            echo "-- dernier check --"
            \$PSQL -c "SELECT max(website_checked_at) FROM companies;" 2>&1
            echo "-- checks derniere heure --"
            \$PSQL -c "SELECT count(*) FROM companies WHERE website_checked_at > now() - interval '1 hour';" 2>&1
            echo "-- checks 24h --"
            \$PSQL -c "SELECT count(*) FROM companies WHERE website_checked_at > now() - interval '24 hours';" 2>&1

            echo ""
            echo "==================== FIN ===================="

            # Le verdict des ports, retenu au §3 bis, est rendu ICI — apres que
            # tout le diagnostic se soit imprime. Sans cette ligne, le `::error::`
            # du §3 bis serait un simple texte rouge dans un job VERT : c'est
            # exactement la forme du defaut F38-003 qu'on repare aujourd'hui.
            [ "$PORTS_OK" -eq 1 ] || exit 1
          EOF
