name: Passerelle d'envoi (K2)

on:
  pull_request:
    paths: ['infra/serveur-envoi/passerelle/**', '.github/workflows/passerelle-envoi.yml']
  push:
    branches: [main]
    paths: ['infra/serveur-envoi/passerelle/**']

permissions:
  contents: read

jobs:
  tests:
    name: Tests de la passerelle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/serveur-envoi/passerelle
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite
          tools: composer:v2
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: vendor/bin/phpunit
