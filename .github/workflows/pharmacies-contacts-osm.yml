name: Pharmacies — contacts OpenStreetMap (dry-run ou apply)

# Interroge l'API Overpass publique (OpenStreetMap, licence ODbL) pour les pharmacies de France
# (amenity=pharmacy), réduit chaque point à lat, lon, code postal, téléphone, e-mail, site, puis lance
# `crm:pharmacies:contacts-osm` sur le serveur de prod.
#  - dry-run (défaut) : totaux seulement, RIEN n'est écrit ;
#  - apply : AJOUTE e-mail, site et téléphone sur champ vide ou NULL seulement (jamais d'écrasement),
#    pour les fiches rapprochées par DEUX preuves (même téléphone, ou GPS < 80 m + même code postal) ;
#    hors opposition, fiches protégées et personnes physiques. Aucune adresse n'est devinée.
# `apply` est REFUSÉ sauf si l'entrée « confirmer » vaut OUI.
# Dépôt public : seuls des totaux sont affichés, aucun nom, adresse, e-mail ni numéro.
# Attribution : © les contributeurs d'OpenStreetMap, données sous licence ODbL.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (totaux seulement) ou apply (ajoute e-mails, sites, téléphones sur champs vides)'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmer:
        description: 'Écrire OUI pour autoriser apply'
        type: string
        default: ''

permissions:
  contents: read

# Jamais deux apply (ni deux exécutions) en même temps.
concurrency:
  group: pharmacies-contacts-osm
  cancel-in-progress: false

jobs:
  contacts-osm:
    name: Contacts OSM (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Vérifier la confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRMER" != "OUI" ]; then
            echo "apply refusé : saisir OUI dans l'entrée « confirmer »." >&2
            exit 1
          fi

      - name: Interroger Overpass et construire le CSV minimal
        run: |
          set -e
          python3 - <<'PY'
          import csv, json, re, sys, time, urllib.error, urllib.parse, urllib.request

          ENDPOINT = 'https://overpass-api.de/api/interpreter'
          UA = 'axion-crm-pro-osm-pharmacies/1.0 (+https://github.com/will383842/axion-crm-pro)'
          # Zones ISO 3166-2 : 13 régions métropolitaines (Corse = FR-20R) + 5 DROM.
          ZONES = ['FR-ARA', 'FR-BFC', 'FR-BRE', 'FR-CVL', 'FR-20R', 'FR-GES', 'FR-HDF', 'FR-IDF', 'FR-NOR',
                   'FR-NAQ', 'FR-OCC', 'FR-PDL', 'FR-PAC', 'FR-GP', 'FR-MQ', 'FR-GF', 'FR-RE', 'FR-YT']
          EMAIL = re.compile(r'^[A-Za-z0-9._%+\-]+@[A-Za-z0-9\-]+(\.[A-Za-z0-9\-]+)+$')

          def requete(zone):
              q = ('[out:json][timeout:180];area["ISO3166-2"="%s"]->.z;'
                   '(nwr["amenity"="pharmacy"](area.z););out center tags;' % zone)
              data = urllib.parse.urlencode({'data': q}).encode()
              for essai in range(6):
                  req = urllib.request.Request(ENDPOINT, data=data, headers={'User-Agent': UA})
                  try:
                      with urllib.request.urlopen(req, timeout=240) as r:
                          return json.load(r)['elements']
                  except urllib.error.HTTPError as e:
                      if e.code not in (429, 502, 503, 504):
                          raise
                      attente = 30 * (essai + 1)
                      print('zone %s : HTTP %d, nouvel essai dans %d s' % (zone, e.code, attente), flush=True)
                      time.sleep(attente)
                  except (urllib.error.URLError, TimeoutError):
                      time.sleep(30 * (essai + 1))
              raise SystemExit('zone %s : Overpass indisponible après 6 essais' % zone)

          def premier(tags, cles, valide):
              for c in cles:
                  for v in re.split(r'[;,]', tags.get(c, '')):
                      v = re.sub(r'^mailto:', '', v.strip(), flags=re.I)
                      if v and valide(v):
                          return v
              return ''

          vus = {}
          for zone in ZONES:
              els = requete(zone)
              print('zone %s : %d éléments' % (zone, len(els)), flush=True)
              for e in els:
                  t = e.get('tags', {})
                  lat = e.get('lat', (e.get('center') or {}).get('lat'))
                  lon = e.get('lon', (e.get('center') or {}).get('lon'))
                  if lat is None or lon is None:
                      continue
                  tel = ';'.join(v.strip() for c in ('phone', 'contact:phone') for v in t.get(c, '').split(';') if v.strip())
                  email = premier(t, ('email', 'contact:email'), lambda v: bool(EMAIL.match(v)))
                  site = premier(t, ('website', 'contact:website', 'url'), lambda v: '.' in v and ' ' not in v)
                  if not (tel or email or site):
                      continue
                  vus[(e['type'], e['id'])] = [round(lat, 6), round(lon, 6), t.get('addr:postcode', '').strip(), tel, email, site]
              time.sleep(15)  # pause polie entre deux zones

          lignes = list(vus.values())
          with open('osm.csv', 'w', newline='', encoding='utf-8') as f:
              w = csv.writer(f)
              w.writerow(['lat', 'lon', 'cp', 'telephone', 'email', 'site'])
              w.writerows(lignes)
          print('points OSM avec au moins un contact :', len(lignes))
          print('dont e-mail :', sum(1 for l in lignes if l[4]), 'dont site :', sum(1 for l in lignes if l[5]),
                'dont téléphone :', sum(1 for l in lignes if l[3]))
          # Garde-fou : un résultat tronqué ou vide ne doit jamais alimenter un apply.
          if not 3000 <= len(lignes) <= 40000:
              print('nombre de points hors fourchette 3000-40000 : apply refusé', file=sys.stderr)
              open('refus_apply', 'w').close()
          PY

      - name: Refuser apply si la source est hors fourchette
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ -f refus_apply ]; then
            echo "apply refusé : nombre de points OSM hors fourchette." >&2
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Trust host key
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Lancer la commande sur la prod
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          SSH="ssh $USER@$HOST"
          OPT=""
          [ "$MODE" = "apply" ] && OPT="--apply"
          $SSH "umask 077; cat > /tmp/contacts_osm.csv" < osm.csv
          $SSH "cd /opt/axion-crm-pro && docker compose cp /tmp/contacts_osm.csv api:/tmp/contacts_osm.csv && docker compose exec -u root -T api php artisan crm:pharmacies:contacts-osm --osm=/tmp/contacts_osm.csv $OPT"

      - name: Nettoyer le CSV (runner, hôte et conteneur api)
        if: ${{ always() }}
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          rm -f osm.csv refus_apply
          SSH="ssh $USER@$HOST"
          $SSH "rm -f /tmp/contacts_osm.csv; cd /opt/axion-crm-pro && docker compose exec -u root -T api rm -f /tmp/contacts_osm.csv" || true
