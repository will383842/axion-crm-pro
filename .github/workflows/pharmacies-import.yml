name: Pharmacies — import FINESS (dry-run ou apply)

# Télécharge la liste officielle FINESS, ne garde que les lignes pharmacie,
# puis lance `crm:pharmacies:import-finess` sur le serveur de prod.
#  - dry-run (défaut) : totaux par département, RIEN n'est écrit ;
#  - apply : crée UNIQUEMENT les fiches manquantes (jamais d'écrasement ni de
#    suppression), puis `crm:pharmacies:classer-taille` (champs vides seulement).
# `apply` est REFUSÉ sauf si l'entrée « confirmer » vaut OUI.
# Dépôt public : seuls des totaux sont affichés, aucune liste nominative.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (totaux seulement) ou apply (crée les fiches manquantes)'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmer:
        description: 'Écrire OUI pour autoriser apply'
        type: string
        default: ''

permissions:
  contents: read

# Jamais deux apply (ni deux imports) en même temps.
concurrency:
  group: pharmacies-import
  cancel-in-progress: false

jobs:
  import:
    name: Import FINESS (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Vérifier la confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRMER" != "OUI" ]; then
            echo "apply refusé : saisir OUI dans l'entrée « confirmer »." >&2
            exit 1
          fi

      - name: Télécharger FINESS et préparer le fichier
        run: |
          set -e
          curl -fsSL -o finess.zip https://irreductix.fr/telecharger/finess.zip
          unzip -q -o finess.zip etablissements.csv
          python3 - <<'PY'
          import csv, sys
          cats = {'620', '627', '628', '629', '641', '690'}
          cols = ['finess_et', 'siret', 'categorie', 'etat', 'nom_long', 'code_postal',
                  'commune_acheminement', 'departement', 'ej_statut_juridique_libelle', 'ej_code_ape']
          src = csv.DictReader(open('etablissements.csv', encoding='utf-8-sig'), delimiter=';')
          out = csv.writer(open('finess_pharma.csv', 'w', newline='', encoding='utf-8'))
          out.writerow(['finess_et', 'siret', 'categorie', 'etat', 'nom_long', 'code_postal', 'commune', 'dep', 'statut', 'ape'])
          n = 0
          for r in src:
              if r['categorie'] in cats:
                  out.writerow([' '.join(r[c].split()) for c in cols]); n += 1
          print('lignes pharmacie FINESS :', n)
          n620 = sum(1 for _ in csv.DictReader(open('finess_pharma.csv', encoding='utf-8'))
                     if _['categorie'] == '620')
          print('lignes catégorie 620 :', n620)
          # Garde-fou : un fichier tronqué ou vide ne doit jamais alimenter un apply.
          if not 15000 <= n620 <= 25000:
              print('catégorie 620 hors fourchette 15000-25000 : apply refusé', file=sys.stderr)
              open('refus_apply', 'w').close()
          PY

      - name: Refuser apply si la source est hors fourchette
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ -f refus_apply ]; then
            echo "apply refusé : nombre de lignes 620 hors fourchette (15000 à 25000)." >&2
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Lancer l'import sur la prod
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST"
          OPT=""
          [ "$MODE" = "apply" ] && OPT="--apply"
          $SSH "umask 077; cat > /tmp/finess_pharma.csv" < finess_pharma.csv
          $SSH "cd /opt/axion-crm-pro && docker compose cp /tmp/finess_pharma.csv api:/tmp/finess_pharma.csv && docker compose exec -u root -T api php artisan crm:pharmacies:import-finess /tmp/finess_pharma.csv $OPT"
          if [ "$MODE" = "apply" ]; then
            $SSH "cd /opt/axion-crm-pro && docker compose exec -u root -T api php artisan crm:pharmacies:classer-taille"
          fi

      - name: Nettoyer le CSV (hôte et conteneur api)
        if: ${{ always() }}
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST"
          $SSH "rm -f /tmp/finess_pharma.csv; cd /opt/axion-crm-pro && docker compose exec -u root -T api rm -f /tmp/finess_pharma.csv" || true
