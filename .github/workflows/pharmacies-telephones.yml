name: Pharmacies — téléphones FINESS (dry-run ou apply)

# Télécharge le miroir tiers du flux FINESS de data.gouv.fr (pas la liste officielle), puis lance
# `crm:pharmacies:telephones-finess` sur le serveur de prod.
#  - dry-run (défaut) : totaux seulement, RIEN n'est écrit ;
#  - apply : AJOUTE, sur champ vide ou NULL seulement (jamais d'écrasement), pour les officines 620
#    actives : téléphone (repli sur celui de la société exploitante, entites-juridiques.csv), adresse,
#    GPS et date d'ouverture ; hors opposition, numéros invalides et personnes physiques. Jamais le
#    fax ni le courriel.
# `apply` est REFUSÉ sauf si l'entrée « confirmer » vaut OUI et si l'empreinte SHA-256 correspond.
# Dépôt public : seuls des totaux sont affichés, aucune liste nominative ni aucun numéro.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run (totaux seulement) ou apply (ajoute téléphones, adresses, GPS, dates sur champs vides)'
        type: choice
        options: [dry-run, apply]
        default: dry-run
      confirmer:
        description: 'Écrire OUI pour autoriser apply'
        type: string
        default: ''
      empreinte:
        description: 'SHA-256 de finess.zip, OBLIGATOIRE pour apply (le dry-run l affiche dans le journal)'
        type: string
        default: ''

permissions:
  contents: read

# Jamais deux apply (ni deux exécutions) en même temps.
concurrency:
  group: pharmacies-telephones
  cancel-in-progress: false

jobs:
  telephones:
    name: Téléphones FINESS (${{ inputs.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Vérifier la confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRMER: ${{ inputs.confirmer }}
        run: |
          if [ "$MODE" = "apply" ] && [ "$CONFIRMER" != "OUI" ]; then
            echo "apply refusé : saisir OUI dans l'entrée « confirmer »." >&2
            exit 1
          fi

      - name: Télécharger FINESS et contrôler le fichier
        env:
          MODE: ${{ inputs.mode }}
          EMPREINTE_ATTENDUE: ${{ inputs.empreinte }}
        run: |
          set -e
          curl -fsSL -o finess.zip https://irreductix.fr/telecharger/finess.zip
          EMPREINTE_REELLE=$(sha256sum finess.zip | cut -d' ' -f1)
          echo "SHA-256 de finess.zip : $EMPREINTE_REELLE (à saisir dans l'entrée « empreinte » pour la figer)"
          if [ "$MODE" = "apply" ]; then
            if [ -z "$EMPREINTE_ATTENDUE" ]; then
              echo "apply refusé : saisir l'empreinte SHA-256 (affichée par le dry-run)." >&2
              exit 1
            fi
            if [ "$EMPREINTE_ATTENDUE" != "$EMPREINTE_REELLE" ]; then
              echo "apply refusé : empreinte SHA-256 différente de celle attendue." >&2
              exit 1
            fi
          fi
          unzip -q -o finess.zip etablissements.csv entites-juridiques.csv
          python3 - <<'PY'
          import csv, sys
          n620 = ntel = ncom = ncomnum = 0
          for r in csv.DictReader(open('etablissements.csv', encoding='utf-8-sig'), delimiter=';'):
              if r['categorie'] == '620' and r['etat'] == 'A':
                  n620 += 1
                  if (r.get('telephone') or '').strip():
                      ntel += 1
                  com = (r.get('commune') or '').strip()
                  if com:
                      ncom += 1
                      if com.isdigit():
                          ncomnum += 1
          print('lignes catégorie 620 état A (actives) :', n620)
          print('dont commune renseignée :', ncom, 'dont numérique (code) :', ncomnum)
          if ncom and ncomnum * 2 > ncom:
              print('colonne commune majoritairement numérique (codes) : apply refusé', file=sys.stderr)
              open('refus_apply', 'w').close()
          print('dont avec téléphone :', ntel)
          nej = ntelej = 0
          for r in csv.DictReader(open('entites-juridiques.csv', encoding='utf-8-sig'), delimiter=';'):
              nej += 1
              if (r.get('telephone') or '').strip():
                  ntelej += 1
          print('entités juridiques :', nej, 'dont avec téléphone :', ntelej)
          if not 50000 <= ntelej <= 100000:
              print('téléphones des entités juridiques hors fourchette 50000-100000 : apply refusé', file=sys.stderr)
              open('refus_apply', 'w').close()
          # Garde-fou : un fichier tronqué ou vide ne doit jamais alimenter un apply.
          if not 15000 <= n620 <= 25000:
              print('catégorie 620 état A hors fourchette 15000-25000 : apply refusé', file=sys.stderr)
              open('refus_apply', 'w').close()
          PY

      - name: Refuser apply si la source est hors fourchette
        if: ${{ inputs.mode == 'apply' }}
        run: |
          if [ -f refus_apply ]; then
            echo "apply refusé : nombre de lignes 620 actives hors fourchette (15000 à 25000 officines, 50000 à 100000 téléphones d'entités)." >&2
            exit 1
          fi

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Trust host key
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Lancer la commande sur la prod
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          MODE: ${{ inputs.mode }}
        run: |
          set -e
          SSH="ssh $USER@$HOST"
          OPT=""
          [ "$MODE" = "apply" ] && OPT="--apply"
          $SSH "umask 077; cat > /tmp/finess_etablissements.csv" < etablissements.csv
          $SSH "umask 077; cat > /tmp/finess_entites.csv" < entites-juridiques.csv
          $SSH "cd /opt/axion-crm-pro && docker compose cp /tmp/finess_etablissements.csv api:/tmp/finess_etablissements.csv && docker compose cp /tmp/finess_entites.csv api:/tmp/finess_entites.csv && docker compose exec -u root -T api php artisan crm:pharmacies:telephones-finess /tmp/finess_etablissements.csv /tmp/finess_entites.csv $OPT"

      - name: Nettoyer le CSV (hôte et conteneur api)
        if: ${{ always() }}
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          SSH="ssh $USER@$HOST"
          $SSH "rm -f /tmp/finess_etablissements.csv /tmp/finess_entites.csv; cd /opt/axion-crm-pro && docker compose exec -u root -T api rm -f /tmp/finess_etablissements.csv /tmp/finess_entites.csv" || true
