name: Prospection — Reclasser secteur, taille, nature, région (prod)

# Lance `php artisan crm:referentiels:reclasser` + `prospection:stats` sur le
# serveur prod via SSH (référentiel unique, 2026-09-28 — remplace
# `prospection:reclassify-size` et `prospection:reclassify-sector`).

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  reclassify:
    name: Reclasser sur prod
    runs-on: ubuntu-24.04
    # Par lots sur 4,3 M de fiches : 10 min ne suffisent plus.
    timeout-minutes: 90
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      # ssh-keyscan retire : sature MaxStartups quand d autres jobs SSH tournent
      # (StrictHostKeyChecking=no + UserKnownHostsFile=/dev/null suffisent)

      - name: Reclassify + stats via SSH
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER || 'root' }}
          PROJECT_PATH: ${{ secrets.HETZNER_PROJECT_PATH || '/opt/axion-crm-pro' }}
        run: |
          set -e
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "$USER@$HOST" bash <<EOF
            set -euo pipefail
            cd "$PROJECT_PATH"
            # « < /dev/null » OBLIGATOIRE : sinon docker compose exec -T lit le reste
            # du heredoc comme stdin et avale les commandes suivantes.
            docker compose exec -u root -T api php artisan prospection:purge-non-diffusible < /dev/null
            docker compose exec -u root -T api php artisan prospection:purge-non-commercial < /dev/null
            # Idempotent — une fiche déjà juste n'est pas réécrite. Le PREMIER
            # passage (4,3 M de fiches) se fait à la main, cf. la PR du chantier 1.
            docker compose exec -u root -T api php artisan crm:referentiels:reclasser < /dev/null
            docker compose exec -u root -T api php artisan coverage:refresh-matrix < /dev/null || echo "coverage refresh KO (non bloquant)"
            docker compose exec -u root -T api php artisan prospection:stats < /dev/null
          EOF
