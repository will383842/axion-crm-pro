name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # lundi 04:00 UTC

permissions:
  contents: read
  security-events: write
  issues: write # pour le job `alerte` en fin de fichier
  # 🔴 AJOUTE LE 2026-08-23, quand le depot est passe en PRIVE.
  # Sur un depot PUBLIC, le jeton du run lit les metadonnees d'une PR sans
  # qu'on l'ait demande. Sur un depot PRIVE, il n'a QUE les permissions
  # declarees ici — et `gitleaks-action` appelle
  # `GET /repos/{owner}/{repo}/pulls/{n}/commits` pour savoir quels commits
  # scanner. Sans cette ligne : 403 « Resource not accessible by integration »,
  # et le scan de secrets ne tourne PAS DU TOUT.
  #
  # C'est le genre de dependance qu'on ne voit qu'en changeant la visibilite :
  # rien dans le fichier ne disait que ce job dependait du caractere public du
  # depot.
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔴 F38-008 — plafonds anti-gel, poses le 2026-08-22. Aucun job de la
  # chaine qualite n'avait de borne : sans elle un job herite du plafond
  # GitHub de 6 h, et SIX executions etaient figees entre 1 h 28 et 2 h 25
  # au moment de la mesure. Ce ne sont pas des budgets : ce sont des
  # plafonds, poses tres au-dessus de la duree utile. Si un job legitime
  # est tue, relever la borne EN CITANT la duree du run tue — jamais la
  # retirer. Explication complete : .github/workflows/ci.yml, en-tete.
  # Garde : backend/tests/Feature/Infra/WorkflowsBornesDeDureeTest.php
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # F38-008 (scan de tout l'historique)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Requis depuis gitleaks-action v2 pour scanner une pull request :
          # sans lui le job échoue avant même de scanner (constaté le 2026-08-13).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ⚠️ 2026-08-22 — constat F38-013 (S2). Ce job portait `continue-on-error: true`
  # SANS UN MOT, dans le fichier même dont le bloc `trivy`, treize lignes plus
  # bas, explique pourquoi cette directive a été retirée de son voisin : « une
  # vulnérabilité CRITICAL ou HIGH n'a JAMAIS pu faire rougir une PR ». Le SAST
  # était donc le dernier des trois à rendre un vert inconditionnel — et le seul
  # à le faire sans justification écrite, dans un fichier qui en exige une de
  # tous les autres.
  #
  # CE QUE CE CORRECTIF FAIT — ET CE QU'IL NE FAIT PAS. Les deux comptent.
  #
  # ✅ La directive est retirée et le verdict de `semgrep ci` est enfin LU. Son
  #    code de sortie discrimine : 0 = rien de bloquant, 1 = découvertes,
  #    ≥ 2 = l'OUTIL a échoué (registre semgrep.dev injoignable, configuration
  #    illisible, SARIF non écrit). Ce dernier cas sort en ROUGE, comme le job
  #    `composer-audit` plus bas : ne pas savoir n'est pas un feu vert, et c'est
  #    précisément la confusion que `continue-on-error` installait.
  #
  # ✅ Le défaut n° 3 du bloc `trivy` — l'envoi du SARIF non conditionné à
  #    l'existence du fichier — était resté ouvert ICI. Sans le `hashFiles`
  #    ci-dessous, un semgrep qui échoue avant d'écrire le fichier fait rougir
  #    le job sur « Path does not exist », donc pour une raison qui n'a rien à
  #    voir avec la sécurité. Le rouge revient maintenant à l'étape qui a
  #    réellement échoué, avec le message qui dit quoi faire.
  #
  # ⛔ LE BLOCAGE SUR LES DÉCOUVERTES N'EST PAS ARMÉ, ET C'EST DÉLIBÉRÉ. Chaque
  #    garde de ce fichier a été armée APRÈS une mesure, jamais avant : trivy
  #    « alors que le dépôt comptait ZÉRO alerte ouverte », composer « alors que
  #    le lock est MESURÉ PROPRE », pnpm par un cliquet posé sur 29 avis comptés
  #    un par un. Le nombre de découvertes de `semgrep ci` sur `main` n'a JAMAIS
  #    été mesuré. Armer à l'aveugle rendrait l'un des deux pires résultats : un
  #    rouge permanent, qui se contourne puis s'ignore — l'état d'où l'on sort —
  #    ou un vert qu'on croirait mérité.
  #
  #    LE GESTE QUI ARME, dans cet ordre :
  #      1. jouer sur `main` la MÊME invocation que ci-dessous et compter les
  #         découvertes bloquantes ;
  #      2. si zéro : remplacer le `exit 0` final par un `exit 1` quand
  #         `code = 1`, et écrire ici la mesure ET sa date, comme l'ont fait ses
  #         voisins ;
  #      3. sinon : poser `.github/sast-cliquet.json` sur le modèle exact de
  #         `.github/audit-node-cliquet.json` et rougir sur l'AUGMENTATION.
  #
  # Garde : backend/tests/Feature/Infra/SastNEtouffePasSonVerdictTest.php
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 30  # F38-008
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: SAST — inventaire SARIF, et ROUGE si l outil echoue
        # `shell: sh` et non bash : l'image `returntocorp/semgrep` est bâtie sur
        # Alpine, où `bash` peut manquer. Tout ce qui suit est du POSIX strict.
        shell: sh {0}
        run: |
          set +e
          semgrep ci --config=p/owasp-top-ten --config=p/security-audit --config=p/laravel --config=p/typescript --sarif --output semgrep.sarif
          code=$?
          set -e
          if [ "$code" -ge 2 ]; then
            echo "ECHEC DE MESURE : semgrep ci a rendu $code — c est l OUTIL qui a echoue, pas une decouverte."
            echo "Ne pas savoir n est pas un feu vert : ce job sort en 2."
            echo "Geste : relire le journal ci-dessus. Registre semgrep.dev injoignable => rejouer le job ;"
            echo "        configuration refusee => corriger les --config de cette etape."
            exit 2
          fi
          if [ "$code" -eq 1 ]; then
            echo "Semgrep rapporte des decouvertes bloquantes. NON BLOQUANT tant que le cliquet SAST n est pas pose."
            echo "Geste : cf. le commentaire de ce job — mesurer le compte sur main, PUIS armer"
            echo "        (exit 1 sec si zero, sinon .github/sast-cliquet.json sur le modele du cliquet Node)."
          fi
          exit 0
      # 🔴 DEPOT PRIVE — 2026-08-23. `upload-sarif` ecrit dans le CODE SCANNING
      # de GitHub, gratuit sur un depot public, reserve a GitHub Advanced
      # Security (payant) sur un depot prive. Depuis le passage en prive, cette
      # etape rend « Resource not accessible by integration » et faisait rougir
      # SEPT jobs d'analyse.
      #
      # ⚠️ POURQUOI TOLERER CETTE ETAPE-LA N'EST PAS UN DESARMEMENT, et il faut
      # le demontrer plutot que l'affirmer — F38-013 de cet audit porte
      # precisement sur un `continue-on-error` pose sans un mot :
      #
      #   - cette etape est un CANAL DE RAPPORT, pas un controle. Elle ne juge
      #     rien : elle depose un fichier deja produit ;
      #   - les VRAIES gardes sont des etapes distinctes, et elles tournent
      #     toujours : « Garde — vulnerabilites CORRIGEABLES (bloquant) »
      #     (`exit-code: '1'`), la garde `composer.lock`, le cliquet Node ;
      #   - et les decouvertes restent LISIBLES : chaque job porte deja une
      #     sortie `format: table` imprimee dans le journal. Rien ne devient
      #     invisible — c'etait la seule question qui comptait.
      #
      # Le jour ou GHAS est souscrit, ou le depot repasse public, retirer cette
      # ligne : l'etape refonctionnera sans autre changement.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        # `always()` seul faisait rougir le job quand le fichier manquait — le
        # defaut n° 3 du bloc `trivy`, ici encore ouvert avant F38-013.
        if: always() && hashFiles('semgrep.sarif') != ''
        with: { sarif_file: semgrep.sarif }

  # ⚠️ 2026-08-16 — ce job avait TROIS défauts, tous du même genre : il avait
  # l'apparence d'une garde sans en être une.
  #
  #  1. `continue-on-error: true` annulait `exit-code: '1'` : une vulnérabilité
  #     CRITICAL ou HIGH n'a JAMAIS pu faire rougir une PR. Le résultat partait
  #     dans l'onglet Security, que personne ne consulte.
  #  2. trois images étaient construites, UNE SEULE était analysée. Les images
  #     `app` et `worker` coûtaient leur temps de build puis étaient jetées —
  #     le nom du job promettait pourtant « container scan » au pluriel.
  #  3. l'envoi du SARIF n'était pas conditionné à l'existence du fichier :
  #     quand Trivy échouait avant de l'écrire, le job rougissait sur
  #     « Path does not exist », donc pour une raison qui n'a rien à voir
  #     avec la sécurité — un rouge qui n'apprend rien finit ignoré.
  #
  # Armé alors que le dépôt comptait ZÉRO alerte ouverte (12 corrigées) :
  # allumer la garde ne bloque donc rien au moment où on l'allume.
  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # F38-008 (construction des images avant scan)
    strategy:
      fail-fast: false # une image vulnérable ne doit pas masquer l'état des deux autres
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.laravel
          - image: app
            dockerfile: Dockerfile.frontend
          - image: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build -t axion-crm/${{ matrix.image }}:scan -f ${{ matrix.dockerfile }} --target prod .
      # 1) SARIF pour l'onglet Security : l'INVENTAIRE COMPLET, y compris ce qui
      #    n'a pas encore de correctif. Non bloquant — c'est la mémoire, pas la
      #    garde. Épinglé sur une version : `@master` fait dépendre la sécurité
      #    du dépôt de ce qu'un tiers pousse aujourd'hui.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: axion-crm/${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      # 🔴 DEPOT PRIVE — 2026-08-23. `upload-sarif` ecrit dans le CODE SCANNING
      # de GitHub, gratuit sur un depot public, reserve a GitHub Advanced
      # Security (payant) sur un depot prive. Depuis le passage en prive, cette
      # etape rend « Resource not accessible by integration » et faisait rougir
      # SEPT jobs d'analyse.
      #
      # ⚠️ POURQUOI TOLERER CETTE ETAPE-LA N'EST PAS UN DESARMEMENT, et il faut
      # le demontrer plutot que l'affirmer — F38-013 de cet audit porte
      # precisement sur un `continue-on-error` pose sans un mot :
      #
      #   - cette etape est un CANAL DE RAPPORT, pas un controle. Elle ne juge
      #     rien : elle depose un fichier deja produit ;
      #   - les VRAIES gardes sont des etapes distinctes, et elles tournent
      #     toujours : « Garde — vulnerabilites CORRIGEABLES (bloquant) »
      #     (`exit-code: '1'`), la garde `composer.lock`, le cliquet Node ;
      #   - et les decouvertes restent LISIBLES : chaque job porte deja une
      #     sortie `format: table` imprimee dans le journal. Rien ne devient
      #     invisible — c'etait la seule question qui comptait.
      #
      # Le jour ou GHAS est souscrit, ou le depot repasse public, retirer cette
      # ligne : l'etape refonctionnera sans autre changement.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        # `always()` seul faisait rougir le job quand le fichier manquait.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # 2) LA GARDE. Deux choix qui la rendent utilisable plutôt que décorative :
      #
      #  - `format: table` : une garde qui sort en 1 sans dire CE QU'ELLE A TROUVÉ
      #    n'est pas exploitable. Le SARIF part dans un onglet ; le tableau, lui,
      #    est dans le journal du job, sous les yeux de qui lit le rouge.
      #
      #  - `ignore-unfixed: true` : ne bloque QUE sur ce qui a un correctif
      #    disponible. Les images de base (Ubuntu 24.04 côté worker) traînent en
      #    permanence des CVE sans correctif amont ; bloquer dessus rendrait la
      #    garde rouge en permanence, et une garde toujours rouge se contourne
      #    puis s'ignore — exactement l'état d'où l'on sort. Les vulnérabilités
      #    non corrigeables restent visibles dans l'onglet Security via le SARIF
      #    ci-dessus : on les CONNAÎT, on ne bloque simplement pas sur ce que
      #    personne ne peut corriger ici.
      - name: Garde — vulnérabilités CORRIGEABLES (bloquant)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: axion-crm/${{ matrix.image }}:scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml # exceptions DATÉES, cf. le fichier
          exit-code: '1' # BLOQUANT — plus de `continue-on-error`

  # ⚠️ 2026-08-16 — angle mort découvert en instruisant le job ci-dessus.
  # Le scan ne portait QUE sur les images que l'on construit. Or la production
  # fait tourner des images TIRÉES telles quelles, dont `caddy:2-alpine` : c'est
  # le proxy de bordure `axion-crm-caddy`, publié sur 0.0.0.0:80 et :443, et
  # c'est lui qui TERMINE LE TLS. Il porte exactement les 13 vulnérabilités HIGH
  # du binaire Caddy relevées dans l'image `app` — sauf que là, elles sont sur
  # le chemin exposé. Rien ne les regardait.
  #
  # Ce job est délibérément NON BLOQUANT, et la raison n'est pas la même que le
  # `continue-on-error` qu'on vient de retirer : ces images, on ne les construit
  # pas. La seule action possible est de monter la version quand l'amont
  # republie — bloquer les PR en attendant ne ferait qu'un rouge permanent. Ce
  # que ce job apporte, c'est de SAVOIR : l'inventaire remonte dans l'onglet
  # Security, et le jour où l'amont corrige, on le voit.
  trivy-images-tirees:
    name: Scan images tirées (inventaire)
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # F38-008 (une image tiree puis scannee par entree d'inventaire)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nom: caddy-bordure, ref: 'caddy:2-alpine' }
          - { nom: redis, ref: 'redis:7.2-alpine' }
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.ref }}
          format: sarif
          output: trivy-${{ matrix.nom }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'
      # 🔴 DEPOT PRIVE — 2026-08-23. `upload-sarif` ecrit dans le CODE SCANNING
      # de GitHub, gratuit sur un depot public, reserve a GitHub Advanced
      # Security (payant) sur un depot prive. Depuis le passage en prive, cette
      # etape rend « Resource not accessible by integration » et faisait rougir
      # SEPT jobs d'analyse.
      #
      # ⚠️ POURQUOI TOLERER CETTE ETAPE-LA N'EST PAS UN DESARMEMENT, et il faut
      # le demontrer plutot que l'affirmer — F38-013 de cet audit porte
      # precisement sur un `continue-on-error` pose sans un mot :
      #
      #   - cette etape est un CANAL DE RAPPORT, pas un controle. Elle ne juge
      #     rien : elle depose un fichier deja produit ;
      #   - les VRAIES gardes sont des etapes distinctes, et elles tournent
      #     toujours : « Garde — vulnerabilites CORRIGEABLES (bloquant) »
      #     (`exit-code: '1'`), la garde `composer.lock`, le cliquet Node ;
      #   - et les decouvertes restent LISIBLES : chaque job porte deja une
      #     sortie `format: table` imprimee dans le journal. Rien ne devient
      #     invisible — c'etait la seule question qui comptait.
      #
      # Le jour ou GHAS est souscrit, ou le depot repasse public, retirer cette
      # ligne : l'etape refonctionnera sans autre changement.
      - uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.nom)) != ''
        with:
          sarif_file: trivy-${{ matrix.nom }}.sarif
          category: trivy-${{ matrix.nom }}
      # Le tableau dans le journal, pour que l'inventaire soit lisible sans
      # ouvrir un onglet — c'est ce qui fait la différence entre « consultable »
      # et « consulté ».
      - name: Inventaire lisible
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

  # ⚠️ 2026-08-21 — constat H47-001 (S1). Ce job portait le vice de forme du
  # `trivy` d'en haut, mais en pire : il ne rendait pas seulement un vert
  # complaisant, il n'AUDITAIT RIEN. Zéro paquet. Jamais.
  #
  # LA MÉCANIQUE, MESURÉE — ce n'est pas une lecture, c'est une exécution.
  #
  # `composer audit` audite par défaut le dépôt **INSTALLÉ**
  # (`vendor/composer/installed.json`), et **PAS** `composer.lock`. Or ce job
  # ne fait jamais `composer install` : après `actions/checkout` + `setup-php`,
  # il n'y a pas de `vendor/`. Mesure du 2026-08-21, dans un répertoire ne
  # contenant que le vrai `backend/composer.json` et `backend/composer.lock` :
  #
  #     $ composer audit --no-dev
  #     No packages - skipping audit.
  #     $ echo $?
  #     0
  #
  # La preuve décisive que rien n'était regardé : **réseau coupé**
  # (`COMPOSER_DISABLE_NETWORK=1`), cette commande rend le même texte et le
  # même `0` — elle n'interroge même pas la base d'avis. La même commande avec
  # `--locked`, réseau coupé, échoue au contraire sur
  # « request canceled: https://packagist.org/api/security-advisories/ ».
  # `--locked` est donc exactement CE QUI FAIT REGARDER LES PAQUETS.
  #
  # Le `|| true` était la seconde serrure : le jour où quelqu'un aurait ajouté
  # `composer install`, l'échec serait resté invisible malgré tout. Deux
  # défauts indépendants, chacun suffisant à lui seul.
  #
  # TÉMOIN NÉGATIF, même jour : le vrai lock avec la seule version de
  # `guzzlehttp/guzzle` ramenée de 7.15.3 à 7.13.1 rend 6 avis, dont
  # CVE-2026-69246, et sort en 1. La forme corrigée discrimine.
  #
  # Armé alors que `backend/composer.lock` est MESURÉ PROPRE (0 avis, dev
  # inclus) : allumer la garde ne bloque donc rien au moment où on l'allume.
  #
  # POURQUOI JUGER SUR LE CONTENU (`--format=json`) ET NON SUR LE CODE DE
  # SORTIE. Celui de `composer audit` est un **masque de bits** : 1 =
  # vulnérabilités, 2 = paquets abandonnés, 3 = les deux. Ce dépôt embarque
  # `doctrine/annotations`, abandonné. Se fier au code de sortie ferait donc
  # rougir la garde en permanence pour une question d'hygiène — et une garde
  # toujours rouge se contourne puis s'ignore, exactement l'état d'où l'on
  # sort. Lire `advisories` dans le JSON rend aussi la garde indifférente au
  # basculement annoncé du défaut `--abandoned` en Composer 3.
  #
  # Et si la mesure elle-même échoue (packagist injoignable, JSON tronqué), on
  # sort en 2 : **rouge**. Ne pas savoir n'est pas la même chose que savoir que
  # tout va bien, et c'est précisément la confusion que `|| true` installait.
  composer-audit:
    name: PHP deps audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # F38-008
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }

      # 1) L'INVENTAIRE, dev inclus, non bloquant : la mémoire, lisible dans le
      #    journal du job. Même partage des rôles que le job `trivy`.
      - name: Inventaire lisible (dev inclus, non bloquant)
        working-directory: backend
        run: composer audit --locked --format=table || true

      # 2) LA GARDE : surface de PRODUCTION (`--no-dev`), bloquante.
      - name: Garde — avis de securite sur composer.lock (BLOQUANT)
        working-directory: backend
        run: |
          set -euo pipefail
          composer audit --locked --no-dev --format=json > audit-composer.json || true
          php -r '
            $brut = @file_get_contents("audit-composer.json");
            $j = is_string($brut) ? json_decode($brut, true) : null;
            if (!is_array($j) || !array_key_exists("advisories", $j)) {
              fwrite(STDERR, "ECHEC DE MESURE : composer audit n a pas rendu de JSON exploitable.\n");
              fwrite(STDERR, "Ne pas savoir n est pas un feu vert — ce job sort en 2.\n");
              exit(2);
            }
            $n = 0;
            foreach ((array) $j["advisories"] as $paquet => $avis) {
              $n += count($avis);
              fwrite(STDERR, sprintf("  %-40s %d avis\n", $paquet, count($avis)));
            }
            printf("Avis de securite sur les dependances de PRODUCTION : %d\n", $n);
            exit($n > 0 ? 1 : 0);
          '

  # ⚠️ 2026-08-21 — le SITE JUMEAU du constat H47-001 (motif A-011). Le `|| true`
  # était ici aussi, et il coûtait plus cher : contrairement à `composer audit`,
  # `pnpm audit` LIT BIEN le lockfile sans installation. Ce job MESURAIT donc
  # correctement, et jetait le résultat.
  #
  # Ce qu'il jetait, mesuré le 2026-08-21 sur les vrais lockfiles :
  #
  #     frontend : 18 high + 1 critical   (`pnpm audit` sort en 1)
  #     workers  : 10 high + 1 critical   (`pnpm audit` sort en 1)
  #
  # POURQUOI UN CLIQUET ET NON UN BLOCAGE SEC. Retirer `|| true` sans autre
  # forme de procès rendrait ces deux jobs rouges dès la première PR, pour 29
  # avis préexistants que personne ne corrige en une séance. Le dépôt connaît
  # la suite : une garde toujours rouge se contourne, puis s'ignore, et l'on
  # revient au vert menteur par un autre chemin.
  #
  # Le cliquet fige donc le chiffre d'AUJOURD'HUI dans
  # `.github/audit-node-cliquet.json` et rougit sur l'AUGMENTATION : on ne
  # prétend pas que la dette est réglée, on interdit qu'elle grossisse sans
  # que personne ne le voie. Quand le compte baisse, le job le DIT et demande
  # qu'on resserre le cliquet — sans quoi il se déserre tout seul.
  #
  # `fail-fast: false` : l'état du frontend ne doit pas masquer celui des
  # workers, même raison que pour la matrice `trivy`.
  pnpm-audit:
    name: Node deps audit
    runs-on: ubuntu-24.04
    timeout-minutes: 20  # F38-008
    strategy:
      fail-fast: false
      matrix:
        # 🔴 `poc/05_dedup_performance` ajouté le 2026-08-22 — constat H47-004.
        # Ce répertoire porte un `pnpm-lock.yaml` vivant que RIEN ne regardait :
        # ni cette matrice, ni aucun bloc `directory:` de `.github/dependabot.yml`
        # (qui n'en déclare que cinq : /backend, /frontend, /workers, / ×2). La
        # mesure du 2026-08-19 y trouve l'alerte Dependabot #33 (`esbuild`,
        # GHSA-g7r4-m6w7-qqqr) : une alerte pour laquelle aucune PR ne serait
        # jamais proposée et sur laquelle aucune garde ne tournerait.
        #
        # ⚠️ La gravité de CETTE alerte est faible (dépendance de développement,
        # 1 low), mais le mécanisme est général : tout lockfile ajouté hors des
        # trois répertoires déclarés héritait du même angle mort, en silence.
        # C'est le trou qu'on ferme, pas l'avis.
        #
        # Armé sans risque de rouge immédiat : mesure du 2026-08-19,
        # `cd poc/05_dedup_performance && pnpm audit` → 1 low, 0 high,
        # 0 critical, et le relevé de `.github/audit-node-cliquet.json` est posé
        # sur ces comptes exacts.
        path: [frontend, workers, poc/05_dedup_performance]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }

      # 1) L'INVENTAIRE lisible, non bloquant.
      - name: Inventaire lisible (non bloquant)
        working-directory: ${{ matrix.path }}
        run: pnpm audit || true

      # 2) LE CLIQUET : rouge si high/critical AUGMENTE par rapport au relevé.
      - name: Garde — le compte high/critical ne doit pas AUGMENTER (BLOQUANT)
        working-directory: ${{ matrix.path }}
        env:
          LOT: ${{ matrix.path }}
        run: |
          set -euo pipefail
          pnpm audit --json > audit-node.json || true
          node -e '
            const fs = require("fs");
            const lot = process.env.LOT;
            const cheminCliquet = process.env.GITHUB_WORKSPACE + "/.github/audit-node-cliquet.json";
            let mesure;
            try {
              mesure = JSON.parse(fs.readFileSync("audit-node.json", "utf8"));
            } catch (e) {
              console.error("ECHEC DE MESURE : pnpm audit n a pas rendu de JSON exploitable (" + e.message + ").");
              console.error("Ne pas savoir n est pas un feu vert — ce job sort en 2.");
              process.exit(2);
            }
            const v = (mesure.metadata || {}).vulnerabilities;
            if (!v) {
              console.error("ECHEC DE MESURE : JSON sans metadata.vulnerabilities.");
              process.exit(2);
            }
            const cliquet = JSON.parse(fs.readFileSync(cheminCliquet, "utf8"));
            const ref = cliquet.lots && cliquet.lots[lot];
            if (!ref) {
              console.error("Aucun releve pour le lot « " + lot + " » dans .github/audit-node-cliquet.json.");
              console.error("Tout lot de la matrice doit y figurer, sinon la garde ne le regarde pas.");
              process.exit(2);
            }
            const vu = { high: v.high || 0, critical: v.critical || 0 };
            console.log(lot + " : high=" + vu.high + " (releve " + ref.high + "), critical=" + vu.critical + " (releve " + ref.critical + ")");
            let rouge = false;
            for (const s of ["high", "critical"]) {
              if (vu[s] > ref[s]) {
                console.error("AUGMENTATION " + s + " : " + ref[s] + " -> " + vu[s] + ". Corriger, ou justifier et resserrer le releve.");
                rouge = true;
              } else if (vu[s] < ref[s]) {
                console.log("Baisse " + s + " : " + ref[s] + " -> " + vu[s] + ". RESSERRER .github/audit-node-cliquet.json a " + vu[s] + ", sinon le cliquet se desserre.");
              }
            }
            process.exit(rouge ? 1 : 0);
          '

  # ⚠️ 2026-08-16 — ce job visait `https://staging.axion-crm-pro.com`, qui
  # N'EXISTE PAS (NXDOMAIN). Il échouait donc TOUTES les semaines depuis au
  # moins le 2026-07-13 — cinq échecs consécutifs qu'aucun humain n'a vus,
  # parce qu'un job planifié qui rougit n'alerte personne. Il n'y a pas
  # d'environnement de préproduction : ce dépôt déploie directement en prod.
  #
  # Deux issues, et le choix appartient à Will :
  #   a) poser la variable de dépôt `ZAP_TARGET_URL` (Settings → Secrets and
  #      variables → Actions → Variables) sur l'URL à analyser. Le job se
  #      rallume tout seul. ⚠️ la pointer sur la PRODUCTION signifie envoyer
  #      un spider + une analyse passive sur un service vivant chaque lundi
  #      04:00 UTC ; c'est légitime sur son propre service, mais ça se décide,
  #      et Cloudflare peut y répondre par un challenge ;
  #   b) supprimer ce job si l'analyse dynamique n'est pas voulue.
  #
  # Tant que la variable est vide, le job ne s'exécute pas — plutôt qu'un rouge
  # hebdomadaire qui n'apprend rien et anesthésie la lecture des échecs.
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 45  # F38-008 (scan actif d'une cible distante)
    if: github.event_name == 'schedule' && vars.ZAP_TARGET_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.ZAP_TARGET_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'

  # ===========================================================================
  # ALERTE — le chaînon qui manquait
  # ===========================================================================
  # ⚠️ 2026-08-16. Le défaut de fond de ce workflow n'était pas « rien ne
  # bloque », c'était « PERSONNE N'EST PRÉVENU ». Preuve mesurée le même jour :
  # le job ZAP a échoué CINQ semaines de suite (13/07 → 10/08) sans qu'aucun
  # humain ne le sache. Un rouge que personne ne regarde ne vaut pas mieux
  # qu'un vert menteur.
  #
  # Pourquoi une ISSUE plutôt qu'un blocage du déploiement : une CVE publiée en
  # amont à 3 h du matin n'a rien à voir avec le code qu'on veut livrer. Bloquer
  # la production dessus, c'est empêcher un correctif urgent au nom d'un
  # problème que ce correctif ne cause pas. L'issue réveille un humain sans
  # rien casser.
  #
  # Pourquoi une issue plutôt que Telegram : ce dépôt n'a aucun jeton Telegram,
  # et y recopier celui du site élargirait son exposition pour un gain nul.
  # `GITHUB_TOKEN` suffit — aucun secret nouveau à créer ni à faire tourner.
  #
  # ⚠️ PAS sur les `pull_request` : là, le rouge est déjà sous les yeux de son
  # auteur. On n'alerte que sur ce que personne ne regarde : le cron et `main`.
  alerte:
    name: Alerte si une analyse de sécurité échoue
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # F38-008 (ouverture d'une issue)
    needs: [gitleaks, semgrep, trivy, trivy-images-tirees, composer-audit, pnpm-audit]
    if: failure() && github.event_name != 'pull_request'
    steps:
      - name: Ouvrir ou compléter l'issue de suivi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPOT: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DECLENCHEUR: ${{ github.event_name }}
        run: |
          set -euo pipefail
          TITRE='🔴 Analyse de sécurité en échec'
          # Corps écrit dans un FICHIER, ligne par ligne : une chaîne bash
          # multiligne conserve ses espaces de tête, et quatre espaces en début
          # de ligne valent un bloc de code en markdown — l'issue serait
          # illisible. `printf '%s\n'` évite aussi tout piège d'échappement.
          printf '%s\n' \
            'Le workflow **Security** a échoué.' \
            '' \
            'Ouvrir le job rouge : la garde Trivy affiche un **tableau lisible**' \
            'dans son journal — paquet, CVE, version installée, version corrigée.' \
            '' \
            'Rappels utiles :' \
            '' \
            "- \`security.yml\` n'est **pas** dans la chaîne de déploiement : la" \
            "  production n'est donc pas bloquée, et c'est délibéré." \
            '- Les exceptions connues et **datées** vivent dans `.trivyignore.yaml`.' \
            "- Refermer cette issue une fois traitée : elle est réutilisée tant" \
            "  qu'elle reste ouverte, donc une issue ouverte = un problème vivant." \
            '' \
            '---' \
            '' > corps-alerte.md
          printf 'Déclencheur : `%s`\n\n%s\n' "$DECLENCHEUR" "$RUN_URL" >> corps-alerte.md
          # Une SEULE issue vivante : sans cette recherche, un cron hebdomadaire
          # durablement en échec en ouvrirait une par semaine — et ce bruit
          # reproduirait exactement le problème qu'on corrige ici.
          EXISTANTE="$(gh issue list --repo "$DEPOT" --state open --label securite --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTANTE" ]; then
            echo "Issue #$EXISTANTE déjà ouverte — ajout de cette occurrence."
            gh issue comment "$EXISTANTE" --repo "$DEPOT" --body-file corps-alerte.md
          else
            gh issue create --repo "$DEPOT" --title "$TITRE" --label securite --body-file corps-alerte.md
          fi
