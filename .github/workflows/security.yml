name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # lundi 04:00 UTC

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secrets scan (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Requis depuis gitleaks-action v2 pour scanner une pull request :
          # sans lui le job échoue avant même de scanner (constaté le 2026-08-13).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=p/owasp-top-ten --config=p/security-audit --config=p/laravel --config=p/typescript --sarif --output semgrep.sarif
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: semgrep.sarif }

  # ⚠️ 2026-08-16 — ce job avait TROIS défauts, tous du même genre : il avait
  # l'apparence d'une garde sans en être une.
  #
  #  1. `continue-on-error: true` annulait `exit-code: '1'` : une vulnérabilité
  #     CRITICAL ou HIGH n'a JAMAIS pu faire rougir une PR. Le résultat partait
  #     dans l'onglet Security, que personne ne consulte.
  #  2. trois images étaient construites, UNE SEULE était analysée. Les images
  #     `app` et `worker` coûtaient leur temps de build puis étaient jetées —
  #     le nom du job promettait pourtant « container scan » au pluriel.
  #  3. l'envoi du SARIF n'était pas conditionné à l'existence du fichier :
  #     quand Trivy échouait avant de l'écrire, le job rougissait sur
  #     « Path does not exist », donc pour une raison qui n'a rien à voir
  #     avec la sécurité — un rouge qui n'apprend rien finit ignoré.
  #
  # Armé alors que le dépôt comptait ZÉRO alerte ouverte (12 corrigées) :
  # allumer la garde ne bloque donc rien au moment où on l'allume.
  trivy:
    name: Container scan (Trivy)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false # une image vulnérable ne doit pas masquer l'état des deux autres
      matrix:
        include:
          - image: api
            dockerfile: Dockerfile.laravel
          - image: app
            dockerfile: Dockerfile.frontend
          - image: worker
            dockerfile: Dockerfile.worker
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }}
        run: docker build -t axion-crm/${{ matrix.image }}:scan -f ${{ matrix.dockerfile }} --target prod .
      # Épinglé sur une version : `@master` fait dépendre la sécurité du dépôt
      # de ce qu'un tiers pousse aujourd'hui.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: axion-crm/${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: '1' # BLOQUANT — plus de `continue-on-error`
      - uses: github/codeql-action/upload-sarif@v3
        # `always()` seul faisait rougir le job quand le fichier manquait.
        if: always() && hashFiles(format('trivy-{0}.sarif', matrix.image)) != ''
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  composer-audit:
    name: PHP deps audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3' }
      - working-directory: backend
        run: composer audit --no-dev || true

  pnpm-audit:
    name: Node deps audit
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        path: [frontend, workers]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      - working-directory: ${{ matrix.path }}
        run: pnpm audit --audit-level=high || true

  # ⚠️ 2026-08-16 — ce job visait `https://staging.axion-crm-pro.com`, qui
  # N'EXISTE PAS (NXDOMAIN). Il échouait donc TOUTES les semaines depuis au
  # moins le 2026-07-13 — cinq échecs consécutifs qu'aucun humain n'a vus,
  # parce qu'un job planifié qui rougit n'alerte personne. Il n'y a pas
  # d'environnement de préproduction : ce dépôt déploie directement en prod.
  #
  # Deux issues, et le choix appartient à Will :
  #   a) poser la variable de dépôt `ZAP_TARGET_URL` (Settings → Secrets and
  #      variables → Actions → Variables) sur l'URL à analyser. Le job se
  #      rallume tout seul. ⚠️ la pointer sur la PRODUCTION signifie envoyer
  #      un spider + une analyse passive sur un service vivant chaque lundi
  #      04:00 UTC ; c'est légitime sur son propre service, mais ça se décide,
  #      et Cloudflare peut y répondre par un challenge ;
  #   b) supprimer ce job si l'analyse dynamique n'est pas voulue.
  #
  # Tant que la variable est vide, le job ne s'exécute pas — plutôt qu'un rouge
  # hebdomadaire qui n'apprend rien et anesthésie la lecture des échecs.
  zap-baseline:
    name: OWASP ZAP baseline
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' && vars.ZAP_TARGET_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ vars.ZAP_TARGET_URL }}
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a'
