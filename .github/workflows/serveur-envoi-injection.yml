name: Serveur envoi K4 injection

on:
  pull_request:
    paths: ['infra/serveur-envoi/injection/**', '.github/workflows/serveur-envoi-injection.yml']
  push:
    branches: [main]
    paths: ['infra/serveur-envoi/injection/**', '.github/workflows/serveur-envoi-injection.yml']

permissions:
  contents: read

jobs:
  tests:
    name: Tests de l'écouteur d'injection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.10'   # minimum : getaddresses(strict) apparaît en 3.11.10
      - name: Tests
        working-directory: infra/serveur-envoi/injection
        run: python3 -m unittest discover -s tests -t . -v
