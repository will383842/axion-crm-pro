name: Serveur envoi K7 log hook

# Workflow DÉDIÉ, filtré par chemin. L'ingestion côté passerelle (PHP) est testée par passerelle-envoi.yml.
on:
  pull_request:
    paths: ['infra/serveur-envoi/loghook/**', 'infra/serveur-envoi/kumomta/**', '.github/workflows/serveur-envoi-loghook.yml']
  push:
    branches: [main]
    paths: ['infra/serveur-envoi/loghook/**', 'infra/serveur-envoi/kumomta/**', '.github/workflows/serveur-envoi-loghook.yml']

permissions:
  contents: read

concurrency:
  group: serveur-envoi-loghook-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Log hook (règles TOML, classifieur, relais, puits simulés)
    runs-on: ubuntu-24.04
    timeout-minutes: 10  # anti-gel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.10'  # tomllib (3.11+)
      - name: Règles de rebonds TOML (invalide = CI rouge)
        working-directory: infra/serveur-envoi/loghook
        run: python3 -m axion_loghook.valider_toml rebonds
      - name: Tests (aucun envoi réel, puits simulés)
        working-directory: infra/serveur-envoi/loghook
        run: python3 -m unittest discover -s tests -t . -v
