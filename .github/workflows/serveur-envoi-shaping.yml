name: Serveur envoi K8 shaping

# Valide le MODÈLE de shaping par fournisseur : un modèle invalide fait rougir la CI.
on:
  pull_request:
    paths: ['infra/serveur-envoi/kumomta/shaping/**', '.github/workflows/serveur-envoi-shaping.yml']
  push:
    branches: [main]
    paths: ['infra/serveur-envoi/kumomta/shaping/**', '.github/workflows/serveur-envoi-shaping.yml']

permissions:
  contents: read

jobs:
  shaping:
    name: Validation du modèle de shaping
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.10'   # tomllib : Python 3.11 minimum
      - name: Valider le modèle livré
        working-directory: infra/serveur-envoi/kumomta/shaping
        run: python3 -I valider_shaping.py shaping.modele.toml
      - name: Tests du validateur (modèles invalides refusés)
        working-directory: infra/serveur-envoi/kumomta/shaping
        run: python3 -I tests/test_validation.py -v
