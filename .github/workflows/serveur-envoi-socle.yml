name: Serveur envoi K6 socle

on:
  # Filtre « paths » sur pull_request, identique à celui du push. « Tests du socle d'envoi » n'est PAS un contrôle exigé
  # par la protection de main (lue par l'API : 4 contrôles, dont ce nom est absent). S'il le devenait, il faudrait
  # retirer ce filtre (ou passer à un `if:` de job), sinon toute PR hors de ces dossiers resterait « en attente ».
  pull_request:
    paths: ['infra/serveur-envoi/socle/**', 'envoi-serveur/contrat/**', '.github/workflows/serveur-envoi-socle.yml']
  push:
    branches: [main]
    paths: ['infra/serveur-envoi/socle/**', 'envoi-serveur/contrat/**', '.github/workflows/serveur-envoi-socle.yml']

permissions:
  contents: read

concurrency:
  group: serveur-envoi-socle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests du socle d'envoi
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11.10'   # minimum
      - name: Tests
        working-directory: infra/serveur-envoi/socle
        run: python3 -m unittest discover -s tests -t . -v
