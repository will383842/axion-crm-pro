name: tmp-composer-update
on:
  push:
    branches: [fix/deps-symfony-avis-2026-11-04]
    paths: ['.github/workflows/tmp-composer-update.yml']
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_pgsql, redis, intl, mbstring, bcmath, zip
      - name: composer update limité
        working-directory: backend
        run: |
          composer update symfony/http-client symfony/http-foundation symfony/http-kernel symfony/routing symfony/yaml --with-dependencies --no-scripts --no-interaction
          composer validate --no-check-publish
          composer audit --locked --no-dev
      - name: Pousser le lock seul
        run: |
          git config user.name "claude"
          git config user.email "noreply@anthropic.com"
          git add backend/composer.lock
          git commit -m "fix(deps): mise à jour Symfony (avis de sécurité) dans composer.lock" -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push
