# =============================================================================
# Exceptions Trivy — DATÉES, donc temporaires par construction
# =============================================================================
# Chaque entrée porte un `expired_at`. Passée cette date, l'exception cesse de
# s'appliquer et la garde redevient rouge : c'est ce qui force le réexamen.
# Une exception sans date ne s'enlève jamais — elle devient un trou permanent
# qu'on oublie avoir creusé.
#
