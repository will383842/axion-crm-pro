# =============================================================================
# Exceptions Trivy — DATÉES, donc temporaires par construction
# =============================================================================
# Chaque entrée porte un `expired_at`. Passée cette date, l'exception cesse de
# s'appliquer et la garde redevient rouge : c'est ce qui force le réexamen.
# Une exception sans date ne s'enlève jamais — elle devient un trou permanent
# qu'on oublie avoir creusé.
#
# -----------------------------------------------------------------------------
# 2026-10-01 — fichier VIDÉ : les 17 exceptions du binaire Caddy
# (`usr/bin/caddy`) et celle de c-ares ont expiré ce jour, et leur cause est
# traitée au lieu d'être prolongée :
#
# - binaire Caddy : `Dockerfile.frontend` recompile désormais Caddy v2.11.4
#   (stade `caddy-build`) avec Go 1.26.8 et golang.org/x/crypto 0.55.0,
#   x/net 0.58.0, x/text 0.41.0, grpc 1.83.2 — au moins les versions exigées par les
#   avis. `caddy:2-alpine`, lui, embarque toujours Go 1.26.3 (aucun tag
#   corrigé publié au 2026-10-01) ;
# - c-ares (CVE-2026-33630) : corrigé par la base Alpine 3.23.6 de
#   `caddy:2-alpine` (Trivy : 0 vulnérabilité Alpine).
#
# Le proxy de BORDURE (`axion-crm-caddy`, 80/443, TLS en frontal) porte le
# MÊME binaire recompilé (cible `caddy-bordure` de `Dockerfile.frontend`,
# construite par le déploiement) et passe sous la même garde bloquante.
#
# Risque RÉSIDUEL, dit en clair : aucun avis HIGH/CRITICAL corrigeable connu
# au 2026-10-01. Les versions sont ÉPINGLÉES (Go par digest, modules par
# version) : elles ne bougent plus seules. Un nouvel avis sur Go ou sur ces
# modules fera rougir la garde ; le geste est alors de monter l'épinglage du
# stade `caddy-build`, pas d'ajouter une exception ici. Le banc local
# `docker-compose.verif.yml` (boucle locale seulement) tire encore
# `caddy:2-alpine`.
#
# Toute nouvelle exception : un `id`, un `paths` si possible, un `statement`
# qui dit pourquoi rien n'est corrigeable ICI, et un `expired_at`.
# -----------------------------------------------------------------------------
vulnerabilities: []
