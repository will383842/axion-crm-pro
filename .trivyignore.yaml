  # ---------------------------------------------------------------------------
  # Ajout du 2026-09-14 — les DEUX HIGH qui restaient hors du fichier.
  #
  # Le bloc ci-dessus a ete ecrit le 2026-08-16 et couvre 13 CVE. Ces deux-la
  # sont apparues DEPUIS, et personne ne les avait reprises : la garde rougissait
  # donc en permanence sur `Dockerfile.frontend`, sur main comme sur chaque PR.
  #
  # 🔑 C'est le vrai cout d'une exception incomplete : un voyant toujours rouge
  # cesse d'etre lu. Il a masque pendant des semaines le fait que la garde
  # fonctionnait parfaitement — au point qu'on a cru a un defaut du controle.
  #
  # ⚠️ AUCUNE des deux n'est corrigeable dans ce depot, et les deux raisons
  # different — c'est ce qui justifie de les ecrire separement plutot que de
  # les absoudre en bloc.
  # ---------------------------------------------------------------------------
  - id: CVE-2026-56854
    paths: ["usr/bin/caddy"]
    statement: "golang.org/x/crypto/ssh v0.52.0, corrige en 0.55.0 — COMPILE DANS le binaire Caddy. Un binaire Go embarque ses dependances : ni `apk upgrade` ni aucun geste de ce depot ne peut le changer. Seul un Caddy reconstruit en amont corrige. Meme famille que les 13 CVE du bloc precedent."
    expired_at: 2026-10-01
  - id: CVE-2026-33630
    statement: "c-ares 1.34.6-r0, corrige en 1.34.8-r0 — paquet Alpine, DONC a priori corrigeable... sauf que `RUN apk --no-cache upgrade` est DEJA present au stade `prod` de Dockerfile.frontend (l. 72) et ne l'atteint pas : le depot Alpine de la version embarquee par `caddy:2-alpine` ne publie pas encore 1.34.8-r0. Le remede est le meme que ci-dessus — un rebuild amont de l'image Caddy sur une Alpine plus recente. Ne PAS ajouter un second `apk upgrade` : il ne changerait rien et donnerait l'illusion d'un correctif."
    expired_at: 2026-10-01

  # ---------------------------------------------------------------------------
