openapi: 3.1.0
info:
  title: Envoi — campagnes
  version: 0.1.0
  description: |
    Liste, fiche et suivi des campagnes : filtres par statut, pause, reprise,
    terminer, dupliquer, changer la date, destinataires et état par
    destinataire, calendrier. Lot d'écran : DM2-CAM.
servers:
  - url: /api/v1
paths:
  /envoi/campagnes:
    get:
      operationId: listerCampagnes
      summary: Liste des campagnes
      parameters:
        - name: statut
          in: query
          required: false
          schema: { $ref: './commun.yaml#/components/schemas/StatutCampagne' }
        - $ref: './commun.yaml#/components/parameters/Recherche'
        - $ref: './commun.yaml#/components/parameters/Page'
        - $ref: './commun.yaml#/components/parameters/ParPage'
      responses:
        '200':
          description: Campagnes et compte par statut.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, par_statut, maintenant]
                properties:
                  maintenant:
                    description: Heure du serveur (sert à proposer « Demain 9:00 »).
                    allOf: [{ $ref: './commun.yaml#/components/schemas/Horodatage' }]
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/CampagneSuivi' }
                  meta: { $ref: './commun.yaml#/components/schemas/Pagination' }
                  par_statut:
                    type: object
                    additionalProperties: { type: integer, minimum: 0 }
  /envoi/campagnes/calendrier:
    get:
      operationId: calendrierCampagnes
      summary: Calendrier des envois prévus et passés
      parameters:
        - name: du
          in: query
          required: false
          description: Premier jour (inclus). Sans `du` ni `au`, la semaine en cours (du lundi au dimanche).
          schema: { type: string, format: date }
        - name: au
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: Une ligne par jour et par campagne.
          content:
            application/json:
              schema:
                type: object
                required: [maintenant, du, au, data]
                properties:
                  maintenant: { $ref: './commun.yaml#/components/schemas/Horodatage' }
                  du: { type: string, format: date }
                  au: { type: string, format: date }
                  data:
                    type: array
                    items:
                      type: object
                      required: [jour, campagne_id, nom, statut, prevus, envoyes]
                      properties:
                        jour: { type: string, format: date }
                        campagne_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
                        nom: { type: string }
                        statut: { $ref: './commun.yaml#/components/schemas/StatutCampagne' }
                        prevus: { type: integer, minimum: 0 }
                        envoyes: { type: integer, minimum: 0 }
  /envoi/campagnes/{id}:
    get:
      operationId: lireCampagne
      summary: Fiche de suivi d'une campagne
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200':
          description: Campagne, séquence et fil des derniers événements.
          content:
            application/json:
              schema:
                type: object
                required: [maintenant, campagne, sequence, derniers_evenements, compteurs, par_boite, par_jour, ab, fin_prevue_le]
                properties:
                  maintenant: { $ref: './commun.yaml#/components/schemas/Horodatage' }
                  campagne: { $ref: '#/components/schemas/CampagneSuivi' }
                  sequence:
                    type: array
                    items:
                      type: object
                      required: [etape, message_id, delai_jours, envoyes, reponses, refus]
                      properties:
                        etape: { type: integer, minimum: 1, maximum: 3 }
                        message_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
                        delai_jours: { type: integer, minimum: 0 }
                        envoyes: { type: integer, minimum: 0 }
                        reponses: { type: integer, minimum: 0 }
                        refus: { type: integer, minimum: 0 }
                  derniers_evenements:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/EvenementEnvoi' }
                  compteurs:
                    type: object
                    description: Décompte des destinataires par état, et taux de la campagne.
                    required:
                      [en_file, partis, refuses, ont_repondu, exclus, desinscrits, arretes_entreprise,
                       en_pause_absence, taux_refus, limite_refus, taux_desinscription]
                    properties:
                      en_file: { type: integer, minimum: 0 }
                      partis: { type: integer, minimum: 0 }
                      refuses: { type: integer, minimum: 0 }
                      ont_repondu: { type: integer, minimum: 0 }
                      exclus: { type: integer, minimum: 0 }
                      desinscrits: { type: integer, minimum: 0 }
                      arretes_entreprise:
                        type: integer
                        minimum: 0
                        description: Entreprises dont la suite est arrêtée parce qu'un contact a répondu.
                      en_pause_absence:
                        type: integer
                        minimum: 0
                        description: Destinataires en pause (absence du bureau), reprise au retour.
                      taux_refus: { type: number, minimum: 0 }
                      limite_refus: { type: number, minimum: 0 }
                      taux_desinscription: { type: number, minimum: 0 }
                  par_boite:
                    type: array
                    items:
                      type: object
                      required: [boite_id, adresse, envoyes, reponses, refus]
                      properties:
                        boite_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
                        adresse: { type: string }
                        envoyes: { type: integer, minimum: 0 }
                        reponses: { type: integer, minimum: 0 }
                        refus: { type: integer, minimum: 0 }
                  par_jour:
                    type: array
                    items:
                      type: object
                      required: [jour, envoyes]
                      properties:
                        jour: { type: string, format: date }
                        envoyes: { type: integer, minimum: 0 }
                  ab:
                    description: Test A/B sur l'objet ; nul si la campagne n'en fait pas. Le critère est les réponses.
                    oneOf:
                      - type: object
                        required: [versions, gagnant, choix_automatique_le]
                        properties:
                          versions:
                            type: array
                            items:
                              type: object
                              required: [version, objet, envoyes, reponses, taux_reponse, en_tete]
                              properties:
                                version: { type: string, enum: [A, B] }
                                objet: { type: string }
                                envoyes: { type: integer, minimum: 0 }
                                reponses: { type: integer, minimum: 0 }
                                taux_reponse: { type: number, minimum: 0 }
                                en_tete: { type: boolean }
                          gagnant:
                            oneOf:
                              - { type: string, enum: [A, B] }
                              - { type: 'null' }
                          choix_automatique_le:
                            oneOf:
                              - { $ref: './commun.yaml#/components/schemas/Horodatage' }
                              - { type: 'null' }
                      - { type: 'null' }
                  fin_prevue_le:
                    oneOf:
                      - { $ref: './commun.yaml#/components/schemas/Horodatage' }
                      - { type: 'null' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/pause:
    post:
      operationId: mettreCampagneEnPause
      summary: Mettre en pause (rien n'est perdu)
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - $ref: '#/components/parameters/CleIdempotence'
      responses:
        '200': { $ref: '#/components/responses/Campagne' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/reprise:
    post:
      operationId: reprendreCampagne
      summary: Reprendre une campagne en pause
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - $ref: '#/components/parameters/CleIdempotence'
      responses:
        '200': { $ref: '#/components/responses/Campagne' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/terminer:
    post:
      operationId: terminerCampagne
      summary: Terminer définitivement (relances comprises ; les réponses restent traitées)
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - $ref: '#/components/parameters/CleIdempotence'
      responses:
        '200': { $ref: '#/components/responses/Campagne' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/dupliquer:
    post:
      operationId: dupliquerCampagne
      summary: Dupliquer une campagne (brouillon)
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - $ref: '#/components/parameters/CleIdempotence'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom]
              properties:
                nom: { type: string }
                garder_cible: { type: boolean, default: true }
                garder_messages: { type: boolean, default: true }
                exclure_deja_recus: { type: boolean, default: false }
      responses:
        '201': { $ref: '#/components/responses/Campagne' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/date:
    post:
      operationId: changerDateCampagne
      summary: Changer la date du prochain envoi
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - $ref: '#/components/parameters/CleIdempotence'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [le]
              properties:
                le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
      responses:
        '200': { $ref: '#/components/responses/Campagne' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/campagnes/{id}/destinataires:
    get:
      operationId: listerDestinatairesCampagne
      summary: Destinataires et état par destinataire
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
        - name: etat
          in: query
          required: false
          schema: { $ref: './commun.yaml#/components/schemas/EtatDestinataire' }
        - name: groupe
          in: query
          required: false
          description: Regroupement affiché sous forme de filtres (les états détaillés restent dans `etat`).
          schema: { type: string, enum: [en_file, partis, refuses, ont_repondu, arretes, exclus] }
        - $ref: './commun.yaml#/components/parameters/Recherche'
        - $ref: './commun.yaml#/components/parameters/Page'
        - $ref: './commun.yaml#/components/parameters/ParPage'
      responses:
        '200':
          description: Destinataires paginés.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/Destinataire' }
                  meta: { $ref: './commun.yaml#/components/schemas/Pagination' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
components:
  parameters:
    CleIdempotence:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Clé de rejeu (8 à 100 caractères, lettres, chiffres, tiret, point, souligné). Un second envoi avec la même
        clé (geste envoyé deux fois) ne refait rien : la campagne est rendue telle quelle, un seul événement au journal.
        Sans clé, le serveur en dérive une de la campagne, du geste et de sa version.
      schema: { type: string, minLength: 8, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$' }
  schemas:
    CampagneSuivi:
      description: |
        Campagne telle que le suivi la montre (R09). Par rapport à `CampagneResume` : `ab_objet` est retiré (pas de test A/B)
        et `etapes` va de 1 à 3. Au palier 0, `envoi_ferme` est vrai : « en_cours » n'existe pas, l'écran dit
        « programmée, envoi fermé ». Les compteurs restent à 0 tant que la campagne n'a pas de séquence.
      type: object
      required:
        [id, nom, statut, cible, envoyes, total, reponses, reponses_interessees,
         prochain_envoi_le, cree_le, boites, etapes, envoi_ferme, version]
      properties:
        id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
        nom: { type: string }
        statut: { $ref: './commun.yaml#/components/schemas/StatutCampagne' }
        cible: { $ref: './commun.yaml#/components/schemas/CibleCampagne' }
        envoyes: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
        reponses: { type: integer, minimum: 0 }
        reponses_interessees: { type: integer, minimum: 0 }
        prochain_envoi_le:
          oneOf:
            - { $ref: './commun.yaml#/components/schemas/Horodatage' }
            - { type: 'null' }
        cree_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
        boites:
          type: array
          items: { $ref: './commun.yaml#/components/schemas/Identifiant' }
        etapes: { type: integer, minimum: 1, maximum: 3 }
        envoi_ferme:
          type: boolean
          description: "Vrai tant que l'envoi réel est fermé (palier 0): aucune campagne ne part."
        version:
          type: integer
          minimum: 1
          description: Version de la campagne (verrou optimiste).
  responses:
    Campagne:
      description: Campagne après le geste.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampagneSuivi' }
