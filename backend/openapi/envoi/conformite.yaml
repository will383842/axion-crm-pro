openapi: 3.1.0
info:
  title: Envoi — conformité et réglages
  version: 0.1.0
  description: |
    Désinscriptions, « Puis-je écrire à… ? », export du registre d'opposition,
    alertes d'envoi (cloche et e-mail seulement), réglages d'envoi, identité,
    règles et horaires, connexion au CRM, carnet de destinataires (offre
    « Envoi seul »), page publique de désinscription. Rien n'est jamais
    supprimé : on inscrit « ne plus écrire ». Lot : DM2-CNF.

    Entité d'envoi : société par actions simplifiée (SAS) française.

    Aucune mesure de lecture des messages : le bloc d'information (art. 14 du
    RGPD) ne décrit aucun suivi.
    Règle sur les liens : aucun suivi des clics, les liens des messages ne sont pas réécrits.
servers:
  - url: /api/v1
paths:
  /envoi/desinscriptions:
    get:
      operationId: listerDesinscriptions
      summary: Désinscriptions
      parameters:
        - $ref: './commun.yaml#/components/parameters/Recherche'
        - $ref: './commun.yaml#/components/parameters/Page'
        - $ref: './commun.yaml#/components/parameters/ParPage'
      responses:
        '200':
          description: Désinscriptions paginées.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/Desinscription' }
                  meta: { $ref: './commun.yaml#/components/schemas/Pagination' }
  /envoi/opposition:
    get:
      operationId: listerOpposition
      summary: Registre d'opposition (« ne plus écrire »)
      parameters:
        - $ref: './commun.yaml#/components/parameters/Recherche'
        - $ref: './commun.yaml#/components/parameters/Page'
        - $ref: './commun.yaml#/components/parameters/ParPage'
      responses:
        '200':
          description: Lignes du registre.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, resume]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/Opposition' }
                  meta: { $ref: './commun.yaml#/components/schemas/Pagination' }
                  resume:
                    type: object
                    description: Chiffres du registre entier (indépendants de la page affichée).
                    required: [total, ce_mois, ce_mois_par_lien, domaines_entiers, organisations]
                    properties:
                      total: { type: integer, minimum: 0 }
                      ce_mois: { type: integer, minimum: 0 }
                      ce_mois_par_lien: { type: integer, minimum: 0 }
                      domaines_entiers: { type: integer, minimum: 0 }
                      organisations: { type: integer, minimum: 0 }
    post:
      operationId: inscrireOpposition
      summary: Inscrire une adresse, une organisation ou un domaine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [portee, valeur, motif]
              properties:
                portee: { type: string, enum: [adresse, organisation, domaine] }
                valeur: { type: string }
                motif: { type: string }
      responses:
        '201':
          description: Ligne inscrite.
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/Opposition' }
  /envoi/opposition/export:
    get:
      operationId: exporterOpposition
      summary: Export du registre (CSV)
      description: |
        Réservé au propriétaire (`workspaces.manage`) ET à la permission `data.export`. Envoyé en flux, journalisé
        (qui, quand, combien de lignes ; jamais les adresses). Les cellules commençant par `=`, `+`, `-`, `@` sont
        neutralisées. Limite : 2 exports par heure (429 au-delà).
      responses:
        '200':
          description: Fichier CSV.
          content:
            text/csv:
              schema: { type: string }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '429': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/puis-je-ecrire:
    get:
      operationId: puisJeEcrire
      summary: « Puis-je écrire à… ? »
      description: |
        Rend seulement `peut` et un motif codé REGROUPÉ (jamais le détail d'une garde). Une adresse inconnue de l'espace
        et une adresse connue seulement d'un autre espace reçoivent EXACTEMENT la même réponse (aucun oracle « contact connu »).
        Limite : 30 demandes par minute et par compte (429 au-delà). L'adresse n'est jamais journalisée en clair.
      parameters:
        - name: adresse
          in: query
          required: true
          schema: { type: string, format: email }
      responses:
        '200':
          description: La réponse et, si c'est non, le groupe de motif.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReponsePuisJeEcrire' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
        '429': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/alertes:
    get:
      operationId: listerAlertesEnvoi
      summary: Alertes d'envoi
      responses:
        '200':
          description: Alertes ouvertes et récentes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AlerteEnvoi' }
  /envoi/alertes/{id}/regler:
    post:
      operationId: marquerAlerteReglee
      summary: Marquer une alerte comme réglée (elle reste dans l'historique)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: L'alerte après changement.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlerteEnvoi' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/reglages/alertes:
    get:
      operationId: listerReglesAlerte
      summary: Règles d'alerte (type × canal)
      responses:
        '200': { $ref: '#/components/responses/ReglagesAlertes' }
    put:
      operationId: enregistrerReglesAlerte
      summary: Enregistrer les règles d'alerte
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReglagesAlertes' }
      responses:
        '200': { $ref: '#/components/responses/ReglagesAlertes' }
  /envoi/reglages/alertes/test:
    post:
      operationId: envoyerAlerteDeTest
      summary: Envoyer une alerte de test (cloche et e-mail seulement ; aucun message réel en démo)
      responses:
        '200': { $ref: './commun.yaml#/components/responses/Succes' }
  /envoi/reglages/apercu:
    get:
      operationId: lireApercuReglages
      summary: Accueil des réglages d'envoi (résumé et boucles de retour)
      responses:
        '200':
          description: Résumé.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApercuReglages' }
  /envoi/reglages/absence:
    put:
      operationId: enregistrerModeAbsence
      summary: Mode absence (campagnes en pause, réponses en attente)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeAbsence' }
      responses:
        '200':
          description: Mode absence enregistré.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModeAbsence' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/reglages/regles:
    get:
      operationId: lireRegles
      summary: Règles de prudence et horaires
      responses:
        '200': { $ref: '#/components/responses/Regles' }
    put:
      operationId: enregistrerRegles
      summary: Enregistrer les règles (durcir seulement ; un assouplissement répond 422)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Regles' }
      responses:
        '200': { $ref: '#/components/responses/Regles' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/reglages:
    get:
      operationId: lireReglagesEnvoi
      summary: Réglages d'envoi (vue d'ensemble)
      responses:
        '200': { $ref: '#/components/responses/Reglages' }
    put:
      operationId: enregistrerReglagesEnvoi
      summary: Enregistrer les réglages d'envoi
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reglages' }
      responses:
        '200': { $ref: '#/components/responses/Reglages' }
  /envoi/reglages/identite:
    get:
      operationId: lireIdentite
      summary: Identité de l'expéditeur (mentions, adresse postale, signature)
      responses:
        '200': { $ref: '#/components/responses/Identite' }
    put:
      operationId: enregistrerIdentite
      summary: Enregistrer l'identité
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Identite' }
      responses:
        '200': { $ref: '#/components/responses/Identite' }
  /envoi/reglages/connexion-crm:
    get:
      operationId: lireConnexionCrm
      summary: Connexion au CRM (adaptateur)
      responses:
        '200': { $ref: '#/components/responses/ConnexionCrm' }
  /envoi/reglages/connexion-crm/tester:
    post:
      operationId: testerConnexionCrm
      summary: Tester la connexion au CRM
      responses:
        '200': { $ref: '#/components/responses/ConnexionCrm' }
  /envoi/carnet:
    get:
      operationId: listerCarnet
      summary: Carnet de destinataires (Envoi sans CRM)
      parameters:
        - $ref: './commun.yaml#/components/parameters/Recherche'
        - $ref: './commun.yaml#/components/parameters/Page'
        - $ref: './commun.yaml#/components/parameters/ParPage'
      responses:
        '200':
          description: Entrées du carnet.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/EntreeCarnet' }
                  meta: { $ref: './commun.yaml#/components/schemas/Pagination' }
    post:
      operationId: ajouterAuCarnet
      summary: Ajouter une entrée au carnet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse]
              properties:
                adresse: { type: string, format: email }
                prenom: { type: string }
                nom: { type: string }
                organisation: { type: string }
                etiquettes: { type: array, items: { type: string } }
      responses:
        '201':
          description: Entrée créée.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EntreeCarnet' }
  /public/desinscription/{jeton}:
    get:
      operationId: lirePageDesinscription
      summary: Page publique de désinscription (sans connexion)
      security: []
      parameters:
        - name: jeton
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Adresse masquée et expéditeur.
          content:
            application/json:
              schema:
                type: object
                required: [adresse_masquee, expediteur, deja_desinscrit, organisation, pourquoi_ce_message]
                properties:
                  adresse_masquee: { type: string }
                  expediteur: { type: string }
                  deja_desinscrit: { type: boolean }
                  organisation:
                    description: Nom de l'organisation du destinataire, si connue (option « toute mon organisation »).
                    oneOf: [{ type: string }, { type: 'null' }]
                  pourquoi_ce_message:
                    type: string
                    description: Texte « pourquoi ce message » (source, données, et aucun suivi des clics).
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
    post:
      operationId: confirmerDesinscription
      summary: Confirmer la désinscription (un clic)
      security: []
      parameters:
        - name: jeton
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                toute_l_organisation:
                  type: boolean
                  description: Inscrit aussi l'organisation (portée « organisation » du registre).
      responses:
        '200': { $ref: './commun.yaml#/components/responses/Succes' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
components:
  schemas:
    ReponsePuisJeEcrire:
      type: object
      required: [peut, motif]
      properties:
        peut: { type: boolean }
        motif:
          description: Groupe de motif quand `peut` est faux ; `null` quand c'est oui.
          oneOf:
            - { type: string, enum: [opposition, adresse_non_verifiee, contact_ecarte, conditions_envoi] }
            - { type: 'null' }
    ReglagesAlertes:
      type: object
      description: Règles d'alerte par type et canal (console et e-mail seulement), seconde adresse, regroupement.
      required: [data, seconde_adresse, regroupement_minutes]
      properties:
        data:
          type: array
          items: { $ref: './commun.yaml#/components/schemas/RegleAlerte' }
        seconde_adresse:
          oneOf: [{ type: string, format: email }, { type: 'null' }]
        regroupement_minutes:
          type: integer
          description: Les alertes de même type sont regroupées sur cette durée (15 minutes).
    ModeAbsence:
      type: object
      required: [actif, du, au]
      properties:
        actif: { type: boolean }
        du: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
        au: { oneOf: [{ type: string, format: date }, { type: 'null' }] }
    BoucleDeRetour:
      type: object
      required: [nom, etat, detail]
      properties:
        nom: { type: string }
        etat: { type: string, enum: [fait, a_faire] }
        detail: { type: string }
    ApercuReglages:
      type: object
      required: [regles_actives, canaux, absence, boucles_de_retour, oppositions]
      properties:
        regles_actives: { type: integer, minimum: 0 }
        canaux:
          type: array
          items: { $ref: './commun.yaml#/components/schemas/CanalAlerte' }
        oppositions: { type: integer, minimum: 0 }
        absence: { $ref: '#/components/schemas/ModeAbsence' }
        boucles_de_retour:
          type: array
          items: { $ref: '#/components/schemas/BoucleDeRetour' }
    Regles:
      type: object
      description: |
        Règles de prudence et horaires. On ne peut que DURCIR (valeur plus
        prudente) : un seuil plus haut, une fenêtre plus large ou un frein plus
        lâche répond 422 `assouplissement_refuse`.
      required:
        [pause_si_refus_pct, pause_si_plaintes_pour_mille, test_du_matin_bloquant,
         frein_reponses_par_jour, pression_max_par_organisation_30j, heure_de, heure_a,
         jours_ouvres_seulement]
      properties:
        pause_si_refus_pct: { type: number, minimum: 0 }
        pause_si_plaintes_pour_mille: { type: number, minimum: 0 }
        test_du_matin_bloquant: { type: boolean, const: true }
        frein_reponses_par_jour:
          type: integer
          minimum: 0
          description: Au-delà de ce nombre de réponses en attente par jour, les envois ralentissent (15 par défaut).
        pression_max_par_organisation_30j:
          type: integer
          minimum: 1
          description: Nombre maximal de messages vers une même organisation sur 30 jours (pression commerciale).
        heure_de: { type: string, examples: ['09:00'] }
        heure_a: { type: string, examples: ['17:30'] }
        jours_ouvres_seulement:
          type: boolean
          description: Pas de week-end ni de jour férié français.
    AlerteEnvoi:
      type: object
      required: [id, titre, detail, ce_qui_se_passe, ce_que_le_systeme_a_fait, que_faire, niveau, survenue_le, lien, close]
      properties:
        id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
        titre: { type: string }
        detail: { type: string }
        ce_qui_se_passe: { type: string }
        ce_que_le_systeme_a_fait: { type: string }
        que_faire: { type: string }
        niveau: { type: string, enum: [a_faire, attention, nouveau, fait] }
        survenue_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
        lien: { oneOf: [{ type: string }, { type: 'null' }] }
        close: { type: boolean }
    Reglages:
      type: object
      required: [plafond_jour, jours, heures, fuseau, pause_si_refus_pct]
      properties:
        plafond_jour: { type: integer, minimum: 1 }
        jours: { type: array, items: { type: string, enum: [lun, mar, mer, jeu, ven, sam, dim] } }
        heures:
          type: object
          required: [de, a]
          properties:
            de: { type: string }
            a: { type: string }
        fuseau: { type: string, examples: [Europe/Paris] }
        pause_si_refus_pct: { type: number, minimum: 0 }
    Identite:
      type: object
      required:
        [raison_sociale, forme, adresse_postale, signature, lien_desinscription, lien_rendez_vous,
         bloc_information]
      properties:
        raison_sociale: { type: string }
        forme:
          type: string
          description: Forme juridique de l'entité d'envoi (SAS française).
          examples: [SAS]
        adresse_postale: { type: string }
        signature: { type: string }
        lien_desinscription: { type: boolean, const: true }
        lien_rendez_vous:
          description: Lien de rendez-vous ajouté au message (facultatif).
          oneOf: [{ type: string }, { type: 'null' }]
        bloc_information:
          type: string
          description: Bloc d'information des destinataires (art. 14 du RGPD), présent sous chaque message.
    ConnexionCrm:
      type: object
      required: [adaptateur, etat, derniere_synchro_le, contacts_vus, ce_qui_passe, ce_qui_ne_passe_pas]
      properties:
        ce_qui_passe:
          type: array
          description: Ce que l'adaptateur échange avec le CRM (phrases courtes).
          items: { type: string }
        ce_qui_ne_passe_pas:
          type: array
          description: Ce qui ne quitte jamais Envoi ou le CRM.
          items: { type: string }
        adaptateur: { type: string, enum: [crm_pro, generique, aucun] }
        etat: { $ref: './commun.yaml#/components/schemas/EtatFeu' }
        derniere_synchro_le:
          oneOf:
            - $ref: './commun.yaml#/components/schemas/Horodatage'
            - type: 'null'
        contacts_vus: { type: integer, minimum: 0 }
    EntreeCarnet:
      type: object
      required: [id, adresse, prenom, nom, organisation, etiquettes, ajoute_le]
      properties:
        id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
        adresse: { type: string, format: email }
        prenom: { oneOf: [{ type: string }, { type: 'null' }] }
        nom: { oneOf: [{ type: string }, { type: 'null' }] }
        organisation: { oneOf: [{ type: string }, { type: 'null' }] }
        etiquettes: { type: array, items: { type: string } }
        ajoute_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
  responses:
    ReglagesAlertes:
      description: Règles d'alerte.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReglagesAlertes' }
    Regles:
      description: Règles de prudence et horaires.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Regles' }
    Reglages:
      description: Réglages d'envoi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Reglages' }
    Identite:
      description: Identité de l'expéditeur.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Identite' }
    ConnexionCrm:
      description: État de la connexion au CRM.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnexionCrm' }
