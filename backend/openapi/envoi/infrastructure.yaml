openapi: 3.1.0
info:
  title: Envoi — infrastructure
  version: 0.1.0
  description: |
    Boîtes d'envoi, domaines (fiche sur 30 jours, enregistrements DNS, DMARC
    progressif), serveurs et adresses IP (« ajouter et appliquer »),
    configuration versionnée, chauffe, listes noires. En démo : domaines en
    `.example`, adresses IP des plages de documentation. Lot : DM2-INF.
servers:
  - url: /api/v1
paths:
  /envoi/boites:
    get:
      operationId: listerBoites
      summary: Boîtes d'envoi
      responses:
        '200':
          description: Boîtes.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/BoiteResume' }
    post:
      operationId: ajouterBoite
      summary: Ajouter une boîte (non disponible au palier 0)
      description: |
        Au palier 0, une boîte s'ajoute par commande locale sur le serveur
        (les identifiants ne transitent jamais par l'écran) : la route répond 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse, domaine_id, nom_affiche]
              properties:
                adresse: { type: string, format: email }
                domaine_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
                nom_affiche: { type: string }
                signature:
                  description: Signature ajoutée en bas des messages de cette boîte.
                  type: string
                mode_absence: { $ref: '#/components/schemas/ModeAbsence' }
      responses:
        '201': { $ref: '#/components/responses/Boite' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
        '501': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/boites/test-connexion:
    post:
      operationId: testerConnexionBoite
      summary: Tester la connexion d'une boîte avant de l'ajouter (non disponible au palier 0)
      description: Au palier 0, l'ajout se fait par commande locale, la route répond 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse, domaine_id]
              properties:
                adresse: { type: string, format: email }
                domaine_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
      responses:
        '200':
          description: Résultat du test, étape par étape.
          content:
            application/json:
              schema:
                type: object
                required: [reussi, etapes]
                properties:
                  reussi: { type: boolean }
                  etapes:
                    type: array
                    items:
                      type: object
                      required: [libelle, ok]
                      properties:
                        libelle: { type: string }
                        ok: { type: boolean }
        '501': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/boites/{id}:
    get:
      operationId: lireBoite
      summary: Fiche d'une boîte
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200':
          description: Boîte, 30 jours d'activité et derniers refus.
          content:
            application/json:
              schema:
                type: object
                required: [boite, jours, derniers_refus, reponses, reglages]
                properties:
                  boite: { $ref: './commun.yaml#/components/schemas/BoiteResume' }
                  reponses:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/ReponseResume' }
                  reglages: { $ref: '#/components/schemas/ReglagesBoite' }
                  jours:
                    type: array
                    items: { $ref: '#/components/schemas/JourActivite' }
                  derniers_refus:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/EvenementEnvoi' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/boites/{id}/reglages:
    put:
      operationId: enregistrerReglagesBoite
      summary: Enregistrer la signature et le mode absence d'une boîte
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReglagesBoite' }
      responses:
        '200':
          description: Réglages enregistrés.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReglagesBoite' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/boites/{id}/suspendre:
    post:
      operationId: suspendreBoite
      summary: Suspendre une boîte
      description: Permission requise, `users.manage` (403 sinon).
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200': { $ref: '#/components/responses/Boite' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/boites/{id}/reactiver:
    post:
      operationId: reactiverBoite
      summary: Réactiver une boîte suspendue
      description: |
        Permission requise, `workspaces.manage` (403 sinon). Refusée (409) tant
        qu'une pause de frein ou une pause automatique est active.
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200': { $ref: '#/components/responses/Boite' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/domaines:
    get:
      operationId: listerDomaines
      summary: Domaines d'envoi
      responses:
        '200':
          description: Domaines.
          content:
            application/json:
              schema:
                type: object
                required: [data, garde_dispersion, expirations]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  garde_dispersion:
                    description: |
                      Garde anti-dispersion : nombre de domaines utilisés et limite
                      (trois domaines par serveur d'envoi). Au-delà, l'ajout est refusé.
                    type: object
                    required: [utilises, limite]
                    properties:
                      utilises: { type: integer, minimum: 0 }
                      limite: { type: integer, minimum: 1 }
                  expirations:
                    description: Date d'expiration de chaque domaine (identifiant du domaine -> date).
                    type: object
                    additionalProperties: { $ref: './commun.yaml#/components/schemas/Horodatage' }
    post:
      operationId: ajouterDomaine
      summary: Ajouter un domaine (rend les enregistrements DNS à publier à la main)
      description: |
        R15 — propriétaire seul (403 sinon). Enregistre le domaine avec son flux ; n'écrit RIEN dans un DNS.
        Le nom est normalisé (minuscules, IDN en punycode) ; une adresse IP, un domaine interne ou réservé
        (`localhost`, `.local`, `.internal`, `.invalid`, `.test`, `.example`…) ou un nom trop long donne 422.
        Rejouer le même domaine ne crée pas de doublon : 200 avec le domaine existant (201 à la création).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nom, flux]
              properties:
                nom: { type: string }
                flux: { $ref: './commun.yaml#/components/schemas/FluxEnvoi' }
      responses:
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
        '200':
          description: Domaine déjà enregistré (rejeu) et enregistrements à publier.
          content:
            application/json:
              schema:
                type: object
                required: [domaine, dns]
                properties:
                  domaine: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  dns:
                    type: array
                    items: { $ref: '#/components/schemas/EnregistrementDns' }
        '201':
          description: Domaine et enregistrements à créer.
          content:
            application/json:
              schema:
                type: object
                required: [domaine, dns]
                properties:
                  domaine: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  dns:
                    type: array
                    items: { $ref: '#/components/schemas/EnregistrementDns' }
  /envoi/domaines/{id}:
    get:
      operationId: lireDomaine
      summary: Fiche d'un domaine sur 30 jours
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200':
          description: Domaine, DNS, 30 jours, listes noires.
          content:
            application/json:
              schema:
                type: object
                required: [domaine, dns, jours, listes_noires, expire_le]
                properties:
                  domaine: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  dns:
                    type: array
                    items: { $ref: '#/components/schemas/EnregistrementDns' }
                  jours:
                    type: array
                    items: { $ref: '#/components/schemas/JourActivite' }
                  listes_noires:
                    type: array
                    items: { $ref: '#/components/schemas/ListeNoire' }
                  expire_le:
                    description: Nul si la date d'expiration n'est pas conservée.
                    oneOf:
                      - $ref: './commun.yaml#/components/schemas/Horodatage'
                      - type: 'null'
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/domaines/{id}/dns/verifier:
    post:
      operationId: verifierDns
      summary: Vérifier les enregistrements DNS
      description: |
        R15 — propriétaire seul. Lecture par le résolveur local, limitée à 6 appels par minute et par compte (429 au-delà).
        N'interroge que les domaines de l'espace courant : domaine d'un autre espace ou inconnu = 404.
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200':
          description: État de chaque enregistrement.
          content:
            application/json:
              schema:
                type: object
                required: [dns, pret, pause]
                properties:
                  pret: { type: boolean }
                  pause: { type: boolean }
                  dns:
                    type: array
                    items: { $ref: '#/components/schemas/EnregistrementDns' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '429': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/domaines/{id}/dmarc:
    post:
      operationId: avancerDmarc
      summary: DMARC progressif — poser un RAPPEL (la politique se change dans le DNS, par un humain)
      description: R15 — propriétaire seul. Enregistre un rappel ; ne publie rien (`applique` vaut toujours faux).
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [politique]
              properties:
                politique: { $ref: './commun.yaml#/components/schemas/PolitiqueDmarc' }
                rappel_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
      responses:
        '200':
          description: Rappel enregistré.
          content:
            application/json:
              schema:
                type: object
                required: [domaine, rappel, applique, message]
                properties:
                  domaine: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  rappel:
                    type: object
                    required: [politique, rappel_le]
                    properties:
                      politique: { $ref: './commun.yaml#/components/schemas/PolitiqueDmarc' }
                      rappel_le:
                        oneOf:
                          - $ref: './commun.yaml#/components/schemas/Horodatage'
                          - type: 'null'
                  applique: { type: boolean, const: false }
                  message: { type: string }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/serveurs:
    get:
      operationId: listerServeurs
      summary: Serveurs et adresses IP
      responses:
        '200':
          description: Serveurs.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/ServeurResume' }
  /envoi/serveurs/{id}/sante:
    get:
      operationId: lireSanteServeur
      summary: Santé d'un serveur d'envoi, file et paliers de chauffe de ses adresses IP
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200':
          description: Santé du serveur.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SanteServeur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/serveurs/{id}/test:
    post:
      operationId: lancerTestServeur
      summary: Lancer le test du serveur (fermé au palier 0, 409 « envoi fermé », aucun envoi)
      description: R15 — propriétaire seul. Serveur d'un autre espace = 404 ; sinon 409 `envoi_ferme`, sans rien envoyer.
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/serveurs/{id}/adresses-ip:
    post:
      operationId: ajouterAdresseIp
      summary: Ajouter une adresse IP (prépare une version « prête » de configuration, n'applique rien)
      description: |
        R15 — propriétaire seul. Le paquet est généré et validé, une version `prete` est notée (empreinte seulement) ;
        l'adresse n'est ni conservée ni renvoyée. Serveur ou domaine d'un autre espace = 404 ; flux différent de celui du domaine = 422.
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [adresse, flux, domaine_id]
              properties:
                adresse: { type: string }
                flux: { $ref: './commun.yaml#/components/schemas/FluxEnvoi' }
                domaine_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
      responses:
        '200': { $ref: '#/components/responses/Configuration' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/configuration:
    get:
      operationId: lireConfiguration
      summary: Configuration versionnée (courante et prête)
      responses:
        '200': { $ref: '#/components/responses/Configuration' }
  /envoi/configuration/appliquer:
    post:
      operationId: appliquerConfiguration
      summary: Appliquer la version prête (fermé, 409 au palier 0, l'Applicateur n'est jamais appelé)
      description: Seul geste qui changerait le vrai serveur ; reste fermé tant qu'un ADR de K17 ne l'ouvre pas. Propriétaire seul.
      responses:
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/configuration/versions/{numero}/revenir:
    post:
      operationId: revenirConfiguration
      summary: Revenir à une version précédente (fermé, 409 au palier 0, l'Applicateur n'est jamais appelé)
      description: Même raison que `appliquer`. Propriétaire seul.
      parameters:
        - name: numero
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/chauffe:
    get:
      operationId: lireChauffe
      summary: Chauffe des domaines et des adresses IP (montée en douceur par palier)
      responses:
        '200':
          description: Budget du jour, goulot, ressources en chauffe et table des paliers.
          content:
            application/json:
              schema:
                type: object
                required: [jour, budget_du_jour, plafond_boite, goulot, termes, ressources, paliers]
                properties:
                  jour: { type: string, format: date }
                  budget_du_jour:
                    description: Nombre d'envois permis aujourd'hui, tous termes confondus.
                    type: integer
                    minimum: 0
                  plafond_boite:
                    description: Plafond d'envois par boîte et par jour (150 en V0).
                    type: integer
                    minimum: 1
                  goulot: { $ref: '#/components/schemas/GoulotChauffe' }
                  termes: { $ref: '#/components/schemas/TermesChauffe' }
                  ressources:
                    type: array
                    items: { $ref: '#/components/schemas/RessourceChauffe' }
                  paliers:
                    type: array
                    items: { $ref: '#/components/schemas/PalierTable' }
  /envoi/chauffe/{id}/reculer:
    post:
      operationId: reculerChauffe
      summary: Reculer une ressource d'un palier
      description: |
        `id` est l'identifiant opaque d'une ressource de chauffe (ex. `domaine:<ref>`),
        pas l'identifiant d'une boîte. Impossible en P1 (409). Un second recul le même
        jour ne recule pas une seconde fois. Il n'existe aucune route pour avancer.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: La ressource après le recul.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RessourceChauffe' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '409': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/listes-noires:
    get:
      operationId: listerListesNoires
      summary: Présence des domaines et adresses IP sur les listes noires
      responses:
        '200':
          description: Une ligne par liste et par élément surveillé.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ListeNoire' }
components:
  schemas:
    TermeGoulot:
      type: string
      enum: [courbe_ip, courbe_domaine, plafond_boites, plafond_serveur, capacite_reponse]
    GoulotChauffe:
      description: Le terme qui limite le budget du jour.
      type: object
      required: [terme, ressource_id, libelle]
      properties:
        terme: { $ref: '#/components/schemas/TermeGoulot' }
        ressource_id:
          oneOf: [{ type: string }, { type: 'null' }]
        libelle: { type: string }
    TermesChauffe:
      description: Valeur de chaque terme du budget (nul si le terme ne s'applique pas).
      type: object
      required: [courbe_ip, courbe_domaine, plafond_boites, plafond_serveur, capacite_reponse]
      properties:
        courbe_ip: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        courbe_domaine: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        plafond_boites: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        plafond_serveur: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
        capacite_reponse: { oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }] }
    RessourceChauffe:
      type: object
      required:
        [id, type, libelle, palier, jours_effectifs, jours_avant_palier_suivant, total_palier,
         envoyes_aujourdhui, tenu_jusqu_au, motif_tenue, peut_reculer]
      properties:
        id:
          description: Identifiant opaque (ex. `domaine:<ref>`).
          type: string
        type: { type: string, enum: [ip, domaine] }
        libelle: { type: string }
        palier: { $ref: './commun.yaml#/components/schemas/PalierChauffe' }
        jours_effectifs: { type: integer, minimum: 0 }
        jours_avant_palier_suivant:
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
        total_palier: { type: integer, minimum: 0 }
        envoyes_aujourdhui: { type: integer, minimum: 0 }
        tenu_jusqu_au:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
        motif_tenue:
          oneOf:
            - type: string
              enum: [frein, manuel, inactivite]
            - type: 'null'
        peut_reculer: { type: boolean }
    PalierTable:
      type: object
      required: [palier, jours_min, jours_max, total_jour]
      properties:
        palier: { $ref: './commun.yaml#/components/schemas/PalierChauffe' }
        jours_min: { type: integer, minimum: 0 }
        jours_max: { type: integer, minimum: 0 }
        total_jour: { type: integer, minimum: 0 }
    SanteServeur:
      type: object
      required: [serveur_id, en_ligne_depuis_jours, en_file, test, paliers]
      properties:
        serveur_id: { $ref: './commun.yaml#/components/schemas/Identifiant' }
        en_ligne_depuis_jours:
          description: Nul si non mesuré.
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
        en_file:
          description: Messages en attente d'envoi sur ce serveur (nul si non mesuré).
          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
        test:
          description: Dernier test du serveur (nul s'il n'est pas conservé).
          oneOf:
            - type: object
              required: [fait_le, etapes]
              properties:
                fait_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
                etapes:
                  type: array
                  items:
                    type: object
                    required: [libelle, ok]
                    properties:
                      libelle: { type: string }
                      ok: { type: boolean }
            - type: 'null'
        paliers:
          description: Paliers de chauffe des adresses IP en montée.
          type: array
          items:
            type: object
            required: [adresse, jour, sur, plafond_aujourdhui]
            properties:
              adresse: { type: string }
              jour: { type: integer, minimum: 1 }
              sur: { type: integer, minimum: 1 }
              plafond_aujourdhui: { type: integer, minimum: 0 }
    ModeAbsence:
      description: Pendant l'absence, la boîte n'envoie plus et les réponses automatiques sont mises de côté.
      type: object
      required: [actif, jusqu_au, message]
      properties:
        actif: { type: boolean }
        jusqu_au:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
        message:
          oneOf: [{ type: string }, { type: 'null' }]
    ReglagesBoite:
      type: object
      required: [signature, mode_absence]
      properties:
        signature: { type: string }
        mode_absence: { $ref: '#/components/schemas/ModeAbsence' }
    JourActivite:
      type: object
      required: [jour, envoyes, remis, rebonds_durs, rebonds_mous, plaintes, reponses]
      properties:
        jour: { type: string, format: date }
        envoyes: { type: integer, minimum: 0 }
        remis: { type: integer, minimum: 0 }
        rebonds_durs: { type: integer, minimum: 0 }
        rebonds_mous: { type: integer, minimum: 0 }
        plaintes: { type: integer, minimum: 0 }
        reponses: { type: integer, minimum: 0 }
    EnregistrementDns:
      type: object
      required: [role, type, nom, valeur, etat]
      properties:
        role:
          description: Ce que l'enregistrement sert à faire.
          type: string
          enum: [spf, dkim, dmarc, ptr, mta_sts, helo, tls_rpt]
        type: { type: string, enum: [A, AAAA, TXT, CNAME, MX, PTR] }
        nom: { type: string }
        valeur: { type: string }
        etat: { type: string, enum: [ok, absent, different] }
    ListeNoire:
      type: object
      required: [liste, element, present, verifie_le, que_faire, lien_retrait]
      properties:
        liste: { type: string }
        que_faire:
          description: Fiche « que faire » en français (vide si l'élément est propre).
          oneOf: [{ type: string }, { type: 'null' }]
        lien_retrait:
          description: Adresse de la demande de retrait de la liste (vide si l'élément est propre).
          oneOf: [{ type: string, format: uri }, { type: 'null' }]
        element: { type: string }
        present: { type: boolean }
        verifie_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
    VersionConfiguration:
      type: object
      required: [numero, creee_le, appliquee_le, par, resultat, changements]
      properties:
        numero: { type: integer, minimum: 1 }
        empreinte:
          description: Empreinte SHA-256 du paquet (jamais son contenu).
          type: string
          pattern: '^[0-9a-f]{64}$'
        par:
          description: Qui a appliqué la version (prénom, ou « Système »).
          oneOf: [{ type: string }, { type: 'null' }]
        resultat:
          type: string
          enum: [prete, appliquee, remplacee, retour_automatique, invalide, retour_arriere, derive_refusee, incertaine]
        creee_le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
        appliquee_le:
          oneOf:
            - $ref: './commun.yaml#/components/schemas/Horodatage'
            - type: 'null'
        changements:
          type: array
          items:
            type: object
            required: [sorte, libelle]
            properties:
              sorte: { type: string, enum: [ajout, retrait, modification] }
              libelle: { type: string }
    Configuration:
      type: object
      required: [courante, prete, historique]
      properties:
        courante:
          description: Nulle tant qu'aucune version n'a été appliquée.
          oneOf:
            - $ref: '#/components/schemas/VersionConfiguration'
            - type: 'null'
        prete:
          oneOf:
            - $ref: '#/components/schemas/VersionConfiguration'
            - type: 'null'
        historique:
          type: array
          items: { $ref: '#/components/schemas/VersionConfiguration' }
  responses:
    Boite:
      description: Boîte après le geste.
      content:
        application/json:
          schema: { $ref: './commun.yaml#/components/schemas/BoiteResume' }
    Configuration:
      description: Configuration versionnée.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Configuration' }
