openapi: 3.1.0
info:
  title: Envoi — pilotage
  version: 0.1.0
  description: |
    Résultats par campagne, boîte, domaine, liste et message ; santé ; chercher
    un envoi ; feu vert. Indicateur principal : les réponses.
    Aucun suivi des clics ni d'ouverture. Lot : DM2-PIL.
servers:
  - url: /api/v1
paths:
  /envoi/resultats:
    get:
      operationId: lireResultats
      summary: Résultats regroupés
      parameters:
        - name: par
          in: query
          required: true
          schema:
            type: string
            enum: [campagne, boite, domaine, liste, message]
        - name: jours
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: Une ligne par groupe.
          content:
            application/json:
              schema:
                type: object
                required: [data, totaux, precedent, entonnoir, periode]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LigneResultat' }
                  totaux: { $ref: '#/components/schemas/LigneResultat' }
                  precedent:
                    description: Totaux de la période d'avant, de même durée (pour la comparaison).
                    $ref: '#/components/schemas/LigneResultat'
                  entonnoir:
                    type: object
                    required: [envoyes, reponses, rendez_vous, gagnes]
                    properties:
                      envoyes: { type: integer, minimum: 0 }
                      reponses: { type: integer, minimum: 0 }
                      rendez_vous: { type: integer, minimum: 0 }
                      gagnes: { type: integer, minimum: 0 }
                  periode:
                    type: object
                    required: [du, au]
                    properties:
                      du: { type: string, format: date }
                      au: { type: string, format: date }
  /envoi/resultats/courbe:
    get:
      operationId: lireCourbeResultats
      summary: Courbe jour par jour (30 jours)
      parameters:
        - name: campagne_id
          in: query
          required: false
          schema: { $ref: './commun.yaml#/components/schemas/Identifiant' }
      responses:
        '200':
          description: Points par jour.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [jour, remis, rebonds, reponses]
                      properties:
                        jour: { type: string, format: date }
                        remis: { type: integer, minimum: 0 }
                        rebonds: { type: integer, minimum: 0 }
                        reponses: { type: integer, minimum: 0 }
  /envoi/sante:
    get:
      operationId: lireSante
      summary: Santé des envois (vue d'ensemble)
      responses:
        '200':
          description: Feux par boîte, domaine et serveur, et test du matin.
          content:
            application/json:
              schema:
                type: object
                required: [feu, boites, domaines, serveurs, test_du_matin, alertes, verifie_le, volume_jour, rythme_messageries, envoyes_14_jours]
                properties:
                  feu: { $ref: './commun.yaml#/components/schemas/EtatFeu' }
                  boites:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/BoiteResume' }
                  domaines:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/DomaineResume' }
                  serveurs:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/ServeurResume' }
                  test_du_matin:
                    type: object
                    required: [le, temoins_ok, temoins_total, etat]
                    properties:
                      le:
                        description: Date du dernier test ; nulle tant qu'aucun test n'a été fait (l'état est alors « gris »).
                        oneOf: [{ $ref: './commun.yaml#/components/schemas/Horodatage' }, { type: 'null' }]
                      temoins_ok: { type: integer, minimum: 0 }
                      temoins_total: { type: integer, minimum: 0 }
                      etat: { $ref: './commun.yaml#/components/schemas/EtatFeu' }
                  alertes: { type: integer, minimum: 0 }
                  verifie_le:
                    description: Dernier relevé de santé reçu ; nul tant qu'aucun relevé n'existe.
                    oneOf: [{ $ref: './commun.yaml#/components/schemas/Horodatage' }, { type: 'null' }]
                  pauses:
                    description: Pauses d'envoi actives (champ facultatif, ajouté de façon compatible). Aucune = liste vide.
                    type: array
                    items:
                      type: object
                      required: [motif, portee, fournisseur, fin]
                      properties:
                        motif: { type: string, description: Code du frein ou de la pause manuelle (ex. `indesirable_chez_un_temoin`). }
                        portee: { type: string, enum: [global, fournisseur] }
                        fournisseur:
                          description: Famille de messagerie visée ; nulle pour une pause globale.
                          oneOf: [{ type: string, enum: [gmail, microsoft, autre] }, { type: 'null' }]
                        fin:
                          description: Fin prévue de la pause ; nulle si elle dure jusqu'à une levée humaine.
                          oneOf: [{ $ref: './commun.yaml#/components/schemas/Horodatage' }, { type: 'null' }]
                  temoins_par_fournisseur:
                    description: |
                      Journées témoins relevées par fournisseur sur 14 jours (champ facultatif). Lecture seule :
                      aucune saisie de journée par l'écran. Absent ou vide = non mesuré (jamais « vert »).
                    type: array
                    items:
                      type: object
                      required: [fournisseur, jours]
                      properties:
                        fournisseur: { type: string, description: "Famille de messagerie (gmail, microsoft, yahoo, orange, ovh, autre)." }
                        jours:
                          type: array
                          items:
                            type: object
                            required: [jour, etat]
                            properties:
                              jour: { type: string, format: date }
                              etat: { type: string, enum: [ok, indesirable, absent, non_teste] }
                  volume_jour:
                    type: object
                    required: [possibles, envoyes]
                    properties:
                      possibles: { type: integer, minimum: 0 }
                      envoyes: { type: integer, minimum: 0 }
                  rythme_messageries:
                    type: array
                    items:
                      type: object
                      required: [messagerie, envoyes, par_heure, etat]
                      properties:
                        messagerie: { type: string }
                        envoyes: { type: integer, minimum: 0 }
                        par_heure:
                          description: Rythme mesuré sur la dernière heure ; nul tant qu'il n'est pas mesuré.
                          oneOf: [{ type: integer, minimum: 0 }, { type: 'null' }]
                        etat: { type: string, enum: [normal, freine] }
                  envoyes_14_jours:
                    type: array
                    items:
                      type: object
                      required: [jour, envoyes]
                      properties:
                        jour: { type: string, format: date }
                        envoyes: { type: integer, minimum: 0 }
  /envoi/sante/test:
    post:
      operationId: lancerTestDuMatin
      summary: Lancer le test des boîtes témoins maintenant
      responses:
        '200':
          description: Résultat du test.
          content:
            application/json:
              schema:
                type: object
                required: [le, temoins_ok, temoins_total, etat]
                properties:
                  le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
                  temoins_ok: { type: integer, minimum: 0 }
                  temoins_total: { type: integer, minimum: 0 }
                  etat: { $ref: './commun.yaml#/components/schemas/EtatFeu' }
        '409':
          description: "Envois fermés (palier 0), aucun test ne part et rien ne change. Code envoi_ferme_palier_0."
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/Erreur' }
  /envoi/envois/chercher:
    get:
      operationId: chercherEnvoi
      summary: Chercher un envoi par adresse (tous les événements)
      parameters:
        - name: adresse
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Événements de cette adresse, et peut-on encore lui écrire.
          content:
            application/json:
              schema:
                type: object
                required: [adresse, personne, evenements, peut_ecrire, raison]
                properties:
                  adresse: { type: string }
                  personne:
                    description: Fiche du CRM quand l'adresse y est connue ; nul sinon.
                    oneOf:
                      - type: object
                        required: [contact_id, nom, organisation]
                        properties:
                          contact_id: { type: integer }
                          nom: { type: string }
                          organisation: { oneOf: [{ type: string }, { type: 'null' }] }
                      - type: 'null'
                  evenements:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/EvenementEnvoi' }
                  peut_ecrire: { type: boolean }
                  raison: { oneOf: [{ type: string }, { type: 'null' }] }
  /envoi/feu-vert:
    get:
      operationId: lireFeuVert
      summary: Liste « feu vert » avant le premier envoi réel
      description: |
        Les points `auto.*` sont calculés et jamais écrits ; les points `manuel.*`
        portent une preuve humaine. Les verrous sont en lecture seule.
      responses:
        '200':
          description: Points de contrôle, bloquants restants et verrous.
          content:
            application/json:
              schema:
                type: object
                required: [points, faits, total, bloquants_restants, verrous]
                properties:
                  points:
                    type: array
                    items: { $ref: '#/components/schemas/PointFeuVert' }
                  faits: { type: integer, minimum: 0 }
                  total: { type: integer, minimum: 0 }
                  bloquants_restants: { type: integer, minimum: 0 }
                  verrous: { $ref: '#/components/schemas/VerrousFeuVert' }
  /envoi/feu-vert/{code}/fait:
    post:
      operationId: marquerPointFeuVert
      summary: Poser ou retirer la preuve d'un point manuel du feu vert
      description: |
        Permission requise, `workspaces.manage` (403 sinon, au format `Erreur`). 404 si le
        code est inconnu. 422 si le code commence par `auto.` (calculé, jamais écrit ;
        même réponse que le code existe ou non), si la preuve (ou le motif de retrait)
        fait moins de 10 caractères ou contient une adresse e-mail. La preuve est lue
        dans le corps JSON seulement. Un point qui attend le vrai serveur reste non fait
        (`fait` false, `bloquant` true) : sa preuve est affichée mais ne le valide pas.
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [preuve]
              properties:
                preuve: { type: string, minLength: 10, maxLength: 500, description: 'Preuve humaine, ou motif quand `fait` vaut false : 10 à 500 caractères après nettoyage, ni phrase générique ni adresse e-mail.' }
                fait: { type: boolean, default: true }
      responses:
        '200':
          description: Le point à jour.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PointFeuVert' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
        '422': { $ref: './commun.yaml#/components/responses/Erreur' }
components:
  schemas:
    PointFeuVert:
      type: object
      required: [code, libelle, groupe, nature, etat, fait, bloquant, source, detail, preuve]
      properties:
        code:
          description: Préfixé `auto.` (calculé) ou `manuel.` (preuve humaine).
          type: string
          pattern: '^(auto|manuel)\.'
        libelle: { type: string }
        groupe:
          type: string
          enum: [verrous, banc, dns, serveur, temoins, conformite, exploitation]
        nature: { type: string, enum: [auto, manuel] }
        etat: { type: string, enum: [fait, a_faire, attend_serveur_reel] }
        fait:
          description: Vrai exactement quand `etat` vaut `fait` (jamais pour `attend_serveur_reel`, preuve ou non).
          type: boolean
        bloquant:
          description: Vrai exactement quand `fait` est faux.
          type: boolean
        source:
          description: Référence au document de cadrage (ex. « 26§8.5 »).
          type: string
        detail:
          oneOf: [{ type: string }, { type: 'null' }]
        preuve:
          oneOf:
            - type: object
              required: [texte, par, le]
              properties:
                texte: { type: string }
                par: { type: string }
                le: { $ref: './commun.yaml#/components/schemas/Horodatage' }
            - type: 'null'
    VerrousFeuVert:
      description: État des verrous d'envoi, en lecture seule.
      type: object
      required:
        [envoi_reel_actif, mode_temoins, signature_presente, signature_date,
         fournisseurs_temoins_couverts, fournisseurs_temoins_requis]
      properties:
        envoi_reel_actif: { type: boolean }
        mode_temoins: { type: boolean }
        signature_presente: { type: boolean }
        signature_date:
          oneOf: [{ type: string, format: date }, { type: 'null' }]
        fournisseurs_temoins_couverts: { type: integer, minimum: 0 }
        fournisseurs_temoins_requis: { type: integer, const: 6 }
    LigneResultat:
      type: object
      required: [cle, libelle, envoyes, remis, rebonds_durs, rebonds_mous, plaintes, desinscriptions, reponses, reponses_interessees]
      properties:
        cle: { type: string }
        libelle: { type: string }
        version: { type: integer, minimum: 1, description: Version du message type (regroupement par message). }
        envoyes: { type: integer, minimum: 0 }
        remis: { type: integer, minimum: 0 }
        rebonds_durs: { type: integer, minimum: 0 }
        rebonds_mous: { type: integer, minimum: 0 }
        plaintes: { type: integer, minimum: 0 }
        desinscriptions: { type: integer, minimum: 0 }
        reponses: { type: integer, minimum: 0 }
        reponses_interessees: { type: integer, minimum: 0 }
