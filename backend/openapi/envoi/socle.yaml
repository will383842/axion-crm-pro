openapi: 3.1.0
info:
  title: Envoi — socle
  version: 0.1.0
  description: |
    Routes communes aux deux produits et état global des envois : drapeaux et
    droits par produit, notifications de la cloche, « Tout arrêter »
    (la reprise est une commande locale journalisée, `envoi:reprendre`, jamais une route),
    compteurs de l'en-tête d'Envoi. Propriété : DM0-DEMO.
servers:
  - url: /api/v1
paths:
  /config/features:
    get:
      operationId: lireFeatures
      summary: Drapeaux de la console et droits de l'espace par produit
      responses:
        '200':
          description: Drapeaux et produits (`actif`, `suspendu`, `resilie`, `absent`).
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/Features' }
  /notifications:
    get:
      operationId: listerNotifications
      summary: Notifications de la cloche (deux produits)
      parameters:
        - name: produit
          in: query
          required: false
          schema: { $ref: './commun.yaml#/components/schemas/Produit' }
      responses:
        '200':
          description: Notifications, les plus récentes d'abord.
          content:
            application/json:
              schema:
                type: object
                required: [data, unread_count]
                properties:
                  data:
                    type: array
                    items: { $ref: './commun.yaml#/components/schemas/Notification' }
                  unread_count: { type: integer, minimum: 0 }
                  degraded: { type: boolean }
  /notifications/{id}/read:
    post:
      operationId: marquerNotificationLue
      summary: Marquer une notification comme lue
      parameters:
        - $ref: './commun.yaml#/components/parameters/Identifiant'
      responses:
        '200': { $ref: './commun.yaml#/components/responses/Succes' }
        '404': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/etat:
    get:
      operationId: lireEtatEnvois
      summary: État global des envois (feu de l'en-tête)
      responses:
        '200':
          description: État des envois.
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/EtatEnvois' }
  /envoi/arret-general:
    post:
      operationId: arretGeneral
      summary: Arrêt général — plus aucun message ne part pour l'espace (idempotent)
      description: |
        Arme seulement le drapeau d'arrêt de l'espace (permission `users.manage` :
        propriétaire et administrateur). Un second appel répond 200 sans nouvelle
        écriture. La reprise n'est pas une route : commande locale journalisée
        `envoi:reprendre <espace> --auteur=`.

        Au second appel : aucune nouvelle ligne de journal ; l'alerte est émise comme
        pour la commande ; la pause globale `ServeurEnvoi::pause()` n'est pas utilisée.
        Refus (403) : message « demandez à un administrateur ». Le motif est limité en
        longueur et jamais recopié tel quel dans le journal ni dans l'alerte (T-SOCLE le
        bornera).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motif: { type: string }
      responses:
        '200':
          description: Envois arrêtés.
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/EtatEnvois' }
        '403': { $ref: './commun.yaml#/components/responses/Erreur' }
  /envoi/compteurs:
    get:
      operationId: lireCompteursEnvoi
      summary: Compteurs de l'en-tête et du tableau de bord d'Envoi
      responses:
        '200':
          description: Compteurs du jour.
          content:
            application/json:
              schema: { $ref: './commun.yaml#/components/schemas/CompteursEnvoi' }
