# Axion CRM Pro — stack observabilité auto-hébergée
# ── L'OVERLAY DE PRODUCTION N'EST PAS OPTIONNEL DANS CETTE COMMANDE ─────────
#
# Cette ligne prescrivait la meme commande que ci-dessous, mais SANS
# `docker-compose.prod.yml` -- la forme fautive n'est pas recopiee ici, pour
# qu'on ne puisse pas la reprendre par inadvertance.
#
# Compose repart alors du seul fichier de base, qui PUBLIE Postgres sur 55432 et
# Redis sur 56379 ; voyant une configuration differente de celle des conteneurs
# en place, il les RECREE, ports compris. Ces deux ports ont ete trouves ouverts
# depuis l'exterieur le 2026-08-19, et Redis n'a AUCUN mot de passe.
#
# La garde CI `config-prod` ne rend jamais cette combinaison de fichiers : elle
# ne pouvait donc pas la voir. Constat P6-INFRA-003 (S0), releve par la passe a
# regard neuf -- douzieme chemin vers la meme faille.
#
# Usage, SUR LA PRODUCTION :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#                  -f docker-compose.observability.yml up -d
#
# Sur un poste de developpement, remplacer `prod` par `local`.
# 6 services : Prometheus + Grafana + Loki + Tempo + GlitchTip + Uptime Kuma

# ── PLAFOND DES JOURNAUX DOCKER — constat F39-011 (S1), 2026-08-20 ───────────
#
# Meme ancre que `docker-compose.yml`, REPETEE ici et non partagee : une ancre
# YAML ne franchit pas la frontiere d'un document. Ce fichier declare huit
# services de plus, et ils etaient tous sans plafond — dont `promtail`, dont le
# metier est precisement de LIRE des journaux, et `glitchtip`, qui empile des
# traces d'erreur.
#
# 8 x 50 Mio = 400 Mio de plafond cumule pour cette pile, qui ne bouge plus.
#
# ⚠️ Si un service est ajoute ici sans `logging: *journal`, la garde
# `backend/tests/Feature/Infra/BorneDeCroissanceDuDisqueTest.php` rougit.
x-journal: &journal
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: axion-crm-prometheus
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    ports:
    # 🔴 Lie a la BOUCLE LOCALE — constat P6-INFRA-003 (S0).
    #
    # `- "PORT:PORT"` sans adresse se lie a 0.0.0.0, donc a internet. Et Docker
    # insere ses regles iptables AVANT celles d'ufw : `ufw status` annoncerait
    # « 22/80/443 seulement » pendant que la chaine DOCKER accepterait le monde
    # entier. C'est le mecanisme exact de la faille du 19/08, et la raison pour
    # laquelle le rapport pare-feu de l'etape 0 concluait a tort que tout allait
    # bien.
    #
    # Ces consoles s'atteignent par un tunnel SSH :
    #   ssh -L PORT:127.0.0.1:PORT root@<serveur>
      - "127.0.0.1:9090:9090"
    networks: [axion-crm]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: axion-crm-alertmanager
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    volumes:
      - ./infra/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093"
    networks: [axion-crm]

  grafana:
    image: grafana/grafana:11.3.0
    container_name: axion-crm-grafana
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-axion_grafana_dev}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,redis-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks: [axion-crm]

  loki:
    image: grafana/loki:3.2.0
    container_name: axion-crm-loki
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    networks: [axion-crm]

  promtail:
    image: grafana/promtail:3.2.0
    container_name: axion-crm-promtail
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    volumes:
      - ./infra/monitoring/promtail/promtail.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks: [axion-crm]
    depends_on: [loki]

  tempo:
    image: grafana/tempo:2.6.0
    container_name: axion-crm-tempo
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./infra/monitoring/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "127.0.0.1:3200:3200"
      - "127.0.0.1:4317:4317"  # OTLP gRPC
      - "127.0.0.1:4318:4318"  # OTLP HTTP
    networks: [axion-crm]

  glitchtip:
    image: glitchtip/glitchtip:v4.2
    container_name: axion-crm-glitchtip
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    environment:
      DATABASE_URL: postgres://axion:axion_dev_only@postgres:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-axion-glitchtip-dev-secret}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://glitchtip.localhost
      DEFAULT_FROM_EMAIL: noreply@axion-crm.local
    ports:
      - "127.0.0.1:8080:8080"
    networks: [axion-crm]
    depends_on: [postgres]

  uptime-kuma:
    image: louislam/uptime-kuma:1.23
    container_name: axion-crm-uptime-kuma
    # Plafond F39-011 : 10 Mio x 5 = 50 Mio par conteneur.
    logging: *journal
    volumes:
      - uptime-data:/app/data
    ports:
      - "127.0.0.1:3001:3001"
    networks: [axion-crm]

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  uptime-data:
