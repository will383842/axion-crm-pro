# Axion CRM Pro — overlay production
#
# Usage OBLIGATOIRE (les deux fichiers, dans cet ordre) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ── POURQUOI CET OVERLAY EXISTE, ET CE QU'IL CORRIGE (2026-08-16) ────────────
#
# Il était dans le dépôt depuis l'origine et n'était utilisé NULLE PART : le
# workflow de déploiement lançait `docker compose up` sans `-f`. La production
# tournait donc sur la cible `dev`, avec le montage bind du dépôt du serveur.
#
# 🔴 Conséquence mesurée le 2026-08-16 : `/opt/axion-crm-pro/backend/vendor`
# datait du **17 mai** et le déploiement ne contient AUCUN `composer install`.
# Le montage masquait le `vendor` de l'image. `composer.lock` annonçait
# `predis v3.5.1`, la production exécutait `v2.4.1` — trois mois de mises à
# jour PHP, correctifs de sécurité compris, jamais installés.
#
# Le piège était silencieux DANS LES DEUX SENS : une PR utilisant une API
# récente passait la CI (qui fait `composer install`) et aurait cassé en
# production.
#
# ── 🔴 POURQUOI `!override` ET PAS SIMPLEMENT UNE LISTE ──────────────────────
#
# Docker Compose FUSIONNE les listes `volumes` entre fichiers, il ne les
# remplace pas. Le `volumes: []` d'origine était donc un NO-OP : le montage bind
# de `docker-compose.yml` survivait. Cet overlay ne pouvait pas fonctionner,
# même une fois branché.
#
# Constaté en production le 2026-08-16, APRÈS la première bascule : le conteneur
# portait le nouvel entrypoint ET le nouveau volume — donc l'overlay était bien
# appliqué — mais aussi, toujours, `bind /opt/axion-crm-pro/backend`. Le
# `vendor` du 17 mai continuait de masquer celui de l'image.
#
# `!override` remplace la valeur au lieu de la fusionner. Vérifiable sans
# déployer, et à vérifier avant tout déploiement :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config
#
# ⚠️ Sous Windows le séparateur de `COMPOSE_FILE` est `;`, sous Linux `:`.
# Le workflow tourne sur Linux : `:` y est correct.
services:
  api:
    build:
      target: prod
    restart: unless-stopped
    # Retire le montage bind hérité de docker-compose.yml. Le code exécuté est
    # celui de l'image, avec son `vendor` construit par `composer install
    # --no-dev` à l'étape `composer-deps`.
    volumes: !override
      - api-storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
    healthcheck:
      # 🔴 Plus de contrôle HTTP — constat A-010 (S0).
      #
      # Ce service ne sert plus HTTP : il parle FastCGI. `curl
      # http://localhost/up` échouerait TOUJOURS, le conteneur serait déclaré
      # malsain en permanence et le déploiement le redémarrerait en boucle.
      # On interroge php-fpm sur son point de vie, dans sa langue.
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET
          cgi-fcgi -bind -connect 127.0.0.1:9000 2>/dev/null | grep -q pong || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  horizon:
    build:
      target: prod
    restart: unless-stopped
    volumes: !override
      - api-storage:/var/www/html/storage
    # 🔴 Le HEALTHCHECK de l'image `prod` est `curl http://localhost/up` — il
    # convient a l'API, pas a un consommateur de files : `php artisan horizon`
    # n'ouvre AUCUN port HTTP. En basculant ce service sur la cible `prod`
    # (2026-08-16), il a herite de ce controle et est devenu `unhealthy` EN
    # PERMANENCE. Verifie en production le meme jour.
    # On teste ce que ce service fait vraiment : Horizon est-il en marche ?
    healthcheck:
      test: ['CMD-SHELL', 'php artisan horizon:status | grep -q running || exit 1']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      target: prod
    restart: unless-stopped
    volumes: !override
      - api-storage:/var/www/html/storage
    # Meme cause que `horizon` : `schedule:work` ne sert pas de HTTP. Il n'y a
    # pas de commande fiable pour interroger son etat, donc on RETIRE le
    # controle plutot que d'en garder un qui ment. Un controle absent est
    # honnete ; un controle qui rougit toujours apprend a ignorer les rouges.
    healthcheck:
      disable: true

  app:
    build:
      target: prod
      args:
        # Arme la garde `VITE_API_BASE_URL` de `vite.config.ts` : ce bundle-ci
        # est SERVI, une base d'API locale doit faire rougir le build et non
        # se découvrir dans le navigateur.
        VITE_BUILD_CIBLE: prod
    restart: unless-stopped
    volumes: !override []

  # `reverb` n'est PAS démarré par le déploiement (il est volontairement absent
  # de la liste `docker compose up -d … api app horizon scheduler` : Echo est
  # désactivé côté frontend et le Caddyfile n'a aucune route WebSocket). Mais
  # `docker-compose.yml` publie son port 8080 : le jour où quelqu'un le
  # démarrerait « pour voir », il rouvrirait un port sur `0.0.0.0`. On ferme le
  # piège maintenant, tant qu'il ne coûte rien.
  reverb:
    ports: !override []

  # 🔴 `postgres` et `redis` n'avaient AUCUNE politique de redemarrage, alors
  # que les quatre services applicatifs en ont une. Apres un redemarrage du
  # serveur ou du demon Docker, l'API, le frontend, Horizon et le scheduler se
  # relevaient donc SANS leur base ni leur Redis — et bouclaient sur une base
  # absente. Les conteneurs qui redemarrent masquaient la cause.
  postgres:
    restart: unless-stopped
    # 🔴 CORRECTIF DE SÉCURITÉ — 2026-08-19, faille MESURÉE, pas supposée.
    #
    # `docker-compose.yml` publie `55432:5432`. Sur le serveur de production,
    # cela ouvre le port sur `0.0.0.0` — et Docker insère ses règles dans
    # iptables AVANT celles d'`ufw`. Résultat : `ufw status` annonce « seuls
    # 22/80/443 », et la chaîne DOCKER accepte pourtant
    # `0.0.0.0/0 -> 172.18.0.4:5432`. Le pare-feu dit une chose, la machine en
    # fait une autre.
    #
    # Aggravant : le mot de passe `POSTGRES_PASSWORD: axion_dev_only` est écrit
    # en clair dans `docker-compose.yml`, dans un dépôt PUBLIC.
    #
    # Preuve rejouée depuis un poste extérieur, par internet, le 2026-08-19 :
    #   psql -h <ip-prod> -p 55432 -U axion -d axion_crm -c "select count(*) from companies"
    #   -> 4 295 349
    # Connexion SUPERUTILISATEUR, lecture ET écriture, sur les données
    # personnelles de 4,29 M de fiches.
    #
    # La production n'a AUCUN besoin de ce port publié : l'API, Horizon et le
    # scheduler joignent Postgres par le réseau Docker (`postgres:5432`). Le
    # port n'existait que pour le confort du poste de développement.
    #
    # `!override` et non `ports: []` : Compose FUSIONNE les listes entre
    # fichiers, il ne les remplace pas. Sans le tag, la publication de
    # `docker-compose.yml` survivrait — c'est exactement le piège qui avait
    # rendu l'overlay inopérant sur `volumes` en août (voir en-tête de ce
    # fichier). Garde : job CI `config-prod` (`.github/workflows/ci.yml`).
    ports: !override []

  redis:
    restart: unless-stopped
    # Même faille, même correctif — et Redis, lui, n'a AUCUN mot de passe
    # (`docker-compose.yml` ne pose pas `requirepass`). Le port 56379 était donc
    # une console d'administration anonyme sur le cache et les sessions :
    # `FLUSHALL`, lecture des jetons, `CONFIG SET` — vérifié ouvert depuis
    # l'extérieur le 2026-08-19.
    ports: !override []

  # 🔴 AJOUTÉ le 2026-08-19 avec la préproduction — et ce n'est PAS un détail.
  #
  # Le Caddy de production sert aussi les deux noms `staging.*` (cf.
  # `infra/caddy/Caddyfile`). Il doit donc joindre la pile de préproduction, qui
  # publie ses services sur la BOUCLE LOCALE de l'hôte (`127.0.0.1:8081` et
  # `127.0.0.1:8082`) — et non sur un réseau Docker partagé, ce qui rendrait le
  # nom `api` ambigu pour ce conteneur et le routage de la PRODUCTION
  # indéterminé (Compose ajoute toujours le nom du service comme alias réseau,
  # on ne peut pas le retirer).
  #
  # `host-gateway` fait pointer `host.docker.internal` vers l'hôte. Sans cette
  # ligne, `staging.axion-crm-pro.com` répondrait 502 — et Caddy démarrerait
  # quand même : un `reverse_proxy` vers un hôte inconnu n'est pas une erreur de
  # configuration, `caddy validate` ne l'attrape pas.
  #
  # ⚠️ `extra_hosts` ne s'applique qu'à la CRÉATION du conteneur. Comme
  # `deploy-direct-ssh.yml` ne recrée que `api app horizon scheduler`, ce
  # réglage n'atteindra JAMAIS la production par un déploiement : il faut un
  # `up -d --force-recreate --no-deps caddy` explicite, une fois. C'est le même
  # piège que celui qui a laissé Postgres publié malgré un correctif déployé
  # (journal §7).
  caddy:
    extra_hosts:
      - 'host.docker.internal:host-gateway'

volumes:
  # `storage/` est le seul dossier que l'application ÉCRIT. Sans ce volume, les
  # journaux et le lien `storage:link` disparaîtraient à chaque recréation de
  # conteneur. Partagé entre api, horizon et scheduler : ils écrivent dans le
  # même journal, comme aujourd'hui.
  #
  # ⚠️ `storage/logs` pesait **968 Mo** sur le serveur au 2026-08-16, jamais
  # tourné (`LOG_CHANNEL=stack`, `LOG_LEVEL=debug`). Le volume ne règle pas ça —
  # la rotation reste à traiter, séparément.
  api-storage:
