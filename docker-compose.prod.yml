# Axion CRM Pro — overlay production
#
# Usage OBLIGATOIRE (les deux fichiers, dans cet ordre) :
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# ── POURQUOI CET OVERLAY EXISTE, ET CE QU'IL CORRIGE (2026-08-16) ────────────
#
# Il était dans le dépôt depuis l'origine et n'était utilisé NULLE PART : le
# workflow de déploiement lançait `docker compose up` sans `-f`. La production
# tournait donc sur la cible `dev`, avec le montage bind du dépôt du serveur.
#
# 🔴 Conséquence mesurée le 2026-08-16 : `/opt/axion-crm-pro/backend/vendor`
# datait du **17 mai** et le déploiement ne contient AUCUN `composer install`.
# Le montage masquait le `vendor` de l'image. `composer.lock` annonçait
# `predis v3.5.1`, la production exécutait `v2.4.1` — trois mois de mises à
# jour PHP, correctifs de sécurité compris, jamais installés.
#
# Le piège était silencieux DANS LES DEUX SENS : une PR utilisant une API
# récente passait la CI (qui fait `composer install`) et aurait cassé en
# production.
#
# ── 🔴 POURQUOI `!override` ET PAS SIMPLEMENT UNE LISTE ──────────────────────
#
# Docker Compose FUSIONNE les listes `volumes` entre fichiers, il ne les
# remplace pas. Le `volumes: []` d'origine était donc un NO-OP : le montage bind
# de `docker-compose.yml` survivait. Cet overlay ne pouvait pas fonctionner,
# même une fois branché.
#
# Constaté en production le 2026-08-16, APRÈS la première bascule : le conteneur
# portait le nouvel entrypoint ET le nouveau volume — donc l'overlay était bien
# appliqué — mais aussi, toujours, `bind /opt/axion-crm-pro/backend`. Le
# `vendor` du 17 mai continuait de masquer celui de l'image.
#
# `!override` remplace la valeur au lieu de la fusionner. Vérifiable sans
# déployer, et à vérifier avant tout déploiement :
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config
#
# ⚠️ Sous Windows le séparateur de `COMPOSE_FILE` est `;`, sous Linux `:`.
# Le workflow tourne sur Linux : `:` y est correct.
services:
  api:
    build:
      target: prod
    restart: unless-stopped
    # Retire le montage bind hérité de docker-compose.yml. Le code exécuté est
    # celui de l'image, avec son `vendor` construit par `composer install
    # --no-dev` à l'étape `composer-deps`.
    volumes: !override
      - api-storage:/var/www/html/storage
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost/up || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  horizon:
    build:
      target: prod
    restart: unless-stopped
    volumes: !override
      - api-storage:/var/www/html/storage
    # 🔴 Le HEALTHCHECK de l'image `prod` est `curl http://localhost/up` — il
    # convient a l'API, pas a un consommateur de files : `php artisan horizon`
    # n'ouvre AUCUN port HTTP. En basculant ce service sur la cible `prod`
    # (2026-08-16), il a herite de ce controle et est devenu `unhealthy` EN
    # PERMANENCE. Verifie en production le meme jour.
    # On teste ce que ce service fait vraiment : Horizon est-il en marche ?
    healthcheck:
      test: ['CMD-SHELL', 'php artisan horizon:status | grep -q running || exit 1']
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  scheduler:
    build:
      target: prod
    restart: unless-stopped
    volumes: !override
      - api-storage:/var/www/html/storage
    # Meme cause que `horizon` : `schedule:work` ne sert pas de HTTP. Il n'y a
    # pas de commande fiable pour interroger son etat, donc on RETIRE le
    # controle plutot que d'en garder un qui ment. Un controle absent est
    # honnete ; un controle qui rougit toujours apprend a ignorer les rouges.
    healthcheck:
      disable: true

  app:
    build:
      target: prod
      args:
        # Arme la garde `VITE_API_BASE_URL` de `vite.config.ts` : ce bundle-ci
        # est SERVI, une base d'API locale doit faire rougir le build et non
        # se découvrir dans le navigateur.
        VITE_BUILD_CIBLE: prod
    restart: unless-stopped
    volumes: !override []

  # 🔴 `postgres` et `redis` n'avaient AUCUNE politique de redemarrage, alors
  # que les quatre services applicatifs en ont une. Apres un redemarrage du
  # serveur ou du demon Docker, l'API, le frontend, Horizon et le scheduler se
  # relevaient donc SANS leur base ni leur Redis — et bouclaient sur une base
  # absente. Les conteneurs qui redemarrent masquaient la cause.
  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  # `storage/` est le seul dossier que l'application ÉCRIT. Sans ce volume, les
  # journaux et le lien `storage:link` disparaîtraient à chaque recréation de
  # conteneur. Partagé entre api, horizon et scheduler : ils écrivent dans le
  # même journal, comme aujourd'hui.
  #
  # ⚠️ `storage/logs` pesait **968 Mo** sur le serveur au 2026-08-16, jamais
  # tourné (`LOG_CHANNEL=stack`, `LOG_LEVEL=debug`). Le volume ne règle pas ça —
  # la rotation reste à traiter, séparément.
  api-storage:
