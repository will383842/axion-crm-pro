# PILE DE VERIFICATION — montee le 2026-08-23, ENTIEREMENT separee de la pile
# locale historique.
#
# POURQUOI. `docker inspect axion-crm-api` rend
# `project.config_files = Axion-CRM-Pro/docker-compose.yml`, dont le service
# `api` monte `./backend` : la pile locale sert donc la copie que le mandat de
# l'audit 360 INTERDIT de toucher, figee sur `audit/360-p1-p2`, qui ne porte
# AUCUN des 91 correctifs de la vague 2. Ouvrir les 39 ecrans dessus
# reviendrait a auditer un produit d'avant le travail.
#
# ON NE REBRANCHE PAS LA PILE HISTORIQUE. Ses `container_name` sont FIXES : un
# `up -f docker-compose.yml` depuis ce worktree reprendrait les MEMES
# conteneurs, dont `axion-crm-postgres` — qui heberge `axion_crm_test`, la base
# du banc de tests — et `axion-crm-caddy`, qui sert en ce moment le frontend a
# d'autres sessions. Ce serait casser le travail des autres pour faire le sien.
#
# CE FICHIER NE PARTAGE RIEN AVEC ELLE : conteneurs `crmverif-*`, reseau
# `axion-crm-verif`, volumes prefixes par le projet `crmverif`, ports
# 8080/8443/55433/56380. Aucun conteneur en marche n'est touche.
#
# USAGE :
#   docker compose -p crmverif -f docker-compose.verif.yml up -d
#   docker compose -p crmverif -f docker-compose.verif.yml down     (sans -v : les donnees restent)

x-journal: &journal
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    image: ${POSTGRES_IMAGE:-ghcr.io/will383842/axion-crm-pro-postgres:16-3.5-vector-partman}
    container_name: crmverif-postgres
    logging: *journal
    environment:
      POSTGRES_DB: axion_crm
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: axion_dev_only
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # 127.0.0.1 EXPLICITE. Le constat du 19/08 est ne d'un `55432:5432` nu,
      # qui publie sur 0.0.0.0 et passe DEVANT les regles ufw.
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [axion-crm-verif]

  redis:
    image: redis:7.2-alpine
    container_name: crmverif-redis
    logging: *journal
    command: >
      redis-server --appendonly yes --save 60 1000
      --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:56380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [axion-crm-verif]

  api:
    # 🔴 CONSTRUITE DEPUIS CE WORKTREE, et surtout PAS reprise telle quelle.
    #
    # Mesure du 2026-08-23 : l'image `axion-crm-pro-api:latest` deja presente
    # sur cette machine demarre `php -S 0.0.0.0:80` — le serveur de
    # DEVELOPPEMENT de PHP, un processus, une requete a la fois. C'est l'etat
    # d'AVANT le correctif A-010 (S0), qui a fait passer l'API a php-fpm sur
    # 9000. L'image est donc perimee exactement comme l'etait le Caddy vivant :
    # la reprendre aurait mesure le produit d'avant l'audit, en croyant mesurer
    # celui d'apres.
    build:
      context: .
      dockerfile: Dockerfile.laravel
      target: dev
    image: crmverif-api:latest
    container_name: crmverif-api
    logging: *journal
    env_file: .env
    environment:
      APP_URL: https://verif.localhost:8443
      APP_ENV: local
      APP_DEBUG: "true"
      # Le `.env` du worktree porte `APP_KEY=` VIDE — le banc, lui, la recoit
      # de `phpunit.xml`. Une application qui tourne en a besoin : sans elle,
      # aucune session, aucun cookie chiffre, donc aucune connexion possible.
      APP_KEY: base64:V2VyaWZpY2F0aW9uTG9jYWxlQXVkaXQzNjBLZXkxMjM0NTY3OD0=
      DB_HOST: postgres
      REDIS_HOST: redis
      # Le port fait partie de l'origine : le domaine « apatride » de Sanctum
      # doit le porter, sinon la session n'est jamais reconnue.
      SANCTUM_STATEFUL_DOMAINS: verif.localhost:8443,verif.localhost
      SESSION_DOMAIN: ""
      # V7 leve : sans ce drapeau, `EnsureCrmConsoleV2` rend 404 sur tout
      # `/v1/crm/*` et quatre des 39 ecrans sont inatteignables meme connecte.
      CRM_CONSOLE_V2_ENABLED: "true"
    volumes:
      - ./backend:/var/www/html:cached
      # `backend/vendor` est VIDE dans ce worktree ; le banc `a35r` monte deja
      # celui de la copie principale. Mesure du 2026-08-23 avant de faire de
      # meme : les deux `composer.lock` portent le MEME `content-hash`
      # (19d5daef…) et les MEMES 186 paquets aux memes versions — seule la fin
      # de ligne differe. Ce n'est donc pas une autre dependance, c'est la meme.
      - ../Axion-CRM-Pro/backend/vendor:/var/www/html/vendor
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [axion-crm-verif]

  app:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: prod
      args:
        # ORIGINE NUE, sans `/api` : le client SPA ajoute lui-meme `/api/v1`.
        VITE_API_BASE_URL: https://verif.localhost:8443
    image: crmverif-app:latest
    container_name: crmverif-app
    logging: *journal
    networks: [axion-crm-verif]

  caddy:
    image: caddy:2-alpine
    container_name: crmverif-caddy
    logging: *journal
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./infra/caddy/Caddyfile.verif:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, app]
    networks: [axion-crm-verif]

networks:
  axion-crm-verif:
    name: axion-crm-verif
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
