# Axion CRM Pro — orchestration locale (mode mocks par défaut)
# Démarrage : `docker compose up -d`
# Reverse proxy Caddy expose https://api.localhost + https://app.localhost
# (certificat local auto Caddy ; ajouter au store de confiance via Caddy CA si besoin)

# ── PLAFOND DES JOURNAUX DOCKER — constat F39-011 (S1), 2026-08-20 ───────────
#
# 🔴 CE DÉPÔT NE PORTAIT AUCUNE DIRECTIVE `logging:`, DANS AUCUN DE SES SEPT
# FICHIERS COMPOSE. Le pilote par défaut de Docker est `json-file`, et son
# défaut est **illimité** : `/var/lib/docker/containers/<id>/<id>-json.log`
# grossit jusqu'à ce que le disque soit plein. `infra/scripts/setup-hetzner-cpx22.sh`
# installe Docker par `get.docker.com` et n'écrit AUCUN `/etc/docker/daemon.json` :
# il n'y avait donc pas non plus de plafond côté démon.
#
# Mesuré le 2026-08-20, sur un conteneur créé À L'INSTANT depuis ce fichier-ci
# fusionné avec `docker-compose.prod.yml` :
#
#   $ docker compose -p a35mesure -f docker-compose.yml -f docker-compose.prod.yml \
#         -f <overlay jetable> up -d --no-deps redis
#   $ docker inspect --format '{{json .HostConfig.LogConfig}}' a35-mesure-journal-redis
#   {"Type":"json-file","Config":{}}
#
# `Config` VIDE : ni `max-size`, ni `max-file`. Les trois conteneurs de la pile
# locale (`axion-crm-app`, `axion-crm-caddy`, `axion-crm-postgres`) rendaient
# exactement la même chose.
#
# ⚠️ AGGRAVANT, ET C'EST LE MÊME TEXTE COMPTÉ DEUX FOIS : `config/logging.php`
# envoie la pile de journaux sur `stderr` à `LOG_LEVEL=debug`. Chaque ligne
# écrite par l'application atterrit donc ICI, en plus du fichier.
#
# ── POURQUOI DANS LE FICHIER DE BASE, ET PAS DANS L'OVERLAY DE PRODUCTION ────
#
# Le constat F38-007 a dénombré **douze** chemins qui lancent `docker compose up`
# sans `docker-compose.prod.yml` (workflows, scripts, runbooks, un en-tête de
# fichier Compose). Un plafond posé dans le seul overlay laisserait chacun de ces
# douze chemins recréer des conteneurs sans borne. Il est donc ici, dans le
# fichier que TOUTES les invocations lisent.
#
# ── LE CHIFFRE ──────────────────────────────────────────────────────────────
#
# 10 Mio × 5 fichiers = **50 Mio par conteneur**, 8 services = **400 Mio de
# plafond CUMULÉ**, et ce total ne bouge plus jamais. À comparer aux 511 Mio de
# croissance QUOTIDIENNE du constat.
#
# ⚠️ C'est un plafond, pas une fenêtre de temps : sur un service bavard, 50 Mio
# peuvent ne représenter que quelques heures. La trace longue se lit dans
# `storage/logs/laravel-AAAA-MM-JJ.log` (canal `daily`, 14 jours) — et, le jour
# où la pile d'observabilité sera vraiment branchée, dans Loki.
#
# ── ⚠️ ATTEINDRE LA PRODUCTION : DEUX SERVICES NE SERONT PAS SERVIS ─────────
#
# Le plafond est appliqué à la CRÉATION du conteneur. `deploy-direct-ssh.yml`
# recrée `api app horizon scheduler` (`--force-recreate`) puis `postgres redis`
# (`up -d --no-deps`, qui recrée dès que la configuration fusionnée change) :
# ces six-là recevront le plafond au prochain déploiement, tout seuls.
#
# **`caddy` et `reverb` ne figurent dans AUCUNE de ces deux listes.** Ils
# garderont donc leur journal sans plafond indéfiniment. `reverb` est à l'arrêt
# depuis des semaines et ne coûte rien ; `caddy`, lui, tourne — c'est la porte
# d'entrée du site. Il faut un geste explicite, UNE fois :
#
#   cd /opt/axion-crm-pro
#   export COMPOSE_FILE="docker-compose.yml:docker-compose.prod.yml"
#   docker compose up -d --no-deps caddy
#   docker inspect --format '{{json .HostConfig.LogConfig}}' axion-crm-caddy
#   # attendu : {"Type":"json-file","Config":{"max-file":"5","max-size":"10m"}}
#
# C'est exactement le piège déjà consigné pour `extra_hosts` sur `caddy` dans
# `docker-compose.prod.yml` : un réglage juste dans le fichier, et un conteneur
# que le déploiement ne touche jamais. Le fichier a raison, la machine a tort.
#
# Garde : `backend/tests/Feature/Infra/BorneDeCroissanceDuDisqueTest.php`, qui
# calcule le plafond sur la configuration FUSIONNÉE (base + overlay) — parce que
# Compose fusionne, et que lire un seul fichier ment. Ce dépôt a déjà payé ce
# piège deux fois, sur `volumes` puis sur `ports`.
#
# ⚠️ La garde mesure le FICHIER. Elle ne peut pas voir un conteneur de
# production : elle ne remplace donc pas le `docker inspect` ci-dessus.
x-journal: &journal
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

services:
  postgres:
    # Sprint 19.3 : image custom GHCR (pgvector + pg_partman + postgis), fallback build local
    image: ${POSTGRES_IMAGE:-ghcr.io/will383842/axion-crm-pro-postgres:16-3.5-vector-partman}
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: axion-crm-postgres
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    # 🔴 JOURNALISATION DES CONNEXIONS — mesure n° 7 du registre des
    # violations de données (`_REPORTS/REGISTRE-DES-VIOLATIONS-DE-DONNEES.md`),
    # identifiée le 2026-08-19 et restée non réalisée.
    #
    # POURQUOI CETTE LIGNE EXISTE. La base a été joignable depuis internet
    # pendant 94 jours, avec un mot de passe publié en clair dans un dépôt
    # public. Au moment de décider s'il fallait notifier la CNIL, la seule
    # phrase qu'on a pu écrire est celle-ci, et elle est dans le registre :
    #
    #   « Il n'est pas possible de démontrer qu'aucun accès non autorisé n'a
    #     eu lieu : les journaux de connexion de PostgreSQL n'étaient pas
    #     conservés. L'absence d'effet constaté n'est donc pas une preuve
    #     d'absence d'accès. »
    #
    # Sans ces trois réglages, le prochain incident se soldera par la MÊME
    # phrase. Ce n'est pas de l'observabilité de confort : c'est ce qui rend
    # une violation ANALYSABLE, donc ce qui rend l'article 33 tenable.
    #
    # ⚠️ DANS LE FICHIER DE BASE, PAS DANS L'OVERLAY DE PRODUCTION, et c'est
    # délibéré. Le constat F38-007 a dénombré DOUZE chemins qui lancent
    # `docker compose up` sans `docker-compose.prod.yml`. Un réglage posé dans
    # le seul overlay laisserait chacun de ces douze chemins recréer un Postgres
    # muet — exactement le piège déjà payé sur la publication des ports.
    #
    # `%h` est le champ qui compte : l'ADRESSE D'OU VIENT LA CONNEXION. Sans
    # lui, on saurait qu'il y a eu des connexions sans pouvoir dire d'ou.
    #
    # Le coût est borné : une ligne par ouverture et une par fermeture, sous le
    # plafond de journal ci-dessus (50 Mio par conteneur). L'application passe
    # par un pool : ce n'est pas une ligne par requête.
    #
    # VÉRIFIER LE CONTENEUR QUI TOURNE, JAMAIS LE FICHIER :
    #   bash infra/scripts/verifier-journalisation-connexions-db.sh
    # Le registre garde la trace de pourquoi cette distinction n'est pas
    # théorique — un correctif fusionné ET déployé avec succès n'avait rien
    # fermé, parce qu'un déploiement ne recrée pas les conteneurs de base.
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] %q%u@%d de %h "
    environment:
      POSTGRES_DB: axion_crm
      POSTGRES_USER: axion
      POSTGRES_PASSWORD: axion_dev_only
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axion -d axion_crm"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - axion-crm

  redis:
    image: redis:7.2-alpine
    container_name: axion-crm-redis
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - axion-crm

  api:
    build:
      context: .
      dockerfile: Dockerfile.laravel
      target: dev
    container_name: axion-crm-api
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    env_file: .env
    environment:
      # 🔴 `${APP_URL:-…}` ET NON UNE VALEUR EN DUR.
      #
      # `environment:` l'emporte sur `env_file:`. Écrite en dur, cette ligne
      # rendait le `.env` du serveur INOPÉRANT pour cette clé : la production
      # tournait avec `APP_URL=https://api.localhost`, quoi qu'on y mette.
      # Mesuré le 2026-08-16 :
      #
      #   API      : APP_URL = https://api.localhost
      #   horizon  : APP_URL = https://api.axion-crm-pro.com
      #   .env     : APP_URL = https://api.axion-crm-pro.com
      #
      # `horizon` et `scheduler` n'ont pas cette ligne — ils lisaient donc la
      # bonne valeur. **Le même code produisait deux URLs différentes** selon
      # qu'il tournait dans l'API ou dans un job : liens de réinitialisation de
      # mot de passe, URLs signées, `route()` absolus, hôte de la doc Swagger.
      #
      # La forme `${VAR:-défaut}` est interpolée par Compose, qui lit le `.env`
      # du répertoire de projet : le `.env` gagne, et le défaut ne sert que
      # quand la clé est absente — c'est-à-dire en développement.
      APP_URL: ${APP_URL:-https://api.localhost}
      # Ces deux-là restent en dur À DESSEIN : ce sont les noms de services du
      # réseau Docker, ils DOIVENT écraser le `.env` (qui porte `localhost`
      # pour un usage hors conteneur).
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axion-crm

  horizon:
    build:
      context: .
      dockerfile: Dockerfile.laravel
      target: dev
    container_name: axion-crm-horizon
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    command: php artisan horizon
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axion-crm

  # Sprint 18.3 — Reverb WebSocket server (broadcasting temps réel)
  reverb:
    build:
      context: .
      dockerfile: Dockerfile.laravel
      target: dev
    container_name: axion-crm-reverb
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      BROADCAST_CONNECTION: reverb
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axion-crm

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.laravel
      target: dev
    container_name: axion-crm-scheduler
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    command: php artisan schedule:work

    # 🔴 B17-002, LA REPARATION A LA RACINE — ET ELLE MANQUAIT AUX QUATRE
    # FICHIERS COMPOSE.
    #
    # Sans `stop_grace_period`, Docker applique SIGTERM puis SIGKILL **au bout
    # de 10 secondes**. Or les deux workflows de deploiement recreent
    # `scheduler` a chaque passage (`--force-recreate`) : une tache planifiee en
    # cours est donc tuee net, et `Event::removeMutex()` — qui n'est appele que
    # depuis `finish()` — ne s'execute jamais. Le verrou reste pose.
    #
    # Le verrou vit dans Redis (`config/cache.php`), et `redis` n'est PAS recree
    # par le deploiement (services nommes) : il SURVIT au processus qu'on vient
    # de tuer. La tache ne repartait donc pas avant l'expiration du TTL —
    # 1 440 minutes, soit 24 h, le defaut de Laravel.
    #
    # Les TTL sont desormais bornes a 360 min dans `routes/console.php`, et
    # l'entrypoint joue `schedule:clear-cache` au demarrage. Ces deux gestes
    # REPARENT apres coup. Celui-ci EVITE : cinq minutes suffisent a la quasi
    # totalite des taches pour finir et retirer proprement leur propre verrou.
    #
    # 300 s et non davantage : au-dela, un deploiement attendrait visiblement.
    # La seule tache qui puisse depasser (`media:link-to-companies`, ensembliste
    # sur 4,3 M de fiches) reste couverte par son TTL de 360 min et par
    # `schedule:clear-cache`.
    stop_grace_period: 300s
    env_file: .env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - ./backend:/var/www/html:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - axion-crm

  app:
    # Sprint 19.6 — passage en mode prod : Caddy 2 sert dist/ sur :5173.
    # Zéro client HMR injecté dans le navigateur, image plus légère.
    # Pour repasser en dev local pur (HMR), set TARGET_FRONTEND=dev.
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: ${TARGET_FRONTEND:-prod}
      args:
        # ⚠️ ORIGINE NUE, sans `/api` : le client SPA ajoute lui-même
        # `/api/v1` (`frontend/src/lib/api.ts`). Le défaut portait le suffixe
        # → il aurait fabriqué `/api/api/v1`. Il ne mordait pas parce que la
        # variable est définie sur le serveur — une mine, pas un bug actif.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-https://app.axion-crm-pro.com}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
    container_name: axion-crm-app
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    restart: unless-stopped
    networks:
      - axion-crm

  # Workers Playwright (google-maps / pages-jaunes / google-search) RETIRÉS le
  # 2026-08-14 (lot L3, décision 1 de l'audit scraping, actée par Will) :
  # conteneurs fantômes — leurs résultats n'étaient jamais ingérés (le
  # récepteur /internal/scraper-result ne faisait que logger). Le CODE est
  # conservé (workers/) et le job CI `workers` continue de le tester sur
  # runner GitHub. Réactivation = redéclarer les services ici + compose up.
  caddy:
    image: caddy:2-alpine
    container_name: axion-crm-caddy
    # Plafond du journal Docker — constat F39-011. Voir l ancre `x-journal`
    # en tete de fichier : 10 Mio x 5 = 50 Mio par conteneur, jamais plus.
    logging: *journal
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - app
    networks:
      - axion-crm

networks:
  axion-crm:
    name: axion-crm
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
  frontend-node-modules:
