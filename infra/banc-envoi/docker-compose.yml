# Banc d'envoi K10 — AUCUN envoi réel : réseau internal (pas de sortie Internet), aucun port publié.
# Place réservée : service `simulateur` puis `kumomta` (lots suivants), sur le même réseau.
name: banc-envoi
x-banc: &banc
  image: python:3.12-alpine@sha256:e064671ca452259bab50e8e2c7bd896e39e9a343bb06ca25234adf6fe18d0fc7
  working_dir: /app
  volumes: ["./services:/app:ro"]
  user: "0"
  read_only: true
  cap_drop: [ALL]
  cap_add: [NET_BIND_SERVICE]
  networks: [banc]
  restart: "no"
services:
  dns-banc:
    <<: *banc
    command: python dns_banc.py
    environment: { IP_REPONSE: "10.99.0.10" }
    networks: { banc: { ipv4_address: 10.99.0.2 } }
  puits-accepte:
    <<: *banc
    dns: [10.99.0.2]  # résolveur du banc (dns-banc)
    command: python puits_smtp.py
    environment: { MODE: accepte, COMPTEUR_URL: "http://compteur:8080" }
    networks: { banc: { ipv4_address: 10.99.0.10 } }
  puits-4xx:
    <<: *banc
    dns: [10.99.0.2]  # résolveur du banc (dns-banc)
    command: python puits_smtp.py
    environment: { MODE: 4xx, COMPTEUR_URL: "http://compteur:8080" }
  puits-5xx:
    <<: *banc
    dns: [10.99.0.2]  # résolveur du banc (dns-banc)
    command: python puits_smtp.py
    environment: { MODE: 5xx, COMPTEUR_URL: "http://compteur:8080" }
  puits-lent:
    <<: *banc
    dns: [10.99.0.2]  # résolveur du banc (dns-banc)
    command: python puits_smtp.py
    environment: { MODE: lent, COMPTEUR_URL: "http://compteur:8080" }
  imap-banc:  # SMTP (25, mode accepte) + IMAP (143) dans le MÊME processus, sur un Banc partagé
    <<: *banc
    command: python imap_banc.py
    environment:  # fournis par demarrer-banc.sh, jamais écrits dans le dépôt
      BANC_SECRET: "${BANC_SECRET:-}"
      BANC_TEMOIN_GMAIL: "${BANC_TEMOIN_GMAIL:-}"
      BANC_TEMOIN_GOOGLE_WORKSPACE: "${BANC_TEMOIN_GOOGLE_WORKSPACE:-}"
      BANC_TEMOIN_OUTLOOK_COM: "${BANC_TEMOIN_OUTLOOK_COM:-}"
      BANC_TEMOIN_MICROSOFT_365: "${BANC_TEMOIN_MICROSOFT_365:-}"
      BANC_TEMOIN_YAHOO: "${BANC_TEMOIN_YAHOO:-}"
      BANC_TEMOIN_ORANGE: "${BANC_TEMOIN_ORANGE:-}"
  compteur:
    <<: *banc
    command: python compteur.py
  # sonde / imap-banc / compteur : pas de `dns:` volontaire. Les noms de service passent par le DNS
  # embarqué de Docker ; la sonde doit voir banc-sortie.invalid échouer sans l'aide de dns-banc
  # (qui répond A à tout nom), sinon elle mesurerait le banc et non l'isolement.
  temoin-hors-banc:
    <<: *banc
    command: python temoin.py
    networks: { hors-banc: { ipv4_address: 10.98.0.10 } }
  sonde-temoin:
    <<: *banc
    command: python sonde.py --temoin
    networks: [hors-banc]
    profiles: [sonde]
    depends_on: [temoin-hors-banc]
  sonde:
    <<: *banc
    command: python sonde.py
    profiles: [sonde]
    depends_on: [compteur]
networks:
  hors-banc:
    internal: true
    ipam: { config: [{ subnet: 10.98.0.0/24 }] }
  banc:
    internal: true
    ipam: { config: [{ subnet: 10.99.0.0/24, ip_range: 10.99.0.128/25 }] }  # auto-attribution hors des IP fixes (.2, .10)
