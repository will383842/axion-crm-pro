; =============================================================================
; Pool php-fpm d'Axion CRM Pro — constat A-010 de l'audit 360 (S0).
; =============================================================================
;
; POURQUOI CE FICHIER EXISTE.
;
; L'API était servie par `php -S`, le serveur web intégré de PHP en ligne de
; commande, en UN SEUL processus. Douze requêtes simultanées produisaient un
; escalier parfait : la douzième attendait les onze autres. Une seule requête
; lente gelait donc l'application entière, pour tout le monde.
;
; L'image est pourtant bâtie sur `php:8.3-fpm-alpine` : php-fpm était déjà là,
; à `/usr/local/sbin/php-fpm`. Il n'a jamais été démarré.
;
; MAIS BASCULER SUR php-fpm NE SUFFIT PAS, ET C'EST TOUT L'OBJET DE CE FICHIER.
;
; Le réglage d'usine de l'image Docker officielle est `pm.max_children = 5`.
; Mesuré sur banc isolé le 2026-08-19, douze requêtes simultanées sur un script
; de 50 ms :
;
;   php -S, un processus ............ 0,054 → 0,562 s   escalier, pas ≈ 47 ms
;   php-fpm, réglage d'usine ........ 0,080 → 0,316 s   encore un gradient
;   php-fpm, ce fichier ............. 0,099 → 0,190 s   plat
;
; Le réglage d'usine aurait donc plafonné la concurrence à CINQ requêtes, quand
; le principe directeur 8 du cahier des charges demande « dix utilisateurs dès
; le premier jour ». On aurait remplacé une file d'attente par une file
; d'attente plus courte, et le contrôle serait passé au vert.

[www]

; `dynamic` et non `static` : la production tourne sur une machine partagée avec
; Postgres, Redis, Horizon et le planificateur. Un pool statique réserverait la
; mémoire en permanence, y compris la nuit, quand personne n'utilise le produit.
pm = dynamic

; Combien de requêtes PHP simultanées la machine accepte de traiter.
;
; Dimensionnement : chaque enfant tient environ 64 Mo pour cette application
; (Laravel 12, opcache actif, pas d'image en mémoire). Seize enfants ≈ 1 Go au
; pire, ce que la machine de production absorbe sans toucher au swap.
;
; La variable d'environnement permet de corriger sans reconstruire l'image —
; mais le DÉFAUT doit rester au-dessus de dix, sinon le cahier des charges est
; violé dès qu'on oublie de la poser. Une garde le vérifie
; (`tests/Feature/Infra/ServeurHttpDeProductionTest.php`).
pm.max_children = ${PHP_FPM_MAX_CHILDREN:-16}

; Quatre enfants prêts au démarrage : la première rafale de la journée ne paie
; pas le coût de création des processus.
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 8

; Recycler un enfant toutes les 500 requêtes borne les fuites de mémoire des
; extensions tierces. Coût négligeable, filet utile sur un service qui tourne
; des semaines sans redémarrage.
pm.max_requests = 500

; POINT DE VIE — indispensable au contrôle de santé du conteneur.
;
; L'ancien contrôle était `curl http://localhost/up`. Il n'a plus de sens : le
; conteneur ne sert plus HTTP, il parle FastCGI. Sans ce point, Docker
; déclarerait le conteneur malsain en permanence et le déploiement le
; redémarrerait en boucle — c'est-à-dire qu'un correctif de performance aurait
; provoqué une panne totale.
ping.path = /ping
ping.response = pong

; Journal des requêtes lentes : la cause du constat A-010 était précisément
; qu'une requête lente bloquait tout le monde. Sans ce journal, on ne sait pas
; laquelle. Cinq secondes est volontairement haut : on cherche les pathologies,
; pas le bruit.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s

; Les erreurs des enfants doivent atterrir dans le journal du conteneur, pas
; dans un fichier que personne ne lira.
catch_workers_output = yes
decorate_workers_output = no

; N'exécuter que du PHP. Réglage par défaut de php-fpm, réaffirmé ici parce que
; c'est la seule barrière entre « FastCGI reçoit un chemin » et « FastCGI
; exécute ce qu'on lui désigne ».
security.limit_extensions = .php
