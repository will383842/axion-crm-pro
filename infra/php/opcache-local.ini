; ─────────────────────────────────────────────────────────────────────────────
; OPCACHE — DÉVELOPPEMENT LOCAL UNIQUEMENT.
;
; Monté seulement par `docker-compose.local.yml`, qui n'est jamais chargé en
; production (Compose n'auto-charge que `docker-compose.yml` et
; `docker-compose.override.yml`).
;
; ── POURQUOI ────────────────────────────────────────────────────────────────
; Mesuré le 2026-08-17 sur le poste Windows :
;
;   $ time php -r 'require "vendor/autoload.php"; require "bootstrap/app.php";'
;   real 26.08s   user 0.35s   sys 0.93s
;
; 26 secondes d'horloge pour 1,3 s de CPU : tout le reste est de l'ATTENTE
; DISQUE. Le code est monté depuis l'hôte (`./backend:/var/www/html:cached`) et
; chaque requête relit des milliers de fichiers à travers la couche de partage
; de fichiers de Docker Desktop. L'API répondait en 25 à 90 s, et se bloquait
; entièrement dès qu'un navigateur gardait des connexions ouvertes — `php -S`
; ne sert qu'une connexion à la fois.
;
; Conséquence concrète : les 26 captures d'écran exigées par le §E.4 des
; scénarios E2E étaient inatteignables, non par un défaut du produit, mais
; parce que l'environnement mettait plusieurs minutes par écran.
;
; ── CE QUE ÇA CHANGE ────────────────────────────────────────────────────────
; `php -S` est un SAPI CLI : sans `enable_cli`, opcache reste inerte. Le
; processus serveur étant long, le cache est partagé par toutes les requêtes
; qu'il sert — le coût des 26 s n'est payé qu'une fois.
;
; ── LE RÉGLAGE QUI COMPTE : `validate_timestamps=0` ─────────────────────────
; Mesuré, sur la même pile :
;
;   validate_timestamps=1 : 71 s (froid) puis 13 à 21 s par requête
;   validate_timestamps=0 : 90 s (froid) puis 0,6 à 1,1 s par requête
;
; Avec la validation active, opcache continue de faire un `stat()` sur chaque
; fichier à chaque requête — et c'est précisément le `stat()` qui coûte cher à
; travers le partage de fichiers de Docker Desktop. Le gain vient de son
; suppression, pas de la mise en cache elle-même.
;
; ⚠️ CONTREPARTIE, à connaître : le code PHP modifié n'est PLUS relu. Après
; toute édition dans `backend/`, il faut recréer le conteneur :
;   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --force-recreate api
; C'est le bon compromis pour JOUER un E2E (on ne modifie pas le code pendant
; qu'on le mesure). Pour développer en modifiant du PHP, repasser à
; `validate_timestamps=1` et accepter les 13 à 21 s.
; ─────────────────────────────────────────────────────────────────────────────
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
realpath_cache_size=4096k
realpath_cache_ttl=600
