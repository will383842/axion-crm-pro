#!/usr/sbin/nft -f
# Serveur d'envoi (Hetzner, DISTINCT de la prod du CRM). Modele : l'installateur
# remplace les marqueurs <...> puis valide avec `nft -c` avant toute charge.
# Deux IP : <ip-gestion> (passerelle HTTPS 443 + WireGuard d'administration) et
# <ip-envoi> (AUCUNE entree ; sortie limitee au port 25 TCP).
# Decision D7 : AUCUN tunnel vers la prod du CRM. Le CRM ouvre un HTTPS signe HMAC
# vers <ip-gestion>:443 ; WireGuard ne sert qu'a l'administration.
#   entree : 443 depuis <ip-crm-prod> vers <ip-gestion> ; WireGuard UDP vers <ip-gestion> ;
#            SSH uniquement une fois dans le tunnel wg0 ; rien du tout vers <ip-envoi>.
#   sortie : SMTP (25) seulement depuis <ip-envoi> ; depuis <ip-gestion> seulement
#            WireGuard, DNS, HTTPS 443 (images, paquets) et NTP (horloge HMAC a 5 min).
# NOTE `flush ruleset` : efface TOUT le jeu de regles, y compris celles que Docker
# (iptables-nft) a creees. Sans impact ici (compose en network_mode: host, aucun
# port publie) ; si on publie un port un jour, relancer docker apres chargement.
# Garde statique (liste blanche exacte) : tests/verifier-nftables.sh

flush ruleset

define ip_envoi = <ip-envoi>
define ip_gestion = <ip-gestion>
define ip_crm_prod = <ip-crm-prod>
define wg_port = <port-wg>
define ip_resolveur = <ip-resolveur>

table inet filtre {
  chain input {
    type filter hook input priority 0; policy drop;
    ip daddr $ip_envoi ct state new drop
    iif "lo" accept
    ct state invalid drop
    ct state established,related accept
    ip saddr $ip_crm_prod ip daddr $ip_gestion tcp dport 443 accept
    ip daddr $ip_gestion udp dport $wg_port accept
    iifname "wg0" tcp dport 22 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    ip saddr $ip_gestion udp sport $wg_port accept
    oifname "wg0" accept
    ip saddr $ip_gestion ip daddr $ip_resolveur udp dport 53 accept
    ip saddr $ip_gestion ip daddr $ip_resolveur tcp dport 53 accept
    ip saddr $ip_gestion tcp dport 443 accept
    ip saddr $ip_gestion udp dport 123 accept
    ip saddr $ip_envoi tcp dport 25 accept
  }
}
