#!/usr/sbin/nft -f
# Serveur d'envoi (Hetzner, DISTINCT de la prod du CRM). Modele : l'installateur
# remplace les marqueurs <...> puis valide avec `nft -c` avant toute charge.
# Principe : tout est refuse ; on ouvre le strict minimum, et rien d'autre.
#   entree : WireGuard UDP seulement (+ SSH, uniquement une fois dans le tunnel wg0)
#   sortie : SMTP (25) seulement depuis <ip-envoi> ; le reste du trafic sortant est refuse.
# Garde statique : tests/verifier-nftables.sh

flush ruleset

define ip_envoi = <ip-envoi>
define wg_port = <port-wg>
define ip_resolveur = <ip-resolveur>

table inet filtre {
  chain input {
    type filter hook input priority 0; policy drop;
    iif "lo" accept
    ct state invalid drop
    ct state established,related accept
    udp dport $wg_port accept
    iifname "wg0" tcp dport 22 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
  chain output {
    type filter hook output priority 0; policy drop;
    oif "lo" accept
    ct state established,related accept
    udp sport $wg_port accept
    oifname "wg0" accept
    ip daddr $ip_resolveur udp dport 53 accept
    ip daddr $ip_resolveur tcp dport 53 accept
    ip saddr $ip_envoi tcp dport 25 accept
  }
}
